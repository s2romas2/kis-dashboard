name: 증권사 리포트 수집
on:
  schedule:
    - cron: '0 0,3 * * 1-5'
  workflow_dispatch: {}
  push:
    paths: ['reports.py']
permissions:
  contents: write
jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: pypdf 설치
        run: pip install pypdf
      - name: 수집
        run: python reports.py
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/reports.json 2>/dev/null || true
          git commit -m "리포트 갱신" || echo "변경 없음"
          git pull --rebase -X theirs origin main || true
          git push || true
