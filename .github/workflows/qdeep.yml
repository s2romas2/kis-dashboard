name: 종목 딥다이브 수집
on:
  schedule:
    - cron: '35 20 * * 1-5'
    - cron: '35 4 * * 2-6'
  workflow_dispatch: {}
  push:
    paths: ['qdeep.py', 'qdeep_targets.json']
permissions:
  contents: write
jobs:
  qdeep:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 수집
        env:
          DART_KEY: ${{ secrets.DART_KEY }}
        run: python qdeep.py
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/qdeep 2>/dev/null || true
          git add public/data/qdeep_error.json 2>/dev/null || true
          git commit -m "종목 딥다이브 갱신" || echo "변경 없음"
          git pull --rebase -X theirs origin main || true
          git push || true
