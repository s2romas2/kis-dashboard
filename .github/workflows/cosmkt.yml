name: 마케팅비(광고선전비) 수집

# 광고선전비는 손익계산서 본문이 아니라 판매비와관리비 '주석' 표에 있다.
# XBRL API 로는 못 가져오고 정기보고서 원문을 받아 표를 찾아야 한다.
# 먼저 PROBE 로 '어떤 모양인지'만 확인한 뒤 본수집을 붙인다.
on:
  workflow_dispatch:
    inputs:
      probe:
        description: '프로브만 (1=진단, 0=본수집)'
        default: '1'
      codes:
        description: '프로브 대상 종목코드 (쉼표)'
        default: '090430,278470,237880,257720,214150'
      maxrun:
        description: '본수집에서 한 번에 돌 종목 수 (한 곳당 보고서 13건 × 수 MB — 약 5분)'
        default: '6'
  schedule:
    - cron: '50 20 * * *'      # 매일 05:50 KST — 본수집(PROBE=0)
  push:
    paths: ['cosmkt.py']
permissions:
  contents: write
jobs:
  cosmkt:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 수집
        env:
          DART_KEY: ${{ secrets.DART_KEY }}
          # 수동 실행은 입력값을, 예약·푸시 실행은 본수집(0)을 쓴다
          PROBE: ${{ github.event.inputs.probe || (github.event_name == 'workflow_dispatch' && '1' || '0') }}
          CODES: ${{ github.event.inputs.codes || '090430,278470,237880,257720,214150' }}
          MAXRUN: ${{ github.event.inputs.maxrun || '6' }}
          OUT: public/data/cospeer_mkt.json
        run: python cosmkt.py
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # git add 는 pathspec 중 하나라도 없으면 전체가 실패해 아무것도 담기지 않는다.
          # 첫 실행에서 probe 만 생기고 본수집 파일이 없어 커밋이 통째로 비었다 — 하나씩 담는다.
          for f in public/data/cosmkt_probe.json public/data/cosmkt.json public/data/cospeer_mkt.json; do
            [ -f "$f" ] && git add "$f" && echo "담음: $f"
          done
          git status --short
          git commit -m "마케팅비 수집 결과" || echo "변경 없음"
          git pull --rebase origin main || true
          git push || true
