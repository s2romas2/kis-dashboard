name: 주도 업종 수집
on:
  schedule:
    - cron: '15 0-6 * * 1-5'
    - cron: '45 6 * * 1-5'
  workflow_dispatch: {}
  push:
    paths: ['leaders.py']
permissions:
  contents: write
concurrency:
  group: leaders
  cancel-in-progress: false   # 시간별 cron이 백필 실행과 겹치면 취소하지 않고 대기
jobs:
  leaders:
    runs-on: ubuntu-latest
    timeout-minutes: 110   # 일·주봉 딥 백필(~3,000콜, GitHub→KIS 지연으로 1시간 안팎) 여유. 타임아웃돼도 업종별 중간 저장분 커밋
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 수집
        env:
          KIS_APPKEY: ${{ secrets.KIS_APPKEY }}
          KIS_APPSECRET: ${{ secrets.KIS_APPSECRET }}
        run: python leaders.py || true
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/leaders.json || true
          git add public/data/leadershist.json || true
          git add public/data/leaders_error.json || true
          git commit -m "주도 업종 갱신" || echo "변경 없음"
          git pull --rebase -X theirs origin main || true
          git push || true
