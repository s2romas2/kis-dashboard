<style>

<style>
/* ───────── 한글 줄바꿈: 단어 중간에서 끊기지 않게 (전역) */
body, p, td, th, li, dd, dt, .mini, .note, .nb, .easy, .card, .keynote, .warnfc, .lead, .meta, .pos { word-break:keep-all; overflow-wrap:break-word; }
p, li, dd, .keynote, .nb, .note, .warnfc, .easy p, .card p { text-wrap:pretty; }

/* ───────── 표 아래 개념 설명 — 작은 회색 글씨를 읽히는 크기로 */
.keynote { background:#fff; border:1px solid #e4e7ec; border-left:4px solid #2a78d6; border-radius:10px;
  padding:11px 14px; margin:-2px 0 16px; font-size:13.5px; line-height:1.95; color:#28303f; }

/* 핵심 한 줄 — 가장 강한 강조 */

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f0=v=>v==null||isNaN(v)?'—':Math.round(v).toLocaleString(), f1=v=>v==null||isNaN(v)?'—':Number(v).toFixed(1);
const eok=v=>v==null||isNaN(v)?'—':Math.abs(v)>=10000?(v/10000).toFixed(Math.abs(v)>=100000?0:1).replace(/\B(?=(\d{3})+(?!\d))/g,',')+'조':Math.round(v).toLocaleString()+'억';
const VZ={c:['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#7a5cd6'], gray:'#c9cdd4', ink:'#1a1f2e', sub:'#667085', grid:'#eef0f3', font:'-apple-system,"Segoe UI","Malgun Gothic",sans-serif'};
let TREE, CHD, BB, REP={}, SV={}, PRD={}, CH={}, G2C={}, CO2CH={};
const j=async(u)=>{ try{ const r=await fetch(u,{cache:'no-store'}); if(!r.ok) return null; return await r.json(); }catch(e){ return null; } };
function mk(id,cfg){ if(CH[id]) CH[id].destroy(); const el=$(id); if(!el) return; CH[id]=new Chart(el.getContext('2d'),cfg); }
function killCharts(){ for(const k in CH){ try{ CH[k].destroy(); }catch(e){} delete CH[k]; } }
Chart.defaults.font.family=VZ.font; Chart.defaults.font.size=11; Chart.defaults.color=VZ.sub;
const vzLabel={id:'vzLabel', afterDatasetsDraw(ch,_a,o){ if(!o||!o.fmt) return; const ctx=ch.ctx; ctx.save(); ctx.font='600 11px '+VZ.font; ctx.fillStyle=VZ.ink; const hz=ch.options.indexAxis==='y';
  ch.data.datasets.forEach((ds,di)=>{ if(o.only!=null&&o.only!==di) return; ch.getDatasetMeta(di).data.forEach((el,i)=>{ const v=ds.data[i]; if(v==null) return; const t=o.fmt(v,i,di); if(!t) return;
    if(hz){ ctx.textAlign=v<0?'right':'left'; ctx.textBaseline='middle'; ctx.fillText(t, el.x+(v<0?-5:5), el.y); } else { ctx.textAlign='center'; ctx.textBaseline=v<0?'top':'bottom'; ctx.fillText(t, el.x, el.y+(v<0?4:-4)); } }); }); ctx.restore(); }};
const ax=(o)=>Object.assign({grid:{color:VZ.grid,drawTicks:false},border:{display:false},ticks:{color:VZ.sub,padding:6}},o||{});
function hbar(id,labels,data,colors,o){ o=o||{}; mk(id,{type:'bar',data:{labels,datasets:[{data,backgroundColor:colors,borderRadius:4,borderSkipped:false,maxBarThickness:16}]},plugins:[vzLabel],
  options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',layout:{padding:{right:o.pad||58,left:0}},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+(o.fmt?o.fmt(c.raw):c.raw)}},vzLabel:{fmt:o.fmt||(v=>f0(v))}},
    scales:{x:ax({ticks:{color:VZ.sub,maxTicksLimit:5,callback:o.tick||(v=>f0(v))}}),y:ax({grid:{display:false},ticks:{color:VZ.ink,font:{size:11.5}}})}}}); }
function vbar(id,labels,sets,o){ o=o||{}; mk(id,{type:'bar',data:{labels,datasets:sets},plugins:[vzLabel],
  options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:18}},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+c.dataset.label+' '+(o.fmt?o.fmt(c.raw):f0(c.raw))}},vzLabel:{fmt:o.lab,only:o.only}},
    scales:{x:ax({grid:{display:false},ticks:{color:VZ.sub,maxRotation:0,autoSkip:labels.length>12,maxTicksLimit:11,font:{size:10}}}),y:ax({beginAtZero:!!o.zero,ticks:{callback:v=>f0(v),maxTicksLimit:5}})}}}); }
function vline(id,labels,sets,o){ o=o||{}; mk(id,{type:'line',data:{labels,datasets:sets},
  options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+c.dataset.label+' '+(o.fmt?o.fmt(c.raw):f1(c.raw))}}},
    elements:{line:{borderWidth:2,tension:.25},point:{radius:2.5,hitRadius:10}},
    scales:{x:ax({grid:{display:false},ticks:{color:VZ.sub,maxRotation:0,autoSkip:labels.length>12,maxTicksLimit:11,font:{size:10}}}),y:ax({ticks:{callback:o.tick||(v=>f1(v)),maxTicksLimit:5},suggestedMin:o.min,suggestedMax:o.max})}}}); }
function vclip(s,w){ s=String(s||'').trim(); let n=0,i=0; for(;i<s.length;i++){ n+=/[ᄀ-￿]/.test(s[i])?1:0.58; if(n>w) break; } return i<s.length?s.slice(0,Math.max(1,i-1)).trim()+'…':s; }

/* ───────── 공통 조각 */
const TAGN={'증권사':'증권사·조사기관'};
const tagH=t=>t?`<span class="tag t${esc(t)}">${esc(TAGN[t]||t)}</span>`:'';
function srcH(ch,s){ if(!s||!s.length) return ''; return '<span class="sx">'+s.map(i=>{ const x=(ch.src||[])[i]; return !x?'':x.u?`<a href="${esc(x.u)}" target="_blank" rel="noopener" title="${esc(x.t)}">[${i+1}]</a>`:`<span title="${esc(x.t)}">[${i+1}]</span>`; }).join('')+'</span>'; }
const claim=(ch,x)=>`${esc(x.t)} ${tagH(x.tag)}${srcH(ch,x.s)}`;

function tbl(head,rows,cls){ return `<div class="tw"><table class="${cls||''}"><tr>${head.map(h=>`<th class="l">${h}</th>`).join('')}</tr>`+
  rows.map(r=>'<tr>'+r.map((c,i)=>`<td class="${i===0?'l k':''}">${c}</td>`).join('')+'</tr>').join('')+'</table></div>'; }
function fig(name,cap){ return `<div class="fig">${FIG[name]||''}</div>`+(cap?`<div class="figcap">${cap}</div>`:''); }
function keyn(h,html,warn){ return `<div class="keynote${warn?' warn':''}"><span class="h">${esc(h)}</span>${html}</div>`; }
function key1(h,html){ return `<div class="key1"><span class="h">${esc(h)}</span>${html}</div>`; }
let _dn=0;
function dual(easyHtml,deepHtml){
  const id='d'+(++_dn);
  return `<div class="seg noprint" data-dual="${id}"><button type="button" class="on" data-m="e">쉬운 설명</button><button type="button" data-m="d">자세한 설명</button></div>
    <div class="easy" id="${id}e"><div class="h">쉬운 설명</div>${easyHtml}</div>
    <div class="deepbox" id="${id}d" style="display:none"><div class="h">자세한 설명</div>${deepHtml}</div>`;
}
function bindDual(root){
  (root||document).querySelectorAll('[data-dual]').forEach(seg=>{
    const id=seg.dataset.dual;
    seg.querySelectorAll('button').forEach(b=>{ b.onclick=()=>{
      seg.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
      const e=$(id+'e'), d=$(id+'d'); if(!e||!d) return;
      if(b.dataset.m==='e'){ e.style.display=''; d.style.display='none'; } else { d.style.display=''; e.style.display='none'; }
    };});
  });
}


/* 본문 문단 안의 출처 표기 (보도 s0, s1) → 태그 + 각주 링크 */
function proseH(ch,t){
  const src=ch.src||[];
  return esc(t).replace(/\(([^()]*\bs\d+[^()]*)\)/g,(m,inner)=>{
    const body=inner.replace(/\bs(\d+)\b/g,(_,n)=>{ const i=+n, x=src[i];
      return !x?`[?]`:x.u?`<a href="${esc(x.u)}" target="_blank" rel="noopener" title="${esc(x.t)}">[${i+1}]</a>`:`<span title="${esc(x.t)}">[${i+1}]</span>`; });
    return `<span class="sx">(${body})</span>`;
  });
}

            company:['개별 기업','종목 단위 분석']};
const dDays=d=>{ const t=Date.parse(d+'T00:00:00'); return isNaN(t)?null:Math.floor((Date.now()-t)/864e5); };
function repRow(r){
  const ag=dDays(r.d), fresh=ag!=null&&ag<=183;
  return `<tr><td class="l nw">${esc(r.d||'')}${fresh?' <span class="pill c">6개월</span>':''}</td>
    <td class="l nw">${esc(r.b||'')}${(r.an||[]).length?`<div class="mini">${esc((r.an||[]).join(', '))}</div>`:''}</td>
    <td class="l">${r.u?`<a href="${esc(r.u)}" target="_blank" rel="noopener">${esc(r.t||'')}</a>`:esc(r.t||'')}
      ${r.sum?` <a class="sumlink" href="/repsum.html#r=${esc(r.sum)}">🔍 정밀요약</a>`:''}
      ${r.why?`<div class="mini">${esc(r.why)}</div>`:(r.note?`<div class="mini" style="color:#98a2b3">${esc(r.note)}</div>`:'')}</td>
    ${r.code?`<td class="l nw">${TREE.co[r.code]?coLink(r.code):esc(r.code)}</td>`:'<td></td>'}</tr>`;
}
function repSection(tier,rows,opts){
  opts=opts||{};
  if(!rows||!rows.length) return opts.hideEmpty?'':`<div class="mini" style="margin-bottom:10px">${esc(REPT[tier][0])} 리포트는 아직 모으지 못했다.</div>`;
  rows=rows.slice().sort((a,b)=>String(b.d||'').localeCompare(String(a.d||'')));
  const n6=rows.filter(r=>{const a=dDays(r.d); return a!=null&&a<=183;}).length;
  return `<h3 style="margin:14px 0 4px">${esc(REPT[tier][0])} <small>${rows.length}건 · 최근 6개월 ${n6}건</small></h3>
    <div class="mini" style="margin-bottom:5px">${esc(REPT[tier][1])}</div>
    <div class="tw" style="margin-bottom:8px"><table><tr><th class="l">발행일</th><th class="l">증권사</th><th class="l">제목</th><th class="l">${tier==='company'?'종목':''}</th></tr>
    ${rows.map(repRow).join('')}</table></div>`;
}
function repBlock(){
  if(!REP||!(REP.concept||REP.industry||REP.company)) return '';
  const n=(REP.concept||[]).length+(REP.industry||[]).length+(REP.company||[]).length;
  if(!n) return '';
  return `<h2>증권사 리포트 <small>${n}건 · 수집 ${esc(REP.updated||'')}</small></h2>`+
    repSection('concept',REP.concept)+repSection('industry',REP.industry)+repSection('company',REP.company)+
    `<div class="mini" style="margin-bottom:14px">제목을 누르면 원문 PDF가 열린다(공개 주소가 없는 리포트는 제목만). <b>🔍 정밀요약</b>은 이 사이트의 리포트 정밀요약으로 이어진다. 리포트의 목표주가·전망치는 <b>증권사 추정</b>이지 확정된 숫자가 아니다.</div>`;
}
function repOf(code){
  const out=[];
  for(const t of ['company','industry','concept'])
    for(const r of (REP&&REP[t])||[]) if(r.code===code) out.push(Object.assign({},r,{tier:t}));
  return out.sort((a,b)=>String(b.d||'').localeCompare(String(a.d||'')));
}

/* ───────── 왼쪽 목차 */
function renderSide(cur){
  const h=['<h2><a href="#" style="color:#1a2a4a">🤖 로봇 교과서</a></h2><input id="q" placeholder="기업명·종목코드 찾기" autocomplete="off"><div id="sr"></div>',
    `<details class="toc" ${innerWidth>900||!(cur.gid||cur.code||cur.top)?'open':''}><summary>목차 (대분류 → 중분류 → 세분류)</summary>`];
  for(const T of TREE.top){
    const n=new Set(T.mid.flatMap(M=>M.g.flatMap(g=>g.co))).size;
    const open=cur.top===T.id||(cur.gid&&(pathOf(cur.gid)||[])[0]&&pathOf(cur.gid)[0].id===T.id);
    h.push(`<details ${open?'open':''}><summary><a href="#t=${T.id}" style="color:inherit">${esc(T.name)}</a> <small style="color:#98a2b3;font-weight:400">${n}</small></summary>`);
    for(const M of T.mid){
      h.push(`<div class="mid">${esc(M.name)}</div>`);
      for(const g of M.g){
        const on=cur.gid===g.id, wr=G2C[g.id]?' ✍':'';
        h.push(`<a class="g ${on?'on':''}" href="#g=${g.id}">${esc(g.name)}<small> · ${g.co.length}${wr}</small></a>`);
        if(on) for(const c of g.co.slice().sort(byCap)) h.push(`<a class="c ${cur.code===c?'on':''}" href="#c=${c}">${esc(coN(c))}</a>`);
      }
    }
    h.push('</details>');
  }
  const free=Object.values(CHD.ch||{}).filter(c=>!(c.groups||[]).length);
  if(free.length){ h.push(`<details ${cur.cid?'open':''}><summary>기술 장 <small style="color:#98a2b3;font-weight:400">${free.length}</small></summary>`);
    for(const c of free) h.push(`<a class="g ${cur.cid===c.id?'on':''}" href="#ch=${c.id}">${esc(c.title)}<small> · ${(c.companies||[]).length} ✍</small></a>`);
    h.push('</details>'); }
  h.push('</details><div class="mini" style="margin-top:8px;padding:0 4px">✍ 표시는 글로 쓴 분야입니다. 나머지는 숫자와 분류만 나옵니다.</div>');
  $('side').innerHTML=h.join('');
  const q=$('q'); q.addEventListener('input',()=>{
    const v=q.value.trim().toLowerCase(); const sr=$('sr'); if(!v){ sr.innerHTML=''; sr.className=''; return; }
    const hit=Object.keys(TREE.co).filter(c=>c.includes(v)||coN(c).toLowerCase().includes(v)).sort(byCap).slice(0,30);
    sr.className=hit.length?'sr':'';
    sr.innerHTML=hit.map(c=>`<a href="#c=${c}">${esc(coN(c))} <small>${c}</small></a>`).join('')||'';
  });
}

/* ───────── 메타 줄 (작성일 규칙) */
function metaLine(written){
  const bits=[];
  if(written) bits.push(`<b>작성일</b> ${esc(written)}`);
  bits.push(`<b>분류</b> ${esc(TREE.updated||'—')}`);
  if(priceDay()) bits.push(`<b>주가·PER 기준일</b> ${priceDay()}`);
  if(BB&&BB.asof) bits.push(`<b>실적</b> ${esc(BB.asof)} 기준 (수집 ${esc(String(BB.updated||'').slice(0,10))})`);
  else bits.push(`<b>실적</b> 숫자 수집 전 <span style="color:#98a2b3">(첫 수집이 끝나면 5년 실적·공시 이력이 나온다)</span>`);
  return `<div class="meta">${bits.join(' · ')}</div>`;
}

   `<div class="kpis">
     <div class="kpi"><div class="k">대분류</div><div class="v">${nT}</div><div class="n">근육·관절부터 설치·관제까지</div></div>
     <div class="kpi"><div class="k">중분류 · 세분류</div><div class="v">${nM} · ${nG}</div><div class="n">세분류가 공부 단위</div></div>

   </div>`,
   `<div class="nb"><b>읽는 순서</b> — ① 아래 기본 지식(로봇의 종류 → 신체 비유 → 관절 하나의 속 → 원가 순위 → 밸류체인 → 보는 법 5단계)을 먼저 보고 ② 대분류에서 관심 부위를 고른 뒤 ③ 세분류로 들어가 분야 설명을 읽고 ④ 기업으로 들어가 숫자·특장점·리스크를 본다. 분야 설명은 <b>쉬운 설명 / 자세한 설명</b>을 버튼으로 바꿔 볼 수 있다.<br>
     <b>이 교과서는 휴머노이드에 무게를 뒀다.</b> 휴머노이드는 아직 매출이 거의 없는 산업이라, 숫자 가운데 상당수가 <b>증권사 가정</b>이다. 그런 숫자에는 "증권사 가정"이라고 적고 리포트 쪽수를 붙였다([NH p.38] 식). 기업은 국내 상장사만 분류에 넣었고, 해외·비상장 기업은 분야 설명 안에서 다룬다.</div>`,

   `<h2>더 깊이 읽기 <small>긴 글 4편 · 리포트 정밀요약에서 이쪽으로 옮겼다</small></h2>`,
   `<div class="grid4" style="margin-bottom:6px">${DEEPREAD.map(([id,k,t,d])=>`<a class="card deepc" href="/repsum.html#r=${id}" style="display:block;border-left:4px solid #2a78d6;margin-bottom:0;color:inherit;text-decoration:none">
      <span class="pill c">${esc(k)}</span><h3 style="margin:6px 0 4px;color:#1d4ed8">${esc(t)}</h3><div class="mini">${esc(d)}</div></a>`).join('')}</div>
    <div class="mini" style="margin-bottom:14px">아래 기본 지식과 분야 설명은 이 네 편과 증권사 리포트 3건을 교과서 길이로 줄인 것이다. 표·그림·출처 전체는 긴 글에 있다.</div>`,

   `<h2>1. 로봇의 종류 — 이미 온 로봇과 아직 오지 않은 로봇</h2>`,
   key1('가장 먼저 갈라 볼 것','로봇은 <b>이미 팔리고 있는 로봇</b>(산업용·협동·물류·청소·수술)과 <b>아직 오지 않은 로봇</b>(휴머노이드)으로 나뉜다. 매출은 앞쪽에서 나오고, 주가의 기대는 뒤쪽에 매겨진다. 2025년 기준 로봇청소기 회사 한 곳(Roborock)의 매출이 휴머노이드 1위권 회사(Unitree) 전체 매출의 약 11배다(계산).'),
   `<div class="card" style="padding:0;overflow:hidden;margin-bottom:12px">${tbl(['종류','쉬운 말','2025년 물량','단계','이 교과서에서'],KINDS.map(r=>[r[0],r[1],r[2],r[3],gA('g='+r[4],esc((pathOf(r[4])||[{},{},{name:''}])[2].name.split(' — ')[0])||'보기')]),'cmp')}</div>`,
   keyn('숫자의 출처와 한계','물량은 국제로봇연맹(IFR) World Robotics 2026의 2025년 실적이다 — <a href="https://ifr.org/ifr-press-releases/news/five-million-robots-now-operate-in-factories-globally" target="_blank" rel="noopener">산업용(2026-09-24)</a> · <a href="https://ifr.org/ifr-press-releases/news/global-sales-of-professional-service-robots-surge-24-percent" target="_blank" rel="noopener">서비스(2026-09-30)</a>. 서비스 로봇 숫자는 <b>IFR 표본 238개 업체 기준</b>이고 전체 추정치가 아니다. 협동로봇 약 6.6만 대는 "산업용 설치의 11%"에서 계산한 값이다. 휴머노이드는 집계 기관마다 정의가 달라 7,000대(IFR)와 13,000대(Omdia)가 함께 쓰인다. 서빙 로봇 한국 보급 대수는 국내 보도 기준이다.<br>IFR은 휴머노이드를 "실험실에서 시범으로 넘어가는 단계이고 안전·학습 데이터·경제성이 과제"라고 평가한다. 나라별 사정은 '+gA('ch=country','국가별 지형')+' 장에 있다.'),

   `<h2>2. 로봇의 구조 — 사람 몸에 비유하면</h2>`,
   fig('body','<b>머리·근육·관절·손·몸통·다리</b>는 사용자가 준 밸류체인 그림(머니칸)의 비유를 새로 그린 것이고, <b>눈·감각·심장·뼈대·신경·일터</b>는 이 교과서가 더했다. 칸을 누르면 그 분류로 간다.'),
   dual(
    `<p>로봇은 사람 몸에 빗대면 쉽다. <b>머리</b>에는 보고 판단하는 두뇌(연산 칩과 AI, 제어·운영 소프트웨어)가 있다. <b>근육과 관절</b> 자리에는 힘을 내고 자세를 잡는 액추에이터와 감속기가 있다. 물건을 쥐는 <b>손</b>은 엔드이펙터(End-effector)라고 부른다. <b>몸통</b>은 로봇 본체이고, <b>다리</b>는 스스로 돌아다니는 이동 수단이다.</p>
     <p>여기에 다섯 가지를 더했다. 카메라와 센서는 <b>눈과 감각</b>, 모터에 전기를 보내는 드라이브와 전선은 <b>신경</b>, 배터리는 <b>심장</b>, 몸을 받치는 금속과 모터 속 자석은 <b>뼈대</b>다. 그리고 몸 밖에는 로봇이 일할 <b>일터</b>(설치·관제·스마트팩토리)가 있다.</p>
     <p>돈으로 보면 몸의 절반 이상이 근육·관절이다. 증권사 가정으로 휴머노이드 1대 원가의 52~60%가 액추에이터이고 손이 15~19%다 [NH p.38]. 반대로 값이 가장 크게 매겨지는 곳은 머리(로봇 AI 모델)인데, 이 자리는 해외·비상장 기업이 대부분이다.</p>`,
    `<p>이 교과서의 대분류 8개는 이 비유를 그대로 따른다 — 구동부(근육·관절) / 제어·전장(신경) / 감지(눈·감각) / 손(말단 장치) / 두뇌(칩·AI·소프트웨어) / 에너지·몸체·소재(심장·뼈대) / 완제품(몸통·다리) / 설치·관제·스마트팩토리(일터). 세분류는 부품 조사에서 나눈 53개 세부 분류와 소프트웨어·스마트팩토리 분류를 교과서에 맞게 묶은 것이다.</p>
     <p>부위마다 국내 기업의 두께가 다르다. 구동부는 관절 모듈·모터 쪽에 상장사가 있지만(로보티즈·삼현·현대모비스) 스크류와 손가락용 코어리스 모터는 약하다 [NH p.59·65]. 힘·촉각 센서와 로봇손은 비상장 회사가 중심이고, 카메라는 대기업 부품사(삼성전기·LG이노텍)가 들어간다. 두뇌 모델은 해외·비상장이고, 국내 상장사는 관제·설치(SI) 쪽에 가장 많이 몰려 있다.</p>
     <p>휴머노이드 1대에는 손을 빼고도 관절이 30개 안팎이다. Tesla Optimus Gen2는 회전형 14개와 선형 14개를 쓴다 [NH p.116]. 그래서 근육·관절은 부품 수로도 원가로도 가장 큰 부위다.</p>
     <p>한 회사가 여러 부위에 걸치는 경우가 많다. 로보티즈는 관절 모듈·손·학습 데이터에, 클로봇은 관제 소프트웨어와 이동 로봇 공급에, 원익홀딩스는 자회사를 통해 손에 걸친다. 이 교과서는 회사마다 대표 자리를 하나 정하고, 나머지 자리에도 함께 올렸다.</p>`),
   `<div class="card" style="padding:0;overflow:hidden;margin-bottom:12px">${tbl(['몸의 부위','로봇에서는','하는 일','이 교과서의 분류','사용자 제공 그림'],BODYP.map(r=>[esc(r[0]),esc(r[1]),esc(r[2]),gA(r[3],esc(r[4])),r[5]]),'cmp')}</div>`,

   `<h2>3. 관절 하나의 속 — 액추에이터</h2>`,
   fig('joint','<b>위는 돌리는 관절(회전형), 아래는 밀고 당기는 관절(선형).</b> 둘의 차이는 주황 칸 하나 — 감속기냐 스크류냐다.'),
   dual(
    `<p>관절 하나를 뜯어 보면 네 가지가 들어 있다. ① 빨리 도는 <b>모터</b> ② 그 회전을 "천천히, 대신 세게"로 바꾸는 <b>감속기</b>(자전거의 저단 기어와 같다), 또는 회전을 밀고 당기는 직선 힘으로 바꾸는 <b>스크류</b>(나사) ③ 지금 몇 도 돌았는지, 힘이 얼마나 걸리는지 재는 <b>센서</b> ④ 모터에 전기를 얼마나 줄지 초당 수만 번 정하는 <b>제어기</b>.</p>
     <p>이 넷을 한 덩어리로 묶은 것이 <b>액추에이터</b>다. 돌리는 것은 회전형, 밀고 당기는 것은 선형이라고 부른다.</p>
     <p>로봇 회사는 이 묶음을 직접 설계하는 경우가 많다. 그래서 부품 회사를 볼 때는 "묶음 전체를 맡는가, 그 속의 감속기·모터·스크류 한 가지를 넣는가"를 먼저 가른다.</p>`,
    `<p>액추에이터 속 원가는 서너 부품에 고르게 나뉜다. NH투자증권의 2030년 Tesla Optimus 예상(증권사 가정)에서 회전형은 모터 33% · 감속기 31% · 힘/토크 센서 25% · 제어기+엔코더 8%, 선형은 유성 롤러 스크류 35% · 모터 31% · 힘/토크 센서 24% · 제어기+엔코더 7.5%다 [NH p.115].</p>
     <p>감속기는 쓰임에 따라 셋으로 갈린다. 얇고 가벼운 하모닉(파동기어), 무거운 하중을 버티는 RV·사이클로이드(산업용 로봇의 허리·어깨, 휴머노이드 하체), 단순하고 싼 정밀 유성이다. 정밀 유성은 저감속(QDD)과 다단 고감속 두 갈래로 쓰인다 [NH p.58][DS p.18].</p>
     <p>가장 급한 병목은 스크류다. 유성 롤러 스크류(PRS)는 선으로 맞닿아 힘이 세지만 정밀 연삭이 필요하고, 비중국 공급은 2028년 수요의 10%에 못 미친다는 추정이 있다 [NH p.59]. 연삭기 납기가 12~24개월이라 증설이 느리다는 조사도 있다.</p>
     <p>제어기는 로봇 회사의 핵심 설계 자산이어서 외주가 잘 열리지 않고, 묶음 조립을 밖에 맡기는 것은 대량 양산 단계에 가서라는 것이 NH의 정리다 [NH p.53]. 국내에서는 현대모비스가 Boston Dynamics Atlas용 액추에이터를 맡아 2028년 미국 공장 연 35만 개를 계획하고 [하나 p.64], 삼현이 북미 고객사향 초도 양산(2026년 12월)을 앞두고 있다 [NH p.132]. 자세한 것은 ${gA('g=dr_mod','액추에이터 모듈·모터')} · ${gA('g=dr_harm','감속기·스크류·베어링')} 분야에 있다.</p>`),

   `<h2>4. 원가 순위 한 장</h2>`,

/* ───────── 대분류 */
function renderTop(tid){
  killCharts(); const T=topOf(tid); if(!T){ $('main').innerHTML='<div class="card">없는 대분류입니다.</div>'; return; }
  const codes=[...new Set(T.mid.flatMap(M=>M.g.flatMap(g=>g.co)))].sort(byCap);
  const h=[`<div class="crumb"><a href="#">로봇 교과서</a> › ${esc(T.name)}</div><h1>${esc(T.name)}</h1>`,
    `<div class="lead">${esc(T.desc)}</div>`, metaLine(null)];
  for(const M of T.mid){
    h.push(`<h2>${esc(M.name)}</h2><div class="grid">`);
    for(const g of M.g){
      const ch=chOf(g.id);
      h.push(`<div class="card"><h3><a href="#g=${g.id}">${esc(g.name)}</a> <small>기업 ${g.co.length}${ch?' · ✍ 글 있음':''}</small></h3>
        ${ch?`<div class="mini" style="margin-bottom:7px">${esc(ch.one||'')}</div>`:''}
        <div class="chips">${g.co.slice().sort(byCap).map(c=>`<a class="chip" href="#c=${c}">${esc(coN(c))}<small> ${eok(sv(c).cap)}</small></a>`).join('')}</div></div>`);
    }
    h.push('</div>');
  }
  h.push(`<h2>이 대분류의 기업 — 시가총액 순</h2>`+peerTable(codes,null));
  h.push(peerChartsHtml('tp'));
  $('main').innerHTML=h.join('');
  peerCharts('tp',codes.slice(0,14),null);
}

/* ───────── peer 표·차트 (같은 분야 비교) */
function peerTable(codes,me){
  const rows=codes.map(c=>{ const v=sv(c); const f=((BB.co[c]||{}).fin)||{};
    const r4=(f.rq||[]).slice(-4), o4=(f.oq||[]).slice(-4);
    const ttmR=r4.every(x=>x!=null)&&r4.length===4?r4.reduce((a,b)=>a+b,0):null;
    const ttmO=o4.every(x=>x!=null)&&o4.length===4?o4.reduce((a,b)=>a+b,0):null;
    const opm=(ttmR&&ttmO!=null&&ttmR>0)?ttmO/ttmR*100:null;
    return {c,v,ttmR,opm};
  });
  return `<div class="tw"><table><tr><th class="l">기업</th><th>시가총액</th><th>주가</th><th>PER</th><th>PBR</th><th>ROE</th><th>최근 4분기 매출</th><th>영업이익률</th><th class="l">주요 사업</th></tr>`+
   rows.map(r=>`<tr class="${me===r.c?'me':''}"><td class="l nw">${coLink(r.c)} <small style="color:#98a2b3">${r.c}</small></td>
     <td class="nw">${eok(r.v.cap)}</td><td>${f0(r.v.px)}</td><td>${r.v.per==null?'—':f1(r.v.per)}</td><td>${r.v.pbr==null?'—':f1(r.v.pbr)}</td>
     <td>${r.v.roe==null?'—':f1(r.v.roe)+'%'}</td><td class="nw">${eok(r.ttmR)}</td>
     <td class="${r.opm==null?'':(r.opm<0?'bad':r.opm>=10?'ok':'')}">${r.opm==null?'—':f1(r.opm)+'%'}</td>
     <td class="l mini">${esc(vclip((PRD[r.c]||{}).p||'',34))}</td></tr>`).join('')+
   `</table></div><div class="mini" style="margin:5px 0 14px">시가총액·주가·PER·PBR·ROE는 시세 API 기준일 ${priceDay()||'—'}. 최근 4분기 매출·영업이익률은 DART 공시값을 더한 것으로, 네 분기가 모두 수집된 기업만 표시한다. PER가 비어 있으면 적자이거나 API가 값을 주지 않은 경우다.</div>`;
}
function peerChartsHtml(pfx){ return `<div class="grid4" style="margin:10px 0 14px">
  <div class="vz"><div class="vzt">시가총액<small>억원</small></div><div class="vzc" id="${pfx}C"><canvas id="${pfx}c"></canvas></div></div>
  <div class="vz"><div class="vzt">최근 4분기 매출<small>억원 · DART 공시값 합</small></div><div class="vzc" id="${pfx}R"><canvas id="${pfx}r"></canvas></div></div>
  <div class="vz"><div class="vzt">영업이익률<small>% · 최근 4분기</small></div><div class="vzc" id="${pfx}O"><canvas id="${pfx}o"></canvas></div></div>
  <div class="vz"><div class="vzt">PER<small>배 · 적자는 제외</small></div><div class="vzc" id="${pfx}P"><canvas id="${pfx}p"></canvas></div></div></div>`; }
function emptyIf(boxId,vals,msg){ const el=$(boxId); if(!el) return false;
  if(vals.some(v=>v!=null)) return false;
  el.innerHTML=`<div class="mini" style="display:flex;align-items:center;justify-content:center;height:100%;color:#98a2b3">${msg}</div>`; return true; }
function peerCharts(pfx,codes,me){
  const H=Math.max(110,codes.length*26+34);
  ['C','R','O','P'].forEach(k=>{ const el=$(pfx+k); if(el) el.style.height=H+'px'; });
  const L=codes.map(c=>vclip(coN(c),7));
  const col=c=>me&&c===me?VZ.c[1]:VZ.c[0];
  const cols=codes.map(col);
  const fin=c=>((BB.co[c]||{}).fin)||{};
  const ttm=(c,k)=>{ const a=(fin(c)[k]||[]).slice(-4); return a.length===4&&a.every(x=>x!=null)?a.reduce((x,y)=>x+y,0):null; };
  const dCap=codes.map(c=>sv(c).cap??null);
  const dRev=codes.map(c=>ttm(c,'rq'));
  const dOpm=codes.map(c=>{ const r=ttm(c,'rq'),o=ttm(c,'oq'); return (r&&o!=null&&r>0)?Math.max(-60,Math.min(60,o/r*100)):null; });
  const dPer=codes.map(c=>{ const p=sv(c).per; return p!=null&&p>0?Math.min(p,200):null; });
  if(!emptyIf(pfx+'C',dCap,'시가총액 값 없음')) hbar(pfx+'c',L,dCap,cols,{fmt:v=>eok(v),pad:66});
  if(!emptyIf(pfx+'R',dRev,'실적을 아직 받지 못함')) hbar(pfx+'r',L,dRev,cols,{fmt:v=>eok(v),pad:66});
  if(!emptyIf(pfx+'O',dOpm,'실적을 아직 받지 못함'))
    hbar(pfx+'o',L,dOpm,codes.map(c=>{ const r=ttm(c,'rq'),o=ttm(c,'oq'); const v=(r&&o!=null&&r>0)?o/r:0; return v<0?VZ.gray:col(c); }),{fmt:v=>f1(v)+'%',pad:54,tick:v=>f0(v)+'%'});
  if(!emptyIf(pfx+'P',dPer,'모두 적자이거나 PER 값 없음')) hbar(pfx+'p',L,dPer,cols,{fmt:v=>f1(v)+'배',pad:56});
}

/* ───────── 공시 이력 블록 */
const EVC={fund:['자금조달','#eb6834'],cap:['증자·감자','#eda100'],ma:['인수·매각','#2a78d6'],
           tstk:['자기주식','#1baf7a'],ctrl:['최대주주 변경','#7a5cd6'],risk:['소송·제재·경고','#b42318']};
function evCluster(ev){ const by={}; for(const e of ev||[]){ (by[e.c+'|'+e.k]=by[e.c+'|'+e.k]||[]).push(e); }
  const out=[]; for(const k in by){ const g=by[k].slice().sort((a,b)=>(b.d||'').localeCompare(a.d||''));
    const base=Object.assign({},g[g.length-1]); const last=g[0];
    for(const e of g) for(const f of ['amt','who','why','how','pct','prc']) if(base[f]==null&&e[f]!=null) base[f]=e[f];
    base.d=last.d; base.d0=g[g.length-1].d; base.n=g.length; out.push(base); }
  return out.sort((a,b)=>(b.d||'').localeCompare(a.d||'')); }
function evBlocks(code){
  const x=BB.co[code]||{}; if(!x.ev_at) return {html:`<div class="note">${BB.asof?'공시 이력을 아직 받지 못했습니다.':'<b>숫자 수집 전</b>입니다. 수집기가 처음 돌고 나면 자금조달·인수매각·지배구조 이력이 여기에 나옵니다.'}</div>`,draw(){}};
  const ev=evCluster(x.ev);
  if(!ev.length) return {html:`<div class="nb">최근 5년 안에 자금조달·인수매각·최대주주 변경·소송·제재로 분류되는 공시가 없다. <span class="tag t확인">확인</span> <span class="mini">수집일 ${esc(x.ev_at)}</span></div>`,draw(){}};
  const cats=[...new Set(ev.map(e=>e.c))];
  const html=`<div class="vz" style="margin-bottom:10px"><div class="vzt">공시 이력 타임라인<small>최근 5년 · 점 하나가 공시 한 건(정정 포함은 묶어 셈)</small></div>
     <div class="vzc" id="cE" style="height:${Math.max(120,cats.length*34+46)}px"><canvas id="cEc"></canvas></div>
     <div class="lg">${cats.map(c=>`<span><i style="background:${(EVC[c]||['','#98a2b3'])[1]}"></i>${esc((EVC[c]||[c])[0])}</span>`).join('')}</div></div>
   <div class="tw" style="margin-bottom:6px"><table><tr><th class="l">날짜</th><th class="l">종류</th><th class="l">공시 제목</th><th>금액</th><th class="l">상대방·사유</th></tr>
    ${ev.map(e=>`<tr><td class="l nw">${esc(e.d||'')}${e.n>1?`<small style="color:#98a2b3"> +${e.n-1}</small>`:''}</td>
      <td class="l nw"><span class="pill" style="background:${(EVC[e.c]||['','#98a2b3'])[1]}1f;color:${(EVC[e.c]||['','#667085'])[1]}">${esc((EVC[e.c]||[e.c])[0])}</span></td>
      <td class="l">${esc(e.k||'')}${e.fix?' <small style="color:#98a2b3">(정정)</small>':''}</td>
      <td class="nw">${e.amt!=null?eok(e.amt):'—'}</td>
      <td class="l mini">${esc([e.who,e.why,e.how,e.pct!=null?e.pct+'%':null,e.prc!=null?f0(e.prc)+'원':null].filter(Boolean).join(' · '))}${e.dref?' <span title="정정 공시라 같은 종류 중 날짜가 가장 가까운 공시의 내용을 붙였다">↩</span>':''}</td></tr>`).join('')}
   </table></div>
   <div class="mini" style="margin-bottom:12px">주요사항보고서(pblntf_ty=B)와 거래소 공시(I) <b>제목</b>으로 분류한 것이다. 내용은 반드시 원문에서 확인한다 — <a href="https://dart.fss.or.kr/dsab007/main.do" target="_blank" rel="noopener">DART</a>. 수집일 ${esc(x.ev_at)}. ${x.ev_more?'공시 건수가 많아 일부만 받았다.':''}`+
   `<br>이 표는 <b>사실의 목록</b>이고 좋고 나쁨의 판정이 아니다. 전환사채·유상증자는 주식 수가 늘 수 있다는 뜻이고, 소송·제재는 결과를 원문에서 봐야 한다.</div>`;
  return {html, draw(){
    // 날짜 어댑터 없이 쓰려고 x축은 linear(밀리초)로 두고 연도 눈금을 직접 만든다
    const T=d=>new Date(d+'T00:00:00').getTime(), y0=BB.y0||2021, yN=new Date().getFullYear();
    const ds=cats.map((c,i)=>({label:(EVC[c]||[c])[0], data:ev.filter(e=>e.c===c).map(e=>({x:T(e.d0||e.d),y:i,e})),
      backgroundColor:(EVC[c]||['','#98a2b3'])[1], borderColor:'#fff', borderWidth:2, pointRadius:6, pointHoverRadius:8}));
    mk('cEc',{type:'scatter',data:{datasets:ds},options:{responsive:true,maintainAspectRatio:false,layout:{padding:{right:10,top:6}},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>{ const e=c.raw.e; return ' '+(e.d0||e.d)+' '+vclip(e.k||'',38)+(e.who?' — '+e.who:'')+(e.amt!=null?' · '+eok(e.amt):''); }}}},
      scales:{x:ax({type:'linear',min:T(y0+'-01-01'),max:Date.now()+864e5*20,
                afterBuildTicks:a=>{ const tk=[]; for(let y=y0;y<=yN+1;y++) tk.push({value:T(y+'-01-01')}); a.ticks=tk.filter(t=>t.value<=a.max); },
                ticks:{color:VZ.sub,callback:v=>new Date(v).getFullYear()+'년'}}),
              y:ax({min:-0.5,max:cats.length-0.5,reverse:true,afterBuildTicks:a=>{ a.ticks=cats.map((_,i)=>({value:i})); },
                ticks:{color:VZ.ink,font:{size:11},callback:v=>cats[v]?vclip((EVC[cats[v]]||[cats[v]])[0],9):''}})}}});
  }};
}

    ${cos.map(c=>`<tr><td class="l nw">${coLink(c.code)}</td>${axes.map(a=>`<td class="l mini">${esc((c.axes||{})[a]||'—')}</td>`).join('')}</tr>`).join('')}</table></div>`);

      ${c.products.map(p=>`<tr><td class="l nw">${p.photo?`<a href="${esc(p.photo)}" target="_blank" rel="noopener">${esc(p.n)}</a>`:esc(p.n)}</td><td class="l">${esc(p.use||'')}</td><td class="l mini">${esc(p.share||'—')}</td></tr>`).join('')}</table></div>
      <div class="mini" style="margin:-8px 0 12px">제품명을 누르면 회사 공식 제품 페이지로 간다. 제품 사진은 이 사이트에 옮겨 싣지 않는다.</div>`);
    if((c.customers||[]).length) h.push(`<h2>고객사</h2><div class="card"><ul class="pl dot">${c.customers.map(x=>`<li>${claim(ch,x)}</li>`).join('')}</ul></div>`);
    h.push(`<h2>특장점과 리스크 요인</h2><div class="sr2">
      <div class="strongbox"><h3>특장점 <small>경쟁사 대비 더 잘하는 것</small></h3><ul class="sg">${(c.strong||[]).map(x=>`<li>${claim(ch,x)}</li>`).join('')||'<li class="mini">조사 중</li>'}</ul></div>
      <div class="riskbox"><h3>리스크 요인 <small>실적·주가를 망칠 수 있는 것</small></h3><ul class="rk">${(c.risk||[]).map(x=>`<li>${claim(ch,x)}</li>`).join('')||'<li class="mini">조사 중</li>'}</ul></div></div>`);
    if((ch.compare_axes||[]).length&&c.axes) h.push(`<div class="tw" style="margin-bottom:12px"><table>${ch.compare_axes.map(a=>`<tr><th class="l" style="width:28%">${esc(a)}</th><td class="l">${esc(c.axes[a]||'—')}</td></tr>`).join('')}</table></div>`);
  } else {
    h.push(`<div class="note">이 기업은 아직 <b>글로 쓴 조사가 없다.</b> 아래 숫자(5년 실적·공시 이력·같은 분야 비교)는 자동 수집된 것이고, 특장점·리스크는 분야를 지정해 요청하면 조사해 넣는다.</div>`);
  }
  const rp=repOf(code);
  if(rp.length) h.push(`<h2>이 종목 리포트 <small>${rp.length}건</small></h2>`+
    `<div class="tw" style="margin-bottom:6px"><table><tr><th class="l">발행일</th><th class="l">증권사</th><th class="l">제목</th><th class="l">분류</th></tr>`+
    rp.map(r=>{const ag=dDays(r.d),fresh=ag!=null&&ag<=183;
      return `<tr><td class="l nw">${esc(r.d||'')}${fresh?' <span class="pill c">6개월</span>':''}</td>
        <td class="l nw">${esc(r.b||'')}${(r.an||[]).length?`<div class="mini">${esc(r.an.join(', '))}</div>`:''}</td>
        <td class="l">${r.u?`<a href="${esc(r.u)}" target="_blank" rel="noopener">${esc(r.t||'')}</a>`:esc(r.t||'')}${r.why?`<div class="mini">${esc(r.why)}</div>`:''}</td>
        <td class="l nw mini">${esc((REPT[r.tier]||[''])[0])}</td></tr>`;}).join('')+
    `</table></div><div class="mini" style="margin-bottom:12px">리포트의 목표주가·전망치는 증권사 추정이다. 링크를 눌러 원문에서 확인한다.</div>`);
  h.push(`<h2>5개년 실적 <small>분기·연간 · DART 공시값</small></h2>`+fb.html);
  h.push(`<h2>자금조달 · 인수매각 · 지배구조 이력 <small>최근 5년</small></h2>`+eb.html);
  const peers=gs.length?[...new Set(gs.flatMap(([T,M,g])=>g.co))].sort(byCap):[];
  if(peers.length>1){
    h.push(`<h2>같은 세분류 기업과 비교 <small>${gs.map(([T,M,g])=>esc(g.name)).join(' · ')}</small></h2>`+peerTable(peers,code)+peerChartsHtml('cp'));
  }
  h.push(`<div class="btns noprint"><a href="https://dart.fss.or.kr/dsab007/main.do" target="_blank" rel="noopener">DART에서 이 회사 공시 보기</a>
    <a href="/deep.html#c=${code}">종목 딥다이브</a><a href="/bands.html#c=${code}">밴드·V차트</a><button type="button" onclick="window.print()">인쇄 / PDF</button></div>`);
  $('main').innerHTML=h.join('');
  fb.draw(); eb.draw();
  if(peers.length>1) peerCharts('cp',peers.slice(0,14),code);
}

/* ───────── 라우팅 */
function route(){
  const hs=location.hash||''; let m;
  const cur={};
  if((m=hs.match(/^#ch=([\w-]+)/))) cur.cid=m[1];
  else if((m=hs.match(/^#g=([\w-]+)/))) cur.gid=m[1];
  else if((m=hs.match(/^#c=([0-9A-Z]{6})/))) cur.code=m[1];
  else if((m=hs.match(/^#t=([\w-]+)/))) cur.top=m[1];
  if(cur.gid){ const p=pathOf(cur.gid); if(p) cur.top=p[0].id; }
  if(cur.code){ const g=groupsOf(cur.code); if(g.length){ cur.gid=g[0][2].id; cur.top=g[0][0].id; } }
  renderSide(cur);
  if(hs.startsWith('#ch=')) renderChapter(hs.slice(4).split('&')[0]);
  else if(hs.startsWith('#c=')&&cur.code) renderCompany(cur.code);
  else if(hs.startsWith('#g=')) renderGroup(hs.slice(3).split('&')[0]);
  else if(hs.startsWith('#t=')) renderTop(hs.slice(3).split('&')[0]);
  else renderHome();
  if(!hs) window.scrollTo(0,0);
}

(async function boot(){
  const [tree,chd,bb,rep,svj,prd]=await Promise.all([
    j('/data/robobook_tree.json'), j('/data/robobook_ch.json'), j('/data/robobook.json'),
    j('/data/robobook_rep.json'), j('/data/stockvals.json'), j('/data/products.json')]);
  if(!tree){ $('main').innerHTML='<div class="card">분류 파일(robobook_tree.json)을 불러오지 못했습니다.</div>'; return; }
  TREE=tree; CHD=chd||{ch:{}}; BB=bb||{co:{},ql:[],ay:[]}; REP=rep||{};
  if(!BB.co) BB.co={};
  SV=(svj&&svj.map)||{}; SV._at=(svj&&svj.updated)||''; PRD=(prd&&prd.map)||{};
  for(const id in (CHD.ch||{})){ const ch=CHD.ch[id];
    for(const g of (ch.groups||[])) G2C[g]=id;
    (ch.companies||[]).forEach((c,i)=>{ const p=(TREE.prim||{})[c.code], mine=!!p&&(ch.groups||[]).includes(p[2]);   // 기업 화면은 대표 자리가 속한 장의 카드를 쓴다
      if(!CO2CH[c.code]||(mine&&!CO2CH[c.code][2])) CO2CH[c.code]=[id,i,mine]; }); }
  addEventListener('hashchange',route); route();
})();
</script>
