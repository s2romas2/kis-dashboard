name: power
on:
  schedule:
    - cron: '20 21 * * *'
  workflow_dispatch: {}
  push:
    paths: ['power.py']
permissions:
  contents: write
jobs:
  power:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 의존성
        run: pip install openpyxl --quiet
      - name: 전력 파이프라인 수집
        env:
          CUSTOMS_KEY: ${{ secrets.CUSTOMS_KEY }}
          BLS_KEY: ${{ secrets.BLS_KEY }}
        run: python power.py
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/power.json 2>/dev/null || true
          git commit -m "전력 수요 파이프라인 갱신" || echo "변경 없음"
          git pull --rebase -X theirs origin main || true
          git push || true
