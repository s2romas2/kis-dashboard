<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>블로그 · 한국 대시보드</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { margin:0; background:#f6f7f9; color:#1a1f2e; font-family:-apple-system,"Segoe UI","Malgun Gothic",sans-serif; }
.wrap { max-width:1140px; margin:0 auto; padding:20px 18px 48px; }
header { display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:10px; }
h1 { font-size:20px; margin:0; font-weight:800; }
.sub { color:#6b7280; font-size:12.5px; margin:3px 0 0; }
a.back { font-size:12.5px; color:#2f6df6; text-decoration:none; }
.meta { font-size:12px; color:#8a93a2; }
.panel { background:#fff; border:1px solid #eceef2; border-radius:14px; padding:16px 18px; margin:14px 0; box-shadow:0 1px 2px rgba(20,30,60,.04); }
.chip { border:1px solid #d7dce4; background:#fff; color:#374151; border-radius:20px; padding:5px 12px; font-size:12.5px; font-weight:700; cursor:pointer; display:inline-block; margin:2px 3px 0 0; }
.chip.on { background:#1a2a4a; color:#fff; border-color:#1a2a4a; }
#q { width:100%; max-width:340px; padding:8px 12px; border:1px solid #d7dce4; border-radius:10px; font-size:13px; margin-top:8px; }
.post { background:#fff; border:1px solid #e5e8ee; border-radius:12px; padding:15px 17px; margin-top:10px; }
.p-head { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.dt { color:#8a93a2; font-size:11.5px; font-weight:700; flex:none; }
.who { background:#eef2f8; color:#5b6472; border-radius:6px; padding:1px 8px; font-size:10.5px; font-weight:800; flex:none; }
.cat { background:#fdf6e8; color:#b45309; border-radius:6px; padding:1px 7px; font-size:10.5px; font-weight:700; flex:none; }
.p-t { font-weight:800; font-size:14.5px; }
.p-t a { color:#1a1f2e; text-decoration:none; }
.p-t a:hover { color:#2f6df6; }
.tag { background:#e8f0ff; color:#2f5fd0; border-radius:6px; padding:1px 7px; font-size:10.5px; font-weight:800; margin-right:3px; cursor:pointer; }
.body { font-size:13px; color:#374151; line-height:1.8; margin-top:8px; position:relative; word-break:break-word; }
.body .plain { white-space:pre-wrap; }
.body .par { margin:0 0 7px; }
.body .bimg { display:block; max-width:min(100%,560px); max-height:440px; object-fit:contain; border:1px solid #e5e8ee; border-radius:8px; margin:9px 0; cursor:zoom-in; background:#fafbfc; }
.body .bfile { display:inline-block; background:#f0f4fa; border:1px solid #c9d4e8; border-radius:9px; padding:6px 12px; font-size:12.5px; font-weight:800; color:#2f6df6; margin:7px 6px 7px 0; text-decoration:none; }
.body .bfile:hover { background:#e4edfb; }
.body.clamp { max-height:150px; overflow:hidden; cursor:pointer; }
.body.clamp::after { content:''; position:absolute; bottom:0; left:0; right:0; height:52px; background:linear-gradient(rgba(255,255,255,0),#fff 85%); }
.fold { display:inline-block; margin-top:5px; color:#2f6df6; font-size:11.5px; font-weight:800; cursor:pointer; user-select:none; }
.imgs { display:flex; gap:8px; flex-wrap:wrap; margin-top:9px; }
.imgs img { max-height:130px; max-width:200px; border:1px solid #e5e8ee; border-radius:8px; cursor:zoom-in; object-fit:cover; }
.hint { font-size:11.5px; color:#8a93a2; margin-top:8px; line-height:1.6; }
.hint b { color:#5b6472; }
.loading { text-align:center; padding:40px; color:#6b7280; font-size:13px; }
#viewer { display:none; position:fixed; inset:0; background:rgba(10,15,30,.85); z-index:50; align-items:center; justify-content:center; cursor:zoom-out; }
#viewer img { max-width:94vw; max-height:92vh; border-radius:8px; }
@media (max-width:720px){ .wrap{padding:14px 10px 40px;} }
</style>
</head>
<body>
<script src="/nav.js"></script>
<div class="wrap">
  <header>
    <div>
      <h1>📓 블로그</h1>
      <div class="sub">구독 블로거 새 글 자동 수집 — 본문 전문 + 이미지 + 종목 태그</div>
      <div style="margin-top:6px"><a class="back" href="/">← 섹터 대시보드</a></div>
    </div>
    <div class="meta" id="meta">불러오는 중…</div>
  </header>

  <div class="panel">
    <div id="whobar"></div>
    <div id="secbar" style="margin-top:6px"></div>
    <input id="q" placeholder="제목 · 본문 · 종목명 검색" oninput="render()">
  </div>

  <div id="list"><div class="loading">불러오는 중…</div></div>
  <div class="hint">긴 글은 자동으로 접혀요 — 본문이나 "펼치기"를 클릭하면 전체 글이 보입니다. 제목 클릭 시 원문으로 이동. 파란 태그는 특장점 노트에 있는 종목이 글에 언급됐다는 뜻이고, 클릭하면 그 종목으로 검색됩니다. <b>블로거 추가는 대화에서 "블로그에 ○○○ 추가해줘"(blog.naver.com/ 뒤의 ID)라고 요청하세요.</b> 하루 3회 자동 수집됩니다.</div>
</div>
<div id="viewer" onclick="this.style.display='none'"><img id="viewerImg"></div>
<script>
let D=null, WHO='전체', SEC='전체', IND_MAP={};
const OPEN=new Set();
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
window.setWho=function(w){ WHO=w; render(); };
window.setSec=function(s){ SEC=s; render(); };
function postSecs(p){ // 글의 산업 = 블로거 주력 분야 + 종목 태그의 산업들
  const out=new Set([p.sec||'종합']);
  for(const t of (p.tags||[])) if(IND_MAP[t]) out.add(IND_MAP[t]);
  return out;
}
window.zoom=function(src){ document.getElementById('viewerImg').src=src; document.getElementById('viewer').style.display='flex'; };
window.tagSearch=function(t){ document.getElementById('q').value=t; render(); };
window.toggleFold=function(key){ if(OPEN.has(key)) OPEN.delete(key); else OPEN.add(key); render(); };
function allPosts(){
  const out=[];
  for(const [bid,b] of Object.entries((D&&D.bloggers)||{}))
    for(const p of b.posts) out.push({...p, who:b.name, sec:b.sec||'종합', bid});
  out.sort((a,b)=>(b.d||'').localeCompare(a.d||''));
  return out;
}
function render(){
  const posts=allPosts();
  const whos=[...new Set(posts.map(p=>p.who))];
  document.getElementById('whobar').innerHTML=['전체',...whos].map(w=>
    `<span class="chip ${WHO===w?'on':''}" onclick="setWho('${esc(w)}')">${w}</span>`).join('');
  // 산업 필터 칩: 블로거 주력 분야 + 종목 태그로 유추된 산업(특장점 노트 분류 기준)
  const secSet=new Set();
  for(const p of posts) for(const s of postSecs(p)) secSet.add(s);
  const secs=['전체',...[...secSet].sort((a,b)=>a==='종합'?-1:b==='종합'?1:a.localeCompare(b))];
  document.getElementById('secbar').innerHTML=secs.map(s=>
    `<span class="chip" style="${SEC===s?'background:#2f6df6;border-color:#2f6df6;color:#fff':''}" onclick="setSec('${esc(s)}')">${s}</span>`).join('');
  const kw=(document.getElementById('q').value||'').trim().toLowerCase();
  const list=posts.filter(p=>(WHO==='전체'||p.who===WHO)&&(SEC==='전체'||postSecs(p).has(SEC))&&(!kw||(p.t+p.body+(p.tags||[]).join(' ')).toLowerCase().includes(kw)));
  document.getElementById('list').innerHTML=list.length?list.map((p,i)=>{
    const key=p.u;
    const open=OPEN.has(key);
    const tags=(p.tags||[]).map(t=>`<span class="tag" data-tag="${esc(t)}">${t}</span>`).join('');
    const fix=u=>(u.includes('pstatic.net')&&!u.includes('type='))?u+'?type=w966':u; // 네이버 이미지는 type 필수
    let bodyHtml, imgs='';
    if(p.blocks&&p.blocks.length){ // 원문 순서 그대로: 문단(서식 보존)·이미지 교차 렌더
      bodyHtml=p.blocks.map(b=>{
        if(b.t==='img') return `<img class="bimg" src="${fix(b.u)}" referrerpolicy="no-referrer" loading="lazy" onerror="this.style.display='none'">`;
        if(b.t==='file') return `<a class="bfile" href="${b.u}" target="_blank" rel="noopener">📎 ${esc(b.nm||'첨부파일')}</a>`;
        return `<div class="par">${b.h||esc(b.x)}</div>`;
      }).join('');
    } else {
      bodyHtml=`<div class="plain">${esc(p.body)}</div>`;
      imgs=(p.imgs&&p.imgs.length)?`<div class="imgs">${p.imgs.map(u=>
        `<img src="${fix(u)}" referrerpolicy="no-referrer" loading="lazy" onerror="this.style.display='none'">`).join('')}</div>`:'';
    }
    return `<div class="post">
      <div class="p-head"><span class="dt">${p.d}</span><span class="who">${esc(p.who)}</span>
        ${p.cat?`<span class="cat">${esc(p.cat)}</span>`:''}
        <span class="p-t"><a href="${p.u}" target="_blank" rel="noopener">${esc(p.t)} ↗</a></span></div>
      ${tags?`<div style="margin-top:5px">${tags}</div>`:''}
      <div class="body ${open?'':'clamp'}" data-key="${encodeURIComponent(key)}">${bodyHtml}</div>
      <span class="fold" data-fold="${encodeURIComponent(key)}" style="display:none">${open?'▴ 접기':'▾ 펼치기'}</span>
      ${imgs}</div>`;
  }).join(''):'<div class="loading">해당 조건의 글이 없습니다.</div>';
  for(const el of document.querySelectorAll('.body')){
    const key=decodeURIComponent(el.dataset.key);
    const btn=document.querySelector(`.fold[data-fold="${CSS.escape(el.dataset.key)}"]`);
    el.onclick=()=>{ if(el.classList.contains('clamp')) toggleFold(key); };
    if(btn){
      btn.onclick=()=>toggleFold(key);
      if(OPEN.has(key)) btn.style.display='';
      else if(el.scrollHeight>el.clientHeight+8) btn.style.display='';
      else el.classList.remove('clamp');
    }
  }
  for(const t of document.querySelectorAll('.tag')) t.onclick=()=>tagSearch(t.dataset.tag);
  for(const im of document.querySelectorAll('.imgs img')) im.onclick=()=>zoom(im.src);
}
(async function(){
  try{ D=await (await fetch('/data/blogs.json?t='+Date.now())).json(); }catch(e){ D={bloggers:{}}; }
  try{ const sn=await (await fetch('/stocknotes.json?t='+Date.now())).json();
    for(const g of sn.industries) for(const s of g.stocks) IND_MAP[s.name]=g.name; }catch(e){}
  document.getElementById('meta').textContent=D.updated?('수집 '+D.updated+' · 하루 3회 자동'):'첫 수집 대기 중';
  render();
})();
</script>
</body>
</html>
