name: 전종목 밸류 일일 수집
on:
  schedule:
    - cron: '20 9 * * 1-5'
  workflow_dispatch: {}
  push:
    paths: ['stockvals.py']
permissions:
  contents: write
jobs:
  stockvals:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 프로브(8종목) — 진단 정보 즉시 커밋
        env:
          KIS_APPKEY: ${{ secrets.KIS_APPKEY }}
          KIS_APPSECRET: ${{ secrets.KIS_APPSECRET }}
          LIMIT: '8'
          OUT: 'public/data/stockvals_probe.json'
        run: python stockvals.py || true
      - name: 프로브 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/stockvals_probe.json 2>/dev/null || true
          git commit -m "밸류 프로브" || echo "변경 없음"
          git pull --rebase origin main || true
          git push || true
      - name: 전체 수집
        env:
          KIS_APPKEY: ${{ secrets.KIS_APPKEY }}
          KIS_APPSECRET: ${{ secrets.KIS_APPSECRET }}
        run: python stockvals.py
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/stockvals.json 2>/dev/null || true
          git commit -m "전종목 밸류 갱신" || echo "변경 없음"
          git pull --rebase origin main || true
          git push || true
