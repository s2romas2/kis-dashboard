<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>잠정실적 속보 · 한국 대시보드</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { margin:0; background:#f6f7f9; color:#1a1f2e; font-family:-apple-system,"Segoe UI","Malgun Gothic",sans-serif; }
.wrap { max-width:1100px; margin:0 auto; padding:20px 18px 48px; }
header { display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:10px; }
h1 { font-size:20px; margin:0; font-weight:800; }
.sub { color:#6b7280; font-size:12.5px; margin:3px 0 0; }
a.back { font-size:12.5px; color:#2f6df6; text-decoration:none; }
.toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:16px 0; }
input.search { border:1px solid #d7dce4; border-radius:8px; padding:6px 10px; font-size:13px; min-width:170px; }
.chip { border:1px solid #d7dce4; background:#fff; color:#374151; border-radius:20px; padding:5px 12px; font-size:12.5px; font-weight:700; cursor:pointer; }
.chip.on { background:#1a2a4a; color:#fff; border-color:#1a2a4a; }
.meta { font-size:12px; color:#8a93a2; margin-left:auto; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:12px; }
.card { background:#fff; border:1px solid #eceef2; border-radius:14px; padding:14px 15px; box-shadow:0 1px 2px rgba(20,30,60,.04); }
.card h3 { font-size:15px; margin:0; font-weight:800; }
.tk { font-size:11px; color:#98a1b0; font-weight:600; margin-left:4px; }
.dt { font-size:11.5px; color:#8a93a2; margin:3px 0 8px; }
.row { display:flex; justify-content:space-between; font-size:13px; margin:5px 0; }
.k { color:#8a93a2; }
.v { font-weight:700; }
.up { color:#e5384d; } .down { color:#2563d6; } .flat { color:#6b7280; }
.foot { font-size:11px; color:#98a1b0; margin-top:9px; display:flex; justify-content:space-between; }
.foot a { color:#2f6df6; text-decoration:none; }
.loading { text-align:center; padding:40px; color:#6b7280; }
.note { font-size:11.5px; color:#8a93a2; margin-top:16px; line-height:1.6; }
.badge { display:inline-block; background:#fff1e6; color:#d97917; font-size:10.5px; font-weight:700; border-radius:10px; padding:2px 7px; margin-left:5px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>⚡ 잠정실적 속보</h1>
      <div class="sub">DART 영업(잠정)실적 공정공시 · 정기보고서보다 몇 주 빠른 실적 발표 · 하루 5회 자동 갱신</div>
    </div>
    <a class="back" href="/">← 섹터 대시보드</a>
  </header>
  <div class="toolbar">
    <input class="search" id="q" placeholder="종목명·코드 검색" oninput="render()">
    <button class="chip on" id="cAll" onclick="setF('all')">전체</button>
    <button class="chip" id="cUp" onclick="setF('up')">영업이익 증가</button>
    <span class="meta" id="meta">불러오는 중…</span>
  </div>
  <div id="grid" class="grid"><div class="loading">잠정실적 데이터를 불러오는 중…</div></div>
  <div class="note">※ 금액 단위: 억원(공시 원문 단위를 환산). YoY는 공시 원문의 전년동기 대비 증감율. 일부 공시는 표 형식이 달라 숫자 추출이 안 될 수 있으며, 이 경우 공시 원문 링크로 확인하세요. 확정 실적은 이후 정기보고서(실적 스크리닝 메뉴)에서 반영됩니다. 정보 제공용이며 투자권유가 아닙니다.</div>
</div>
<script>
let DATA=null, FMODE='all';
const cls=v=>v==null?'flat':(v>0?'up':(v<0?'down':'flat'));
const pct=v=>v==null?'—':((v>=0?'+':'')+Number(v).toFixed(1)+'%');
const eokf=v=>v==null?'—':Number(v).toLocaleString()+'억';
const fmtDate=d=>d? d.replace(/(\d{4})(\d{2})(\d{2})/,'$1.$2.$3'):'';
window.setF=function(m){ FMODE=m; document.getElementById('cAll').classList.toggle('on',m==='all'); document.getElementById('cUp').classList.toggle('on',m==='up'); render(); };
function card(m){
  const noNum = m.rev==null && m.op==null;
  return `<div class="card">
    <h3>${m.name}<span class="tk">${m.code||''}</span>${noNum?'<span class="badge">원문 확인</span>':''}</h3>
    <div class="dt">공시일 ${fmtDate(m.date)}${m.period?' · <b>'+m.period+'</b>':''} · ${m.title||''}</div>
    ${noNum?'':`
    <div class="row"><span class="k">매출액 <span style="font-size:10px">(YoY·QoQ)</span></span><span class="v">${eokf(m.rev)} <span class="${cls(m.revYoY)}">${pct(m.revYoY)}</span> <span class="${cls(m.revQoQ)}" style="font-size:11px">${pct(m.revQoQ)}</span></span></div>
    <div class="row"><span class="k">영업이익</span><span class="v">${eokf(m.op)} <span class="${cls(m.opYoY)}">${pct(m.opYoY)}</span> <span class="${cls(m.opQoQ)}" style="font-size:11px">${pct(m.opQoQ)}</span></span></div>
    ${m.ni!=null?`<div class="row"><span class="k">순이익</span><span class="v">${eokf(m.ni)} <span class="${cls(m.niYoY)}">${pct(m.niYoY)}</span></span></div>`:''}`}
    <div class="foot"><span class="k">잠정실적(공정공시)</span><a href="${m.link}" target="_blank">공시 원문 →</a></div>
  </div>`;
}
function render(){
  if(!DATA) return;
  const kw=(document.getElementById('q').value||'').trim();
  let l=DATA.list.filter(m=> !kw || (m.name&&m.name.includes(kw)) || (m.code&&m.code.includes(kw)));
  if(FMODE==='up') l=l.filter(m=>m.opYoY!=null&&m.opYoY>0);
  document.getElementById('grid').innerHTML=l.length? l.map(card).join('') : '<div class="loading">해당 공시가 없습니다.</div>';
  document.getElementById('meta').textContent='최근 '+DATA.days+'일 · '+l.length+'건 · 갱신 '+DATA.updated;
}
(async function(){
  try{ DATA=await (await fetch('/data/flash.json?t='+Date.now())).json(); }
  catch(e){ document.getElementById('grid').innerHTML='<div class="loading">flash.json이 아직 없습니다. 첫 자동 수집 후 표시됩니다.</div>'; return; }
  render();
})();
</script>
</body>
</html>
