name: WICS 섹터 지수 일일 수집
on:
  schedule:
    - cron: '50 9 * * 1-5'      # UTC 09:50 = KST 18:50 (장 마감 후)
  workflow_dispatch: {}
  push:
    paths: ['wics.py']
permissions:
  contents: write
jobs:
  wics:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 수집
        env:
          KIS_APPKEY: ${{ secrets.KIS_APPKEY }}
          KIS_APPSECRET: ${{ secrets.KIS_APPSECRET }}
        run: python wics.py
      - name: 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/wics.json public/data/wicsmap.json public/data/wicsmon.json 2>/dev/null || true
          git commit -m "WICS 섹터 지수 갱신" || echo "변경 없음"
          git pull --rebase origin main || true
          git push || true
