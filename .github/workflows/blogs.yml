name: 블로그 수집
on:
  schedule:
    - cron: '35 0,6,11 * * *'
  workflow_dispatch: {}
  push:
    paths: ['blogs.py', 'public/blogkeys.json']
permissions:
  contents: write
jobs:
  blogs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 수집
        run: python blogs.py || true
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/blogs.json 2>/dev/null || true
          git commit -m "블로그 수집" || echo "변경 없음"
          git pull --rebase -X theirs origin main || true
          git push || true
