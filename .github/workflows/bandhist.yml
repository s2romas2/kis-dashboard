name: bandhist (밸류 밴드 시계열)

on:
  schedule:
    - cron: '10 22 * * 6'       # 매주 일요일 07:10 KST — 월봉이라 매일 돌릴 이유가 없다
  workflow_dispatch:
    inputs:
      years:
        description: '과거 연수'
        default: '6'
      only:
        description: '종목코드(쉼표) — 비우면 전체'
        default: ''

permissions:
  contents: write

concurrency:
  group: bandhist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: collect
        env:
          KIS_APPKEY:    ${{ secrets.KIS_APPKEY }}
          KIS_APPSECRET: ${{ secrets.KIS_APPSECRET }}
          DART_API_KEY:  ${{ secrets.DART_API_KEY }}
          DART_KEY:      ${{ secrets.DART_KEY }}
          YEARS: ${{ github.event.inputs.years || '6' }}
          ONLY:  ${{ github.event.inputs.only  || '' }}
        run: python bandhist.py

      - name: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/band.json || true
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "bandhist: 밸류 밴드 시계열 갱신"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
