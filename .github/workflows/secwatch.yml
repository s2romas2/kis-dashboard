name: 미국 공시 수집
on:
  schedule:
    - cron: '20 22 * * 1-5'      # 평일 07:20 KST — 미국 장 마감 후 제출분 반영
  workflow_dispatch: {}
  push:
    paths: ['secwatch.py', 'public/data/sec_tax.json']
concurrency:
  group: secwatch
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  secwatch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: 수집
        env:
          SEC_UA: ${{ secrets.SEC_UA }}     # "이름 이메일@도메인" 형식 — 공개 코드에 적지 않는다
          MAXRUN: '25'
        run: python secwatch.py
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/sec 2>/dev/null || true
          git commit -m "미국 공시 갱신" || echo "변경 없음"
          git pull --rebase -X theirs origin main || true
          git push || true
