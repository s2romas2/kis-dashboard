name: 트렌드 지표 수집
on:
  schedule:
    - cron: '10 10 * * *'
  workflow_dispatch: {}
  push:
    paths: ['trends.py', 'public/trendkeys.json', 'public/beautykeys.json']
permissions:
  contents: write
jobs:
  trends:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: pytrends 설치
        run: pip install pytrends
      - name: 수집
        env:
          CUSTOMS_KEY: ${{ secrets.CUSTOMS_KEY }}
        run: python trends.py
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/trends.json 2>/dev/null || true
          git commit -m "트렌드 지표 갱신" || echo "변경 없음"
          git pull --rebase origin main || true
          git push || true
