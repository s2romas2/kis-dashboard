name: 이익의 질 — 일회성 비용 공시근거 수집
on:
  schedule:
    - cron: '50 21 * * 1-5'
  workflow_dispatch: {}
  push:
    paths: ['qoe.py']
permissions:
  contents: write
jobs:
  qoe:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 수집
        env:
          DART_KEY: ${{ secrets.DART_KEY }}
          MAXRUN: '40'
        run: python qoe.py
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/qoe.json 2>/dev/null || true
          git commit -m "이익의 질 갱신" || echo "변경 없음"
          git pull --rebase -X theirs origin main || true
          git push || true
