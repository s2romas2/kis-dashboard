<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>윤쎈 X 선진짱 · 한국 대시보드</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { margin:0; background:#f6f7f9; color:#1a1f2e; font-family:-apple-system,"Segoe UI","Malgun Gothic",sans-serif; }
.wrap { max-width:1000px; margin:0 auto; padding:20px 18px 56px; }
header { display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:10px; }
h1 { font-size:20px; margin:0; font-weight:800; }
.sub { color:#6b7280; font-size:12.5px; margin:3px 0 0; line-height:1.7; max-width:760px; }
a.back { font-size:12.5px; color:#2f6df6; text-decoration:none; }
.panel { background:#fff; border:1px solid #eceef2; border-radius:14px; padding:16px 18px; margin:14px 0; box-shadow:0 1px 2px rgba(20,30,60,.04); }
.panel h2 { font-size:14px; margin:0 0 10px; font-weight:800; }
.loading { text-align:center; padding:48px; color:#6b7280; font-size:13px; }

/* 관통하는 축 */
.axes { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:10px; }
.ax { background:#fafbfd; border:1px solid #eef1f5; border-left:3px solid #2f6df6; border-radius:10px; padding:11px 13px; }
.ax .t { font-size:12.5px; font-weight:800; color:#1a2a4a; margin-bottom:3px; }
.ax .d { font-size:12px; color:#5b6472; line-height:1.7; }

/* 에피소드 */
.ep { scroll-margin-top:58px; background:#fff; border:1px solid #e3e8f0; border-radius:16px; margin:16px 0; overflow:hidden; box-shadow:0 1px 3px rgba(20,30,60,.05); }
.ep > .hd { padding:15px 18px 13px; border-bottom:1px solid #eef1f5; background:linear-gradient(180deg,#fbfcfe,#fff); }
.ep .no { display:inline-block; font-size:11px; font-weight:800; color:#fff; background:#1a2a4a; border-radius:6px; padding:2px 8px; margin-right:7px; }
.ep h3 { display:inline; font-size:16.5px; font-weight:800; margin:0; }
.ep .when { font-size:12px; color:#6b7280; margin-top:7px; line-height:1.8; }
.ep .when b { color:#1a2a4a; }
.ep .when a { color:#2f6df6; text-decoration:none; }
.ep .tl { font-size:13px; color:#374151; line-height:1.75; margin-top:8px; background:#f4f7fd; border-radius:9px; padding:9px 12px; }

/* 핵심 숫자 */
.keys { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:9px; padding:13px 18px 4px; }
.key { border:1px solid #eceef2; border-radius:11px; padding:10px 12px; background:#fff; }
.key .k { font-size:11px; color:#8a93a2; font-weight:700; }
.key .v { font-size:14.5px; font-weight:800; color:#1a2a4a; margin:3px 0 2px; line-height:1.4; }
.key .d { font-size:11px; color:#8a93a2; line-height:1.6; }

/* 섹션 */
.secs { padding:8px 18px 18px; }
.sec { margin-top:16px; }
.sec h4 { font-size:14px; font-weight:800; margin:0 0 4px; color:#1a2a4a; }
.sec .lead { font-size:12.5px; color:#6b7280; line-height:1.75; margin-bottom:6px; }
.sec ul { margin:0; padding-left:18px; }
.sec li { font-size:13px; line-height:1.85; margin:4px 0; color:#28303f; }
.g { display:inline-block; font-size:10px; font-weight:700; border-radius:5px; padding:1px 5px; margin-left:5px; vertical-align:1.5px; white-space:nowrap; }
.g.발언 { background:#eef4ff; color:#2563d6; }
.g.진행자 { background:#f2f0fb; color:#6b4fd1; }
.g.판단 { background:#fdf2e3; color:#9a6212; }
blockquote { margin:9px 0 0; padding:10px 14px; background:#fffdf5; border-left:3px solid #f0b429; border-radius:0 9px 9px 0; font-size:13px; line-height:1.8; color:#5b4612; }
.hint { font-size:11.5px; color:#8a93a2; line-height:1.75; margin-top:10px; }
.hint b { color:#5b6472; }
@media (max-width:640px){ .wrap{padding:14px 12px 40px} .keys{grid-template-columns:1fr 1fr} .ep h3{font-size:15px} }
</style>
</head>
<body>
<div id="gnavhost"></div>
<div class="wrap">
  <header>
    <div>
      <h1>🎙️ 윤쎈 X 선진짱</h1>
      <p class="sub" id="sub">삼쩜삼캠퍼스 대담 기록</p>
    </div>
    <a class="back" href="/">← 대시보드</a>
  </header>
  <div id="body"><div class="loading">불러오는 중…</div></div>
</div>
<script src="/nav.js"></script>
<script>
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 게시 시점은 글을 옮긴 날이 아니라 영상이 올라온 시각이다.
// 자막·발언은 그 시점의 판단이라, 나중에 읽을 때 언제 한 말인지가 가장 중요한 정보다.
function when(iso){
  const d = new Date(iso);
  if (isNaN(d)) return esc(iso);
  const p = n => String(n).padStart(2,'0');
  const w = ['일','월','화','수','목','금','토'][d.getDay()];
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())}(${w}) ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function ago(iso){
  const h = (Date.now() - new Date(iso)) / 36e5;
  if (!isFinite(h)) return '';
  if (h < 1) return '방금';
  if (h < 24) return Math.floor(h) + '시간 전';
  const d = Math.floor(h/24);
  return d < 31 ? d + '일 전' : Math.floor(d/30) + '개월 전';
}
const mmss = s => s ? `${Math.floor(s/60)}분 ${s%60}초` : '';

function epCard(e){
  let h = `<div class="ep" id="ep${e.no}"><div class="hd">`
    + `<span class="no">${e.no}부</span><h3>${esc(e.title)}</h3>`
    + `<div class="when">게시 <b>${when(e.at)}</b> <span style="color:#a8b0bd">· ${ago(e.at)}</span>`
    + (e.len ? ` · ${mmss(e.len)}` : '')
    + ` · ${esc(e.ch)} · ${esc((e.people||[]).join(' × '))}`
    + ` · <a href="https://youtu.be/${esc(e.yt)}" target="_blank" rel="noopener">영상 보기 ↗</a></div>`
    + (e.tl ? `<div class="tl">${esc(e.tl)}</div>` : '')
    + `</div>`;

  if (e.keys && e.keys.length) h += `<div class="keys">` + e.keys.map(k =>
      `<div class="key"><div class="k">${esc(k.k)}</div><div class="v">${esc(k.v)}</div>`
      + (k.d ? `<div class="d">${esc(k.d)}</div>` : '') + `</div>`).join('') + `</div>`;

  h += `<div class="secs">` + (e.secs||[]).map(s =>
      `<div class="sec"><h4>${esc(s.h)}</h4>`
      + (s.lead ? `<div class="lead">${esc(s.lead)}</div>` : '')
      + `<ul>` + (s.items||[]).map(it =>
          `<li>${esc(it.t)}${it.g && it.g !== '발언' ? `<span class="g ${esc(it.g)}">${esc(it.g)}</span>` : ''}</li>`
        ).join('') + `</ul>`
      + (s.q ? `<blockquote>${esc(s.q)}</blockquote>` : '')
      + `</div>`).join('') + `</div></div>`;
  return h;
}

fetch('/data/talks.json').then(r => r.json()).then(D => {
  document.getElementById('sub').textContent =
    `${D.series} — ${D.eps.length}개 대담 · 게시 시점은 영상이 올라온 시각(KST)입니다`;
  let h = `<div class="panel"><h2>🧭 두 대담을 관통하는 축</h2><div class="axes">`
    + (D.axes||[]).map(a => `<div class="ax"><div class="t">${esc(a.t)}</div><div class="d">${esc(a.d)}</div></div>`).join('')
    + `</div><div class="hint">${esc(D.note)}</div></div>`;
  h += (D.eps||[]).map(epCard).join('');
  h += `<div class="hint">기록 갱신 ${esc(D.updated)} · 영상의 말을 옮긴 것이며 투자 권유가 아닙니다. 숫자는 그 시점의 추정이라 지금과 다를 수 있습니다.</div>`;
  document.getElementById('body').innerHTML = h;
  // 메뉴에서 #ep1·#ep2 로 들어오면 그 대담으로 바로 보낸다(렌더 뒤라 해시가 그냥은 안 먹는다)
  if (location.hash) { const el = document.querySelector(location.hash); if (el) el.scrollIntoView({block:'start'}); }
}).catch(e => {
  document.getElementById('body').innerHTML = '<div class="loading">기록을 불러오지 못했습니다.</div>';
});
</script>
</body>
</html>
