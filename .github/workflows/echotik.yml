name: 틱톡샵 랭킹 수집
on:
  schedule:
    - cron: '50 0,9 * * *'
  workflow_dispatch: {}
  push:
    paths: ['echotik.py']
permissions:
  contents: write
jobs:
  echotik:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 수집
        run: python echotik.py
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/tiktokshop.json 2>/dev/null || true
          git commit -m "틱톡샵 랭킹 갱신" || echo "변경 없음"
          git pull --rebase -X theirs origin main || true
          git push || true
