name: 잠정실적 속보 갱신
on:
  schedule:
    - cron: '0 0,3,6,9,12 * * 1-5'
  workflow_dispatch: {}
  push:
    paths: ['flash.py']
permissions:
  contents: write
jobs:
  flash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 잠정실적 수집
        env:
          DART_KEY: ${{ secrets.DART_KEY }}
          DAYS: '14'
        run: python flash.py
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/flash.json
          git add public/data/flash_debug.txt 2>/dev/null || true
          git commit -m "잠정실적 속보 갱신" || echo "변경 없음"
          git pull --rebase origin main || true
          git push
