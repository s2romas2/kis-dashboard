name: 광통신 해외종목 시세 일일 수집
on:
  schedule:
    - cron: '30 22 * * 1-5'     # UTC 22:30 = KST 07:30 (미국장 마감 후)
  workflow_dispatch: {}
  push:
    paths: ['optics.py']
permissions:
  contents: write
jobs:
  optics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 수집
        env:
          KIS_APPKEY: ${{ secrets.KIS_APPKEY }}
          KIS_APPSECRET: ${{ secrets.KIS_APPSECRET }}
        run: python optics.py
      - name: 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/optics_quotes.json 2>/dev/null || true
          git commit -m "광통신 해외종목 시세 갱신" || echo "변경 없음"
          git pull --rebase origin main || true
          git push || true
