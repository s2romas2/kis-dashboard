name: 업종 견인 종목 수집
on:
  schedule:
    - cron: '35 0-6 * * 1-5'
    - cron: '55 6 * * 1-5'
  workflow_dispatch: {}
  push:
    paths: ['sectorstocks.py']
permissions:
  contents: write
jobs:
  sectorstocks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 수집
        env:
          KIS_APPKEY: ${{ secrets.KIS_APPKEY }}
          KIS_APPSECRET: ${{ secrets.KIS_APPSECRET }}
        run: python sectorstocks.py || true
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/sectorstocks.json || true
          git commit -m "업종 견인 종목 갱신" || echo "변경 없음"
          git pull --rebase -X theirs origin main || true
          git push || true
