name: 뷰티 트렌드 수집
on:
  schedule:
    - cron: '40 11 * * *'
  workflow_dispatch: {}
  push:
    paths: ['beauty.py', 'public/beautykeys.json']
permissions:
  contents: write
jobs:
  beauty:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: pytrends 설치
        run: pip install pytrends
      - name: 수집
        run: python beauty.py
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/beauty.json 2>/dev/null || true
          git commit -m "뷰티 트렌드 갱신" || echo "변경 없음"
          git pull --rebase origin main || true
          git push || true
