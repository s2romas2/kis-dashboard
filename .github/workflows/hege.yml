name: 헤게모니 4국면 분류 (주 1회)
on:
  schedule:
    - cron: '0 22 * * 5'   # 토 07:00 KST
    - cron: '30 21 14,16,18 5,8,11 *'   # 분기·반기보고서 마감(5/15·8/14·11/14) 직후 15·17·19일 06:30 KST — 주도주·워크시트가 새 분기를 바로 쓰도록
    - cron: '30 21 31 3 *'              # 사업보고서 마감(3/31) 다음 날 4/1 06:30 KST
    - cron: '30 21 2 4 *'               # 4/3 06:30 KST
  workflow_dispatch: {}
  push:
    paths: ['hege.py']
permissions:
  contents: write
concurrency:
  group: hege-cache
  cancel-in-progress: false
jobs:
  hege:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 수집·분류
        env:
          DART_API_KEY: ${{ secrets.DART_KEY }}
        run: python hege.py
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/hege.json 2>/dev/null || true
          git commit -m "헤게모니 4국면 갱신" || echo "변경 없음"
          git pull --rebase origin main || true
          git push || true
