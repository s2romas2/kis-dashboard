<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>섹터 흐름·병목 맵</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,"Segoe UI","Malgun Gothic",sans-serif; background:#f4f6fa; color:#1a1f2e; }
.wrap { max-width:1140px; margin:0 auto; padding:18px 14px 60px; }
h1 { font-size:22px; margin:10px 0 4px; }
.sub { color:#667085; font-size:13px; margin-bottom:14px; line-height:1.6; }
.chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
.chips button { border:1.5px solid #d7dce6; background:#fff; border-radius:10px; padding:9px 16px; font:inherit; font-size:13.5px; font-weight:800; color:#475467; cursor:pointer; }
.chips button.on { background:#1a2a4a; border-color:#1a2a4a; color:#fff; }
.oneline { background:#fff; border:1px solid #e6e9f0; border-left:4px solid #1a2a4a; border-radius:10px; padding:11px 14px; font-size:13.5px; font-weight:600; line-height:1.6; margin-bottom:16px; }
.flowrow { display:flex; align-items:stretch; gap:0; overflow-x:auto; padding-bottom:8px; margin-bottom:16px; }
.stage { flex:1 1 240px; min-width:235px; background:#fff; border:1.5px solid #e6e9f0; border-radius:14px; padding:12px; position:relative; }
.stage.boom { border-color:#f2a33c; background:#fffdf7; }
.stage.btl { border-color:#d92d20; background:#fffafa; }
.stage.pol { border-color:#7a5af8; background:#fbfaff; }
.arrow { display:flex; align-items:center; padding:0 4px; color:#98a2b3; font-size:20px; font-weight:900; }
.badge { display:inline-block; font-size:10.5px; font-weight:900; padding:2px 8px; border-radius:10px; margin-bottom:6px; }
.boom .badge { background:#fef3d9; color:#b25e09; }
.btl .badge { background:#fee4e2; color:#d92d20; }
.pol .badge { background:#ece9fe; color:#6938ef; }
.ok .badge { background:#e6f4ea; color:#12805c; }
.stage h3 { font-size:13.5px; margin-bottom:5px; }
.stage .desc { font-size:11.5px; color:#475467; line-height:1.55; margin-bottom:6px; }
.stage .nums { font-size:11px; color:#7a5b1e; background:#fffaf0; border-radius:8px; padding:5px 7px; line-height:1.55; margin-bottom:6px; }
.stage .stk { display:flex; flex-wrap:wrap; gap:4px; }
.stage .stk a { font-size:10.5px; font-weight:700; color:#2f6df6; background:#eef4ff; border-radius:8px; padding:2px 7px; text-decoration:none; }
.legend { display:flex; gap:12px; font-size:11.5px; color:#667085; margin-bottom:10px; flex-wrap:wrap; }
.legend span b { padding:1px 7px; border-radius:8px; }
.card { background:#fff; border:1px solid #e6e9f0; border-radius:14px; padding:14px; margin-bottom:14px; }
.card h2 { font-size:15px; margin-bottom:10px; }
.drow { display:flex; gap:10px; padding:9px 0; border-top:1px solid #f0f2f6; font-size:12.5px; line-height:1.55; }
.drow:first-of-type { border-top:none; }
.drow .nm { flex:0 0 200px; font-weight:800; }
.drow .ac { flex:1; color:#475467; }
.drow .ms { flex:0 0 170px; color:#b25e09; font-weight:700; font-size:11.5px; }
@media (max-width:760px){ .drow{flex-direction:column;gap:2px;} .drow .nm,.drow .ms{flex:none;} .flowrow{flex-direction:column;} .arrow{transform:rotate(90deg);justify-content:center;padding:2px 0;} .stage{min-width:0;} }
.loading { text-align:center; color:#98a2b3; padding:40px 0; }
.upd { font-size:11px; color:#98a2b3; margin-top:8px; }
</style>
</head>
<body>
<script src="/nav.js" defer></script>
<div class="wrap">
  <h1>🌊 섹터 흐름·병목 맵</h1>
  <div class="sub">각 섹터의 글로벌 밸류체인 흐름을 단계별로 — 어디가 호황이고, 어디가 물리적 병목이고, 어디에 정치 변수가 걸려 있는지. 병목이 있는 단계의 기업이 가격 결정력을 갖습니다.</div>
  <div class="legend"><span><b style="background:#fef3d9;color:#b25e09">호황</b> 수요 폭발</span><span><b style="background:#fee4e2;color:#d92d20">병목</b> 물리적 공급 제약 = 가격 결정력</span><span><b style="background:#ece9fe;color:#6938ef">정치</b> 규제·관세·선거 변수</span><span><b style="background:#e6f4ea;color:#12805c">정상</b> 원활·낙수 진행</span></div>
  <div class="chips" id="chips"></div>
  <div id="body"><div class="loading">불러오는 중…</div></div>
</div>
<script>
let DATA=null, SEC=null;
function draw(){
  const s=DATA.sectors.find(x=>x.k===SEC)||DATA.sectors[0];
  document.getElementById('chips').innerHTML=DATA.sectors.map(x=>
    `<button class="${x.k===s.k?'on':''}" onclick="go('${x.k}')">${x.i} ${x.n}</button>`).join('');
  let h=`<div class="oneline">${s.i} ${s.oneline}</div>`;
  h+=`<div class="flowrow">`+s.chain.map((c,i)=>{
    const stage=`<div class="stage ${c.st}"><span class="badge">${c.badge}</span><h3>${c.name}</h3>
      <div class="desc">${c.desc}</div>
      ${c.nums&&c.nums.length?`<div class="nums">${c.nums.map(n=>'· '+n).join('<br>')}</div>`:''}
      <div class="stk">${(c.stocks||[]).map(([cd,nm])=>`<a href="/bands.html#${cd}">${nm}</a>`).join('')}</div></div>`;
    return stage+(i<s.chain.length-1?'<div class="arrow">→</div>':'');
  }).join('')+`</div>`;
  (s.detail||[]).forEach(d=>{
    h+=`<div class="card"><h2>${d.t}</h2>`+d.rows.map(r=>
      `<div class="drow"><div class="nm">${r.n}</div><div class="ac">${r.a}</div>${r.m?`<div class="ms">${r.m}</div>`:''}</div>`).join('')+`</div>`;
  });
  h+=`<div class="upd">리서치 기준일 ${DATA.updated} — 수치는 조사 시점 보도·공시 기준이며, 갱신을 원하면 "섹터 흐름 업데이트해줘"라고 요청하세요.</div>`;
  document.getElementById('body').innerHTML=h;
}
window.go=k=>{ SEC=k; location.hash=k; draw(); };
async function init(){
  try{ DATA=await (await fetch('/data/sectorflow.json?t='+Date.now())).json(); }
  catch(e){ document.getElementById('body').innerHTML='<div class="loading">데이터 로드 실패</div>'; return; }
  SEC=(location.hash||'').replace('#','')||DATA.sectors[0].k;
  draw();
}
init();
</script>
</body>
</html>
