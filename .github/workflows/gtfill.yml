name: 구글트렌드 결측 채우기
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}
  push:
    paths: ['gtfill.py']
permissions:
  contents: write
jobs:
  gtfill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: pytrends 설치
        run: pip install pytrends
      - name: 결측 채우기
        run: python gtfill.py || true
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/trends.json public/data/beauty.json public/data/gtdead.json 2>/dev/null || true
          git commit -m "구글트렌드 결측 채움" || echo "변경 없음"
          git pull --rebase -X theirs origin main || true
          git push || true
