name: 전 종목 사실 수집 (수주·지배구조·경영진 뉴스)
on:
  schedule:
    - cron: '25 20 * * 0-4'   # 월~금 05:25 KST
  workflow_dispatch: {}
  push:
    paths: ['valfacts.py', '.github/workflows/valfacts.yml']
permissions:
  contents: write
concurrency:
  group: valfacts
  cancel-in-progress: false
jobs:
  valfacts:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 수집
        env:
          DART_API_KEY: ${{ secrets.DART_KEY }}
          BUDGET_MIN: '75'
        run: python valfacts.py
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/vf public/data/valfacts_idx.json 2>/dev/null || true
          git commit -m "전 종목 사실 수집 갱신" || echo "변경 없음"
          git pull --rebase origin main || true
          git push || (git pull --rebase origin main && git push) || true
