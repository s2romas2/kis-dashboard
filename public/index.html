  ok.sort((a,b)=> sortMode==='mc' ? b.mktcapEok-a.mktcapEok : b.volume-a.volume);
  const bad=stocks.filter(x=>!x.ok);
  document.getElementById('tableB').innerHTML=`<table><thead><tr><th class="l">#</th><th class="l">종목</th><th>현재가</th><th>등락률</th><th>시가총액</th><th>거래량</th><th class="l">한 줄 설명</th></tr></thead><tbody>${ok.map((r,i)=>`<tr><td class="l rankcell">${i+1}</td><td class="l"><span class="nm">${r.name}</span><span class="tk">${r.code}</span></td><td>${r.price.toLocaleString()}원</td><td class="${cls(r.changePct)}">${(r.changePct>=0?'+':'')+r.changePct.toFixed(2)}%</td><td>${fmtCap(r.mktcapEok)}</td><td>${fmtVol(r.volume)}</td><td class="desc">${r.desc}</td></tr>`).join('')}${bad.map(r=>`<tr><td class="l rankcell">·</td><td class="l"><span class="nm">${r.name}</span><span class="tk">${r.code}</span></td><td colspan="5" class="l ${r.err?'err':'wait'}">${r.err?'실패':'로딩 중…'}</td></tr>`).join('')}</tbody></table>`;
}
async function loadB(){
  if(runningB) return; runningB=true; document.getElementById('refreshB').disabled=true;
  const list=KTOP10[curSec];
  stocks=list.map(([code,name,desc])=>({code,name,desc,ok:false}));
  renderB();
  try{
    const res=await apiQuotes(list.map(x=>x[0]));
    const map={}; res.forEach(q=>map[q.code]=q);
    stocks.forEach(st=>{ const q=map[st.code]; if(q&&!q.error){ st.price=q.price; st.changePct=q.changePct; st.volume=q.volume; st.mktcapEok=q.mktcapEok; st.ok=true; } else { st.err=q?q.error:'없음'; } });
  }catch(e){ stocks.forEach(st=>st.err=e.message); }
  renderB();
  const ok=stocks.filter(s=>s.ok).length;
  document.getElementById('upd').innerHTML=SECTORS.find(s=>s.t===curSec).ko+' TOP10 · 갱신 '+new Date().toLocaleTimeString('ko-KR',{hour12:false})+(ok<stocks.length?` · <span style="color:#e5384d">${stocks.length-ok}개 실패</span>`:'');
  runningB=false; document.getElementById('refreshB').disabled=false;
}
document.getElementById('refreshB').addEventListener('click',loadB);
document.getElementById('legendB').innerHTML='섹터 내 <b>시가총액 상위 10종목</b>. 시가총액·거래량·현재가·등락률 모두 KIS 실시간(중계 서버 경유). 정렬 버튼으로 시총순↔거래량순 전환. 08:00~18:00에 60초마다 자동 갱신.';
drawSecbar();

/* ===== TAB A : 섹터 등락률 ===== */
let secChart=null, runningA=false;
async function loadA(){
  if(runningA) return; runningA=true; document.getElementById('loadA').disabled=true; document.getElementById('loadA').textContent='불러오는 중…';
  const allCodes=[]; SECTORS.forEach(s=>KTOP10[s.t].forEach(x=>allCodes.push(x[0])));
  let map={};
  try{ const res=await apiQuotes(allCodes); res.forEach(q=>map[q.code]=q); }catch(e){}
  const rows=SECTORS.map(s=>{ let wsum=0,w=0; KTOP10[s.t].forEach(x=>{ const q=map[x[0]]; if(q&&!q.error&&q.mktcapEok){ wsum+=q.changePct*q.mktcapEok; w+=q.mktcapEok; } });
    return {...s, chg: w? wsum/w : null }; }).filter(r=>r.chg!=null).sort((a,b)=>b.chg-a.chg);
  const labels=rows.map(r=>r.ko), data=rows.map(r=>r.chg), colors=rows.map(r=>r.chg>0?'#e5384d':(r.chg<0?'#2563d6':'#9aa3b2'));
  if(secChart) secChart.destroy();
  secChart=new Chart(document.getElementById('secChart'),{type:'bar',data:{labels,datasets:[{data,backgroundColor:colors,borderRadius:5,barThickness:16}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>(c.parsed.x>=0?'+':'')+c.parsed.x.toFixed(2)+'%'}}},scales:{x:{ticks:{callback:v=>v+'%'},grid:{color:'#f0f2f5'}},y:{grid:{display:false}}}}});
  document.getElementById('tableSA').innerHTML=`<table><thead><tr><th class="l">#</th><th class="l">섹터</th><th>시총가중 등락률</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td class="l rankcell">${i+1}</td><td class="l"><span class="nm">${r.ko}</span></td><td class="${cls(r.chg)}">${(r.chg>=0?'+':'')+r.chg.toFixed(2)}%</td></tr>`).join('')}</tbody></table>`;
  document.getElementById('loadA').disabled=false; document.getElementById('loadA').textContent='↻ 다시 불러오기';
  document.getElementById('upd').innerHTML='섹터 종합 · 갱신 '+new Date().toLocaleTimeString('ko-KR',{hour12:false});
  runningA=false;
}
document.getElementById('loadA').addEventListener('click',loadA);

/* ===== 탭 & 자동갱신 ===== */
window.showTab=function(x){
  document.getElementById('tabA').classList.toggle('on',x==='A');
  document.getElementById('tabB').classList.toggle('on',x==='B');
  document.getElementById('viewA').classList.toggle('hidden',x!=='A');
  document.getElementById('viewB').classList.toggle('hidden',x!=='B');
};
function updateLive(){ const on=isMarketHours(); const b=document.getElementById('liveBadge'); b.classList.toggle('off',!on); b.innerHTML='<span class="dot"></span>'+(on?'LIVE':'장마감'); }
updateLive(); setInterval(updateLive,30000);
loadB();
setInterval(()=>{ if(!isMarketHours()) return;
  if(!document.getElementById('viewB').classList.contains('hidden')&&!runningB) loadB(); }, 60000);
</script>
