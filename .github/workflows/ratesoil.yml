name: 금리 vs 유가 일일 수집
on:
  schedule:
    - cron: '30 22 * * 1-5'   # 07:30 KST (미국장 마감 후)
  workflow_dispatch: {}
  push:
    paths: ['ratesoil.py']
permissions:
  contents: write
jobs:
  ratesoil:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 수집
        run: python ratesoil.py
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/ratesoil.json 2>/dev/null || true
          git commit -m "금리 vs 유가 갱신" || echo "변경 없음"
          git pull --rebase origin main || true
          git push || true
