<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내부자(임원) 매수 · 한국 대시보드</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { margin:0; background:#f6f7f9; color:#1a1f2e; font-family:-apple-system,"Segoe UI","Malgun Gothic",sans-serif; }
.wrap { max-width:1100px; margin:0 auto; padding:20px 18px 48px; }
header { display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:10px; }
h1 { font-size:20px; margin:0; font-weight:800; }
.sub { color:#6b7280; font-size:12.5px; margin:3px 0 0; }
a.back { font-size:12.5px; color:#2f6df6; text-decoration:none; }
.toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:16px 0; }
input.search { border:1px solid #d7dce4; border-radius:8px; padding:6px 10px; font-size:13px; min-width:170px; }
.meta { font-size:12px; color:#8a93a2; margin-left:auto; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:12px; }
.card { background:#fff; border:1px solid #eceef2; border-radius:14px; padding:14px 15px; box-shadow:0 1px 2px rgba(20,30,60,.04); }
.rank { font-size:12px; font-weight:800; color:#c2c8d2; }
.card h3 { font-size:15px; margin:2px 0 0; font-weight:800; }
.tk { font-size:11px; color:#98a1b0; font-weight:600; margin-left:4px; }
.amt { font-size:22px; font-weight:800; color:#e5384d; margin:8px 0 2px; letter-spacing:-.5px; }
.who { font-size:13px; margin:2px 0; }
.who b { color:#1a2a4a; }
.badge { display:inline-block; background:#eef3ff; color:#2f5fd0; font-size:10.5px; font-weight:700; border-radius:10px; padding:2px 7px; margin-left:5px; }
.row { font-size:12.5px; color:#4b5563; margin:3px 0; }
.k { color:#8a93a2; }
.live { color:#e5384d; font-weight:700; }
.foot { font-size:11px; color:#98a1b0; margin-top:8px; display:flex; justify-content:space-between; }
.foot a { color:#2f6df6; text-decoration:none; }
.loading { text-align:center; padding:40px; color:#6b7280; }
.note { font-size:11.5px; color:#8a93a2; margin-top:16px; line-height:1.6; }
.card.click { cursor:pointer; transition:box-shadow .15s; }
.card.click:hover { box-shadow:0 3px 10px rgba(20,30,60,.09); }
.cnt { font-size:12.5px; color:#5b6472; font-weight:600; margin:2px 0 0; }
.chev { float:right; color:#c2c8d2; font-size:12px; font-weight:700; }
.detail { margin-top:10px; border-top:1px solid #f0f2f5; padding-top:8px; }
.drow { font-size:12.5px; margin:7px 0; color:#374151; }
.dsub { font-size:11px; color:#98a1b0; margin-top:1px; }
.dsub a { color:#2f6df6; text-decoration:none; }
.reasonb { display:inline-block; background:#e9f7ee; color:#12a150; font-size:10px; font-weight:700; border-radius:9px; padding:1px 6px; margin-left:4px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>💰 내부자(임원) 매수 · 1억↑</h1>
      <div class="sub">최근 30일 · 임원(경영진)이 1억원 이상 순매수한 종목 · 공시(DART) 기준</div>
    </div>
    <a class="back" href="/">← 섹터 대시보드</a>
  </header>
  <div class="toolbar">
    <input class="search" id="q" placeholder="종목명·내부자 검색" oninput="render()">
    <span class="meta" id="meta">불러오는 중…</span>
  </div>
  <div id="grid" class="grid"><div class="loading">내부자 매수 데이터를 불러오는 중…</div></div>
  <div class="note" id="note"></div>
</div>
<script>
let DATA=null, quoteCache={};
const won = v => v==null?'—':v.toLocaleString()+'원';
const medal = i => i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
async function load(){
  try { DATA = await (await fetch('/data/insider.json?t='+Date.now())).json(); }
  catch(e){ document.getElementById('grid').innerHTML='<div class="loading">insider.json을 아직 못 찾았습니다. GitHub Actions 실행 후 생성됩니다.</div>'; return; }
  document.getElementById('note').innerHTML='※ 매수금액 = <b>공시 원문의 취득단가 × 매수수량</b> (DART 임원·주요주주 특정증권등 소유상황보고서 기준). '
    +(DATA.buyOnly?'<b>취득 사유가 \'장내매수\'인 것만 집계</b> — 주식보상 지급·배당·전환 등 비매수 취득과 계열사·주요주주 명의는 제외. ':'')
    +'전환사채 등 주식 외 증권은 괄호 안 주당단가를 사용. 현재가는 KIS 실시간(참고용). 같은 종목의 여러 공시(임원 각자 제출)는 한 카드로 합산. 정보 제공용이며 투자권유가 아닙니다.';
  render(); enrich();
}
const fmtDate=d=>d? d.replace(/(\d{4})(\d{2})(\d{2})/,'$1.$2.$3'):'';
const eok=v=>Math.round(v/1e8*10)/10;
let openSet=new Set();
window.toggle=function(k){ if(openSet.has(k)) openSet.delete(k); else openSet.add(k); render(); };
function filtered(){
  if(!DATA) return [];
  const kw=(document.getElementById('q').value||'').trim();
  return DATA.list.filter(m=> !kw || (m.name&&m.name.includes(kw)) || (m.insider&&m.insider.includes(kw)) || (m.code&&m.code.includes(kw)));
}
function grouped(){
  const g={};
  filtered().forEach(m=>{ const k=m.code||m.name;
    (g[k]=g[k]||{key:k,code:m.code,name:m.name,total:0,items:[],last:''});
    g[k].items.push(m); g[k].total+=m.amount; if(m.date>g[k].last) g[k].last=m.date; });
  return Object.values(g).sort((a,b)=>b.total-a.total);
}
function card(g,i){
  const q=quoteCache[g.code];
  const price=q?won(q.price):'…';
  const ppl=[...new Set(g.items.map(x=>x.insider))];
  const open=openSet.has(g.key);
  const items=[...g.items].sort((a,b)=>b.amount-a.amount);
  const detail=open?`<div class="detail">${items.map(x=>`
    <div class="drow"><b>${x.insider}</b><span class="badge">${x.position}</span>${x.reason?`<span class="reasonb">${x.reason}</span>`:''}
      · ${x.qty.toLocaleString()}주 @ ${won(x.price)} = <span class="live">${x.amountEok}억</span>
      <div class="dsub">공시일 ${fmtDate(x.date)} · <a href="${x.link}" target="_blank" onclick="event.stopPropagation()">공시 원문 →</a></div>
    </div>`).join('')}</div>`:'';
  return `<div class="card click" onclick="toggle('${g.key}')">
    <div class="rank">${medal(i)}<span class="chev">${open?'▲ 접기':'▼ 상세'}</span></div>
    <h3>${g.name}<span class="tk">${g.code||''}</span></h3>
    <div class="amt">+${eok(g.total)}억 매수</div>
    <div class="cnt">내부자 ${ppl.length}명 · 공시 ${g.items.length}건</div>
    <div class="row"><span class="k">현재가</span> <span class="live">${price}</span> <span class="k">· 최근 공시일 ${fmtDate(g.last)}</span></div>
    ${detail}
    <div class="foot"><span class="k">${open?'클릭하면 접힘':'클릭해서 개인별 내역 보기'}</span></div>
  </div>`;
}
function render(){
  const l=grouped();
  document.getElementById('grid').innerHTML = l.length? l.map((g,i)=>card(g,i)).join('') : '<div class="loading">해당 종목이 없습니다.</div>';
  if(DATA) document.getElementById('meta').textContent='최근 '+DATA.days+'일 · 종목 '+l.length+'개 · 공시 '+DATA.count+'건 · 갱신 '+DATA.updated;
}
async function enrich(){
  if(!DATA) return;
  const codes=grouped().slice(0,45).map(g=>g.code).filter(c=>c&&!quoteCache[c]);
  for(let i=0;i<codes.length;i+=20){
    try{ const d=(await (await fetch('/api/quotes?codes='+codes.slice(i,i+20).join(','))).json()).data||[];
      d.forEach(q=>{ if(!q.error) quoteCache[q.code]=q; }); render(); }catch(e){}
  }
}
load();
</script>
</body>
</html>
