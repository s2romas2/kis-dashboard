name: cospeer (화장품 peer 상대밸류)

on:
  schedule:
    - cron: '35 21 * * *'        # 매일 06:35 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cospeer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      # ① 시세 기반 씨앗 — DART 가 막혀도 PER·PBR·ROE·시총은 채워진다
      - name: seed
        run: python cospeer_seed.py

      # ② 본 수집 — semipeer.py 를 화장품 정의로 돌린다(같은 코드, 정의 파일만 교체)
      - name: collect
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DEF: cospeer_def.json
          OUT: public/data/cospeer.json
        run: python semipeer.py || true

      # ③ 수주잔고 — 화장품은 공시하는 곳이 드물어 실패해도 넘어간다
      - name: backlog
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          BL_SRC: public/data/cospeer.json
          BL_OUT: public/data/cospeer_backlog.json
          BL_BUDGET: '1800'
        run: python backlog.py || true

      - name: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/cospeer.json public/data/cospeer_backlog.json || true
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "cospeer: 화장품 peer 상대밸류 갱신"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
