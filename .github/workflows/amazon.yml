name: 아마존 베스트셀러 일일 수집
on:
  schedule:
    - cron: '15 21 * * *'      # UTC 21:15 = KST 06:15
  workflow_dispatch: {}
  push:
    paths: ['amazon.py', 'public/amazonbrands.json', 'public/amazonnodes.json']
permissions:
  contents: write
jobs:
  amazon:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 수집
        run: python amazon.py
      - name: 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/amazon.json 2>/dev/null || true
          git commit -m "아마존 베스트셀러 갱신" || echo "변경 없음"
          git pull --rebase origin main || true
          git push || true
