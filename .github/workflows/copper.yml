name: 구리 가격·상관 일일 수집
on:
  schedule:
    - cron: '40 22 * * 1-5'     # UTC 22:40 = KST 07:40 (미국장 마감 후)
  workflow_dispatch: {}
  push:
    paths: ['copper.py']
permissions:
  contents: write
jobs:
  copper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 수집
        run: python copper.py
      - name: 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/copper.json 2>/dev/null || true
          git commit -m "구리 가격·상관 갱신" || echo "변경 없음"
          git pull --rebase origin main || true
          git push || true
