name: robopeer (로봇 peer 상대밸류)

on:
  schedule:
    - cron: '45 21 * * *'        # 매일 06:45 KST — cospeer(06:35) 뒤에 돌린다
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robopeer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      # 본 수집 — semipeer.py 를 로봇 정의로 돌린다(같은 코드, 정의 파일만 교체)
      - name: collect
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DEF: robopeer_def.json
          OUT: public/data/robopeer.json
        run: python semipeer.py || true

      # 수주잔고 — 로봇 장비사는 공시하는 곳이 있어 시도한다
      - name: backlog
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          BL_SRC: public/data/robopeer.json
          BL_OUT: public/data/robopeer_backlog.json
          BL_BUDGET: '1800'
        run: python backlog.py || true

      - name: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/robopeer.json public/data/robopeer_backlog.json || true
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "robopeer: 로봇 peer 상대밸류 갱신"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
