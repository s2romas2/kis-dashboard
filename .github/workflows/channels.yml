name: 채널별 순위 수집
on:
  schedule:
    - cron: '25 1,10 * * *'
  workflow_dispatch: {}
  push:
    paths: ['channels.py', 'public/brandmap.json']
permissions:
  contents: write
jobs:
  channels:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 수집
        run: python channels.py || true
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/channels.json 2>/dev/null || true
          git commit -m "채널별 순위 갱신" || echo "변경 없음"
          git pull --rebase -X theirs origin main || true
          git push || true
