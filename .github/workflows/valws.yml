name: 밸류 워크시트 자동 채움 (컨센·CB/BW)
on:
  schedule:
    - cron: '10 22 * * 0-4'   # 월~금 07:10 KST
  workflow_dispatch: {}
  push:
    paths: ['valws.py', 'public/data/valws_watch.json']
permissions:
  contents: write
concurrency:
  group: valws-cache
  cancel-in-progress: false
jobs:
  valws:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 수집
        env:
          DART_API_KEY: ${{ secrets.DART_KEY }}
        run: python valws.py
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/valws_auto.json 2>/dev/null || true
          git commit -m "밸류 워크시트 자동 데이터 갱신" || echo "변경 없음"
          git pull --rebase origin main || true
          git push || true
