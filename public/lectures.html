<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강의 노트</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,"Segoe UI","Malgun Gothic",sans-serif; background:#f4f6fa; color:#1a1f2e; }
.wrap { max-width:1000px; margin:0 auto; padding:18px 14px 60px; }
h1 { font-size:22px; margin:10px 0 4px; }
.sub { color:#667085; font-size:13px; margin-bottom:12px; line-height:1.6; }
.gate { background:#fff; border:1px solid #e6e9f0; border-radius:14px; padding:26px; max-width:460px; margin:40px auto; text-align:center; }
.gate input { width:100%; border:1.5px solid #d7dce6; border-radius:10px; padding:10px 12px; font-size:14px; margin:12px 0; }
.gate button { background:#2f6df6; color:#fff; border:none; border-radius:10px; padding:10px 20px; font-size:14px; font-weight:800; cursor:pointer; }
.gate .err { color:#d92d20; font-size:12px; margin-top:8px; }
.bar { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
.chip { border:1.5px solid #d7dce6; background:#fff; border-radius:18px; padding:5px 12px; font-size:12px; font-weight:700; color:#475467; cursor:pointer; }
.chip.on { background:#2f6df6; border-color:#2f6df6; color:#fff; }
.card { background:#fff; border:1px solid #e6e9f0; border-radius:14px; margin-bottom:12px; overflow:hidden; }
.lh { display:flex; align-items:center; gap:10px; padding:13px 16px; border-bottom:1px solid #eef0f4; background:#fafbfd; flex-wrap:wrap; }
.lh .g { font-size:12px; font-weight:900; color:#fff; background:#2f6df6; border-radius:7px; padding:3px 9px; }
.lh .ti { font-size:15px; font-weight:900; letter-spacing:-.2px; }
.lh .meta { font-size:11.5px; color:#98a2b3; }
.kd { font-size:10.5px; font-weight:900; border-radius:7px; padding:3px 8px; }
.kd.책리뷰 { background:#e8f0fe; color:#1d4ed8; } .kd.마켓 { background:#f3e8ff; color:#7e22ce; } .kd.콜리뷰 { background:#e8f8ef; color:#0e9f5a; }
.lb { padding:14px 16px; }
.lb h3 { font-size:13px; color:#2f6df6; font-weight:900; margin:2px 0 8px; }
.sum { font-size:13.5px; line-height:1.75; }
.sum .hl { font-weight:900; color:#1a1f2e; display:block; margin:12px 0 5px; font-size:14px; }
.sum ul { margin:0 0 4px; padding-left:0; list-style:none; }
.sum li { position:relative; padding-left:15px; margin:4px 0; color:#374151; }
.sum li::before { content:'▪'; position:absolute; left:2px; color:#93c5fd; font-size:11px; top:2px; }
.player { display:flex; align-items:center; gap:10px; padding:10px 16px; border-top:1px dashed #eceff4; flex-wrap:wrap; }
.player button { background:#111827; color:#fff; border:none; border-radius:8px; padding:8px 14px; font-size:12.5px; font-weight:800; cursor:pointer; }
.player button:disabled { opacity:.5; cursor:default; }
.player audio { flex:1 1 300px; height:34px; }
.player .st { font-size:11.5px; color:#98a2b3; }
.loading { text-align:center; color:#98a2b3; padding:30px 0; }
.note { font-size:11.5px; color:#98a2b3; white-space:normal; line-height:1.6; }
.charts { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; margin:6px 16px 14px; }
.chartcard { border:1px solid #eef0f4; border-radius:10px; padding:10px 12px; background:#fcfdff; }
.chartcard .ct { font-size:12.5px; font-weight:800; color:#1a1f2e; margin-bottom:2px; }
.chartcard .cn { font-size:10.5px; color:#98a2b3; margin-bottom:6px; line-height:1.4; }
.chartcard .cbox { position:relative; height:200px; }
.chsec { font-size:13px; color:#7e22ce; font-weight:900; margin:2px 16px 0; }
.slbar { display:flex; align-items:center; gap:10px; padding:10px 16px; border-top:1px dashed #eceff4; flex-wrap:wrap; }
.slbar button { background:#0e9f5a; color:#fff; border:none; border-radius:8px; padding:8px 14px; font-size:12.5px; font-weight:800; cursor:pointer; }
.slbar button:disabled { opacity:.5; cursor:default; }
.slbar .sst { font-size:11.5px; color:#98a2b3; }
.slides { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; margin:2px 16px 14px; }
.slide { border:1px solid #eef0f4; border-radius:10px; overflow:hidden; background:#fff; cursor:zoom-in; }
.slide img { display:block; width:100%; }
.slide .sc { font-size:11px; font-weight:800; color:#374151; padding:6px 8px; line-height:1.35; border-top:1px solid #f2f4f7; }
.slide .sc em { font-style:normal; color:#98a2b3; font-weight:700; }
#lb { position:fixed; inset:0; background:rgba(15,20,30,.92); display:none; z-index:99; align-items:center; justify-content:center; flex-direction:column; padding:16px; }
#lb.on { display:flex; }
#lb img { max-width:96vw; max-height:82vh; border-radius:8px; background:#fff; }
#lb .cap { color:#fff; font-size:13px; font-weight:800; margin-top:10px; text-align:center; }
#lb .nav { position:absolute; top:50%; transform:translateY(-50%); font-size:34px; color:#fff; opacity:.75; cursor:pointer; padding:10px 16px; user-select:none; }
#lb .nav.p { left:4px; } #lb .nav.n { right:4px; }
#lb .x { position:absolute; top:10px; right:16px; color:#fff; font-size:26px; cursor:pointer; opacity:.8; }
</style>
</head>
<body>
<script src="/nav.js" defer></script>
<div id="lb" onclick="if(event.target.id==='lb')lbClose()"><span class="x" onclick="lbClose()">✕</span><span class="nav p" onclick="lbGo(-1)">‹</span><img id="lbimg"><div class="cap" id="lbcap"></div><span class="nav n" onclick="lbGo(1)">›</span></div>
<div class="wrap">
  <h1>🎓 강의 노트 <span style="font-size:12px;color:#98a2b3;font-weight:600">🔒 본인 전용 · 암호화 저장</span></h1>
  <div class="sub">팀더윤쎈 클래스 강의를 직접 녹음·전사한 뒤 <b>핵심 위주로 요약</b>했습니다. 녹음본은 암호화되어 본인만 재생할 수 있습니다.</div>
  <div id="body"><div class="gate"><div style="font-size:15px;font-weight:900">🔒 암호를 입력하세요</div>
    <input id="pw" type="password" placeholder="암호" autocomplete="off" onkeydown="if(event.key==='Enter'&&!event.isComposing) unlock()"><br>
    <button onclick="unlock()">열기</button><div class="err" id="err"></div></div></div>
</div>
<script>
let D=null, PW='', G='all';
async function derive(pw,salt){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function decBytes(pw,b64){
  const raw=Uint8Array.from(atob(b64.trim()),c=>c.charCodeAt(0));
  const key=await derive(pw,raw.slice(0,16));
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(16,28)},key,raw.slice(28)));
}
async function decJSON(pw,b64){ return JSON.parse(new TextDecoder().decode(await decBytes(pw,b64))); }
function esc(s){ return String(s||'').replace(/</g,'&lt;'); }
async function unlock(){
  const pw=document.getElementById('pw').value; document.getElementById('err').textContent='';
  try{
    const b64=await (await fetch('/data/lectures.enc?t='+Date.now())).text();
    D=await decJSON(pw,b64); PW=pw;
    try{ sessionStorage.setItem('lec_pw',pw); }catch(e){}
    draw();
  }catch(e){ document.getElementById('err').textContent='암호가 맞지 않습니다.'; try{ sessionStorage.removeItem('lec_pw'); }catch(_){} const el=document.getElementById('pw'); if(el){ el.value=''; el.focus(); } }
}
// 요약 텍스트 → HTML: "## 헤드라인" 은 소제목, "- 항목" 은 불릿
function sumHTML(s){
  const lines=(s||'').split('\n'); let h='<ul>'; let open=true;
  for(let ln of lines){ ln=ln.trim(); if(!ln) continue;
    const bold=t=>esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
    if(ln.startsWith('##')){ if(open){h+='</ul>';open=false;} h+='<span class="hl">'+bold(ln.replace(/^#+\s*/,''))+'</span><ul>'; open=true; }
    else { const t=ln.replace(/^[-•]\s*/,''); h+='<li>'+bold(t)+'</li>'; }
  }
  if(open) h+='</ul>'; return h;
}
async function playLec(g, btn){
  const st=btn.parentElement.querySelector('.st'); const au=btn.parentElement.querySelector('audio');
  if(au.src){ au.style.display='block'; au.play(); return; }
  btn.disabled=true; st.textContent='복호화 중… (파일이 커서 잠시 걸립니다)';
  try{
    const b64=await (await fetch('/data/lectures/g'+g+'.enc?t='+Date.now())).text();
    const bytes=await decBytes(PW,b64);
    const url=URL.createObjectURL(new Blob([bytes],{type:'audio/webm'}));
    au.src=url; au.style.display='block'; st.textContent=''; btn.style.display='none'; au.play();
  }catch(e){ st.textContent='재생 실패: '+e.message; btn.disabled=false; }
}
const SLD={};   // g -> [{t,cap,d}]
function tfmt(t){ t=+t||0; return (t/60|0)+':'+String(t%60).padStart(2,'0'); }
async function loadSlides(g, btn){
  const wrap=document.getElementById('sl_'+g);
  if(wrap && wrap.dataset.on==='1'){ wrap.innerHTML=''; wrap.dataset.on='0'; btn.textContent='📑 강의 자료 보기'; return; }
  if(SLD[g]){ paintSlides(g,btn); return; }
  const st=btn.parentElement.querySelector('.sst');
  btn.disabled=true; st.textContent='복호화 중…';
  try{
    const b64=await (await fetch('/data/lectures/s'+g+'.enc?t='+Date.now())).text();
    SLD[g]=(await decJSON(PW,b64)).slides;
    st.textContent=''; btn.disabled=false; paintSlides(g,btn);
  }catch(e){ st.textContent='불러오기 실패: '+e.message; btn.disabled=false; }
}
function paintSlides(g, btn){
  const wrap=document.getElementById('sl_'+g); if(!wrap) return;
  wrap.innerHTML=SLD[g].map((s,i)=>`<div class="slide" onclick="lbOpen('${g}',${i})"><img loading="lazy" src="${s.d}"><div class="sc">${esc(s.cap)} <em>${tfmt(s.t)}</em></div></div>`).join('');
  wrap.dataset.on='1'; btn.textContent='📑 강의 자료 접기';
}
let LBG=null, LBI=0;
function lbOpen(g,i){ LBG=g; LBI=i; lbPaint(); document.getElementById('lb').classList.add('on'); }
function lbPaint(){ const s=SLD[LBG][LBI]; document.getElementById('lbimg').src=s.d;
  document.getElementById('lbcap').textContent=s.cap+'  ·  '+tfmt(s.t)+'  ('+(LBI+1)+'/'+SLD[LBG].length+')'; }
function lbGo(d){ if(!LBG) return; LBI=(LBI+d+SLD[LBG].length)%SLD[LBG].length; lbPaint(); }
function lbClose(){ document.getElementById('lb').classList.remove('on'); }
document.addEventListener('keydown',e=>{ if(!document.getElementById('lb').classList.contains('on'))return;
  if(e.key==='Escape')lbClose(); if(e.key==='ArrowLeft')lbGo(-1); if(e.key==='ArrowRight')lbGo(1); });
function draw(){
  const gs=[...new Set(D.list.map(x=>x.g))];
  let h=`<div class="bar"><span class="chip ${G==='all'?'on':''}" onclick="G='all';draw()">전체 ${D.list.length}</span>`+
    D.list.map(x=>`<span class="chip ${G==x.g?'on':''}" onclick="G='${x.g}';draw()">${x.g}강</span>`).join('')+`</div>`;
  const rows=D.list.filter(x=>G==='all'||x.g==G).slice().sort((a,b)=>(+a.g)-(+b.g));
  for(const x of rows){
    h+=`<div class="card"><div class="lh"><span class="g">${x.g}강</span><span class="ti">${esc(x.title)}</span>
      ${x.kind?`<span class="kd ${x.kind}">${x.kind}</span>`:''}<span style="flex:1"></span>
      <span class="meta">${x.date||''}${x.dur?' · '+x.dur:''}</span></div>
      <div class="lb"><h3>📌 핵심 요약</h3><div class="sum">${sumHTML(x.summary)}</div></div>
      ${(x.charts&&x.charts.length)?`<div class="chsec">📊 강의 언급 수치 시각화</div><div class="charts">`+x.charts.map((c,ci)=>`<div class="chartcard"><div class="ct">${esc(c.title)}</div>${c.note?`<div class="cn">${esc(c.note)}</div>`:''}<div class="cbox"><canvas id="ch_${x.g}_${ci}"></canvas></div></div>`).join('')+`</div>`:''}
      ${x.slides?`<div class="slbar"><button onclick="loadSlides('${x.g}',this)">📑 강의 자료 보기</button><span class="sst"></span><span class="note" style="flex:1">영상에 나온 발표 자료를 캡처해 순서대로 담았습니다 (강사 필기 포함).</span></div><div class="slides" id="sl_${x.g}" data-on="0"></div>`:''}
      <div class="player"><button onclick="playLec('${x.g}',this)">▶ 녹음본 재생</button><span class="st"></span><audio controls style="display:none"></audio></div></div>`;
  }
  h+=`<div class="note" style="margin-top:10px">갱신 ${D.updated} · 녹음본은 AES-GCM 암호화되어 저장 — 본인 암호로만 복호화·재생됩니다. 전사·요약은 음성 인식 기반이라 일부 표기 오류가 있을 수 있습니다.</div>`;
  document.getElementById('body').innerHTML=h;
  renderCharts(rows);
}
const CHC=['#2f6df6','#0e9f5a','#d92d20','#f2a33c','#7a5af8','#0e9494'];
function renderCharts(rows){
  if(typeof Chart==='undefined') return;
  for(const x of rows){ if(!x.charts) continue;
    x.charts.forEach((c,ci)=>{
      const cv=document.getElementById('ch_'+x.g+'_'+ci); if(!cv) return;
      const ds=(c.series||[]).map((s,i)=>({label:s.name,data:s.data,backgroundColor:CHC[i%6]+'cc',borderColor:CHC[i%6],borderWidth:1.5,borderRadius:3}));
      new Chart(cv,{type:c.type||'bar',data:{labels:c.labels,datasets:ds},options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:(c.series||[]).length>1,labels:{boxWidth:10,font:{size:10}}},
          tooltip:{callbacks:{label:it=>it.dataset.label+': '+it.formattedValue+(c.unit||'')}}},
        scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{grid:{color:'#f0f2f5'},ticks:{font:{size:10},callback:v=>v+(c.unit||'')}}}}});
    });
  }
}
(async()=>{ try{ const pw=sessionStorage.getItem('lec_pw'); if(pw){ document.getElementById('pw').value=pw; await unlock(); } }catch(e){} })();
</script>
</body>
</html>
