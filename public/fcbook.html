<style>

<style>

p, li, dd, .keynote, .nb, .note, .warnfc, .easy p, .card p { text-wrap:pretty; }

/* ───────── 표 아래 개념 설명 — 작은 회색 글씨를 읽히는 크기로 */

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f0=v=>v==null||isNaN(v)?'—':Math.round(v).toLocaleString(), f1=v=>v==null||isNaN(v)?'—':Number(v).toFixed(1);
const eok=v=>v==null||isNaN(v)?'—':Math.abs(v)>=10000?(v/10000).toFixed(Math.abs(v)>=100000?0:1).replace(/\B(?=(\d{3})+(?!\d))/g,',')+'조':Math.round(v).toLocaleString()+'억';
const VZ={c:['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#7a5cd6'], gray:'#c9cdd4', ink:'#1a1f2e', sub:'#667085', grid:'#eef0f3', font:'-apple-system,"Segoe UI","Malgun Gothic",sans-serif'};
let TREE, CHD, BB, REP={}, SV={}, PRD={}, CH={}, G2C={}, CO2CH={};
const j=async(u)=>{ try{ const r=await fetch(u,{cache:'no-store'}); if(!r.ok) return null; return await r.json(); }catch(e){ return null; } };
function mk(id,cfg){ if(CH[id]) CH[id].destroy(); const el=$(id); if(!el) return; CH[id]=new Chart(el.getContext('2d'),cfg); }
function killCharts(){ for(const k in CH){ try{ CH[k].destroy(); }catch(e){} delete CH[k]; } }
Chart.defaults.font.family=VZ.font; Chart.defaults.font.size=11; Chart.defaults.color=VZ.sub;
const vzLabel={id:'vzLabel', afterDatasetsDraw(ch,_a,o){ if(!o||!o.fmt) return; const ctx=ch.ctx; ctx.save(); ctx.font='600 11px '+VZ.font; ctx.fillStyle=VZ.ink; const hz=ch.options.indexAxis==='y';
  ch.data.datasets.forEach((ds,di)=>{ if(o.only!=null&&o.only!==di) return; ch.getDatasetMeta(di).data.forEach((el,i)=>{ const v=ds.data[i]; if(v==null) return; const t=o.fmt(v,i,di); if(!t) return;
    if(hz){ ctx.textAlign=v<0?'right':'left'; ctx.textBaseline='middle'; ctx.fillText(t, el.x+(v<0?-5:5), el.y); } else { ctx.textAlign='center'; ctx.textBaseline=v<0?'top':'bottom'; ctx.fillText(t, el.x, el.y+(v<0?4:-4)); } }); }); ctx.restore(); }};
const ax=(o)=>Object.assign({grid:{color:VZ.grid,drawTicks:false},border:{display:false},ticks:{color:VZ.sub,padding:6}},o||{});
function hbar(id,labels,data,colors,o){ o=o||{}; mk(id,{type:'bar',data:{labels,datasets:[{data,backgroundColor:colors,borderRadius:4,borderSkipped:false,maxBarThickness:16}]},plugins:[vzLabel],
  options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',layout:{padding:{right:o.pad||58,left:0}},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+(o.fmt?o.fmt(c.raw):c.raw)}},vzLabel:{fmt:o.fmt||(v=>f0(v))}},
    scales:{x:ax({ticks:{color:VZ.sub,maxTicksLimit:5,callback:o.tick||(v=>f0(v))}}),y:ax({grid:{display:false},ticks:{color:VZ.ink,font:{size:11.5}}})}}}); }
function vbar(id,labels,sets,o){ o=o||{}; mk(id,{type:'bar',data:{labels,datasets:sets},plugins:[vzLabel],
  options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:18}},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+c.dataset.label+' '+(o.fmt?o.fmt(c.raw):f0(c.raw))}},vzLabel:{fmt:o.lab,only:o.only}},
    scales:{x:ax({grid:{display:false},ticks:{color:VZ.sub,maxRotation:0,autoSkip:labels.length>12,maxTicksLimit:11,font:{size:10}}}),y:ax({beginAtZero:!!o.zero,ticks:{callback:v=>f0(v),maxTicksLimit:5}})}}}); }
function vline(id,labels,sets,o){ o=o||{}; mk(id,{type:'line',data:{labels,datasets:sets},
  options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+c.dataset.label+' '+(o.fmt?o.fmt(c.raw):f1(c.raw))}}},
    elements:{line:{borderWidth:2,tension:.25},point:{radius:2.5,hitRadius:10}},
    scales:{x:ax({grid:{display:false},ticks:{color:VZ.sub,maxRotation:0,autoSkip:labels.length>12,maxTicksLimit:11,font:{size:10}}}),y:ax({ticks:{callback:o.tick||(v=>f1(v)),maxTicksLimit:5},suggestedMin:o.min,suggestedMax:o.max})}}}); }
function vclip(s,w){ s=String(s||'').trim(); let n=0,i=0; for(;i<s.length;i++){ n+=/[ᄀ-￿]/.test(s[i])?1:0.58; if(n>w) break; } return i<s.length?s.slice(0,Math.max(1,i-1)).trim()+'…':s; }

/* ───────── 공통 조각 */
const TAGN={'증권사':'증권사·조사기관'};
const tagH=t=>t?`<span class="tag t${esc(t)}">${esc(TAGN[t]||t)}</span>`:'';
function srcH(ch,s){ if(!s||!s.length) return ''; return '<span class="sx">'+s.map(i=>{ const x=(ch.src||[])[i]; return x?`<a href="${esc(x.u)}" target="_blank" rel="noopener" title="${esc(x.t)}">[${i+1}]</a>`:''; }).join('')+'</span>'; }
const claim=(ch,x)=>`${esc(x.t)} ${tagH(x.tag)}${srcH(ch,x.s)}`;
const coN=c=>(TREE.co||{})[c]||((PRD[c]||{}).n)||c;
const coLink=c=>`<a href="#c=${c}">${esc(coN(c))}</a>`;
const sv=c=>{ const a=SV[c]; return a?{pbr:a[0],per:a[1],cap:a[2],px:a[3],roe:a[4]}:{}; };
function pathOf(gid){ for(const T of TREE.top) for(const M of T.mid) for(const g of M.g) if(g.id===gid) return [T,M,g]; return null; }
function topOf(tid){ return TREE.top.find(T=>T.id===tid)||null; }
function groupsOf(code){ const out=[]; for(const T of TREE.top) for(const M of T.mid) for(const g of M.g) if(g.co.includes(code)) out.push([T,M,g]); return out; }
function chOf(gid){ const id=G2C[gid]; return id?CHD.ch[id]:null; }
function chCo(code){ const r=CO2CH[code]; return r?{ch:CHD.ch[r[0]],co:CHD.ch[r[0]].companies[r[1]]}:null; }
const byCap=(a,b)=>((sv(b).cap||0)-(sv(a).cap||0));
const priceDay=()=>String(SV._at||'').slice(0,10);

/* ───────── 기본 지식 (교과서 앞머리) */
const BASIC_WRITTEN='2026-10-26';
const FIG={"cell": "<svg viewBox=\"0 0 920 330\" xmlns=\"http://www.w3.org/2000/svg\">\n<defs><marker id=\"aO\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#eb6834\"/></marker>\n<marker id=\"aE\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#2a78d6\"/></marker></defs>\n<text class=\"b\" x=\"18\" y=\"22\" style=\"font-size:14px\">SOFC 단전지는 어떻게 전기를 만드는가</text>\n<text class=\"s\" x=\"18\" y=\"40\">세라믹 판을 700~850℃로 달구면 산소가 이온이 되어 판을 건너간다. 그때 떨어져 나온 전자가 바깥 회로를 도는 것이 전기다.</text>\n\n<rect x=\"120\" y=\"70\" width=\"210\" height=\"52\" rx=\"6\" fill=\"#dbeafe\" stroke=\"#2a78d6\"/>\n<text class=\"b\" x=\"225\" y=\"96\" text-anchor=\"middle\" style=\"font-size:13px\">공기극 (cathode)</text>\n<text class=\"s\" x=\"225\" y=\"113\" text-anchor=\"middle\">LSM · LSCF · LSC</text>\n\n<rect x=\"120\" y=\"132\" width=\"210\" height=\"46\" rx=\"4\" fill=\"#fde9d3\" stroke=\"#eb6834\" stroke-width=\"2\"/>\n<text class=\"w\" x=\"225\" y=\"152\" text-anchor=\"middle\" style=\"font-size:13px\">전해질 (치밀 세라믹)</text>\n<text class=\"s\" x=\"225\" y=\"169\" text-anchor=\"middle\">YSZ · ScSZ · GDC</text>\n\n<rect x=\"120\" y=\"188\" width=\"210\" height=\"52\" rx=\"6\" fill=\"#e5e7eb\" stroke=\"#667085\"/>\n<text class=\"b\" x=\"225\" y=\"214\" text-anchor=\"middle\" style=\"font-size:13px\">연료극 (anode)</text>\n<text class=\"s\" x=\"225\" y=\"231\" text-anchor=\"middle\">Ni-YSZ 서멧</text>\n\n<text class=\"s\" x=\"60\" y=\"100\" text-anchor=\"middle\">공기</text>\n<text class=\"s\" x=\"60\" y=\"116\" text-anchor=\"middle\">(O₂)</text>\n<path d=\"M30,96 L112,96\" stroke=\"#2a78d6\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#aE)\"/>\n<text class=\"s\" x=\"60\" y=\"214\" text-anchor=\"middle\">연료</text>\n<text class=\"s\" x=\"60\" y=\"230\" text-anchor=\"middle\">(H₂ · CH₄)</text>\n<path d=\"M30,210 L112,210\" stroke=\"#667085\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#aE)\"/>\n\n<path d=\"M300,126 L300,186\" stroke=\"#eb6834\" stroke-width=\"3\" fill=\"none\" marker-end=\"url(#aO)\"/>\n<text class=\"w\" x=\"340\" y=\"150\" style=\"font-size:12px\">O²⁻</text>\n<text class=\"s\" x=\"340\" y=\"166\">산소이온이</text>\n<text class=\"s\" x=\"340\" y=\"180\">세라믹을 건넌다</text>\n\n<path d=\"M118,200 L70,200 L70,280 L420,280 L420,96 L332,96\" stroke=\"#2a78d6\" stroke-width=\"2.5\" fill=\"none\" marker-end=\"url(#aE)\"/>\n<rect x=\"210\" y=\"262\" width=\"78\" height=\"34\" rx=\"6\" fill=\"#2a78d6\"/>\n<text class=\"bw\" x=\"249\" y=\"284\" text-anchor=\"middle\">전기</text>\n<text class=\"s\" x=\"300\" y=\"300\">전자(e⁻)가 바깥 회로를 돈다</text>\n\n<text class=\"s\" x=\"340\" y=\"212\">배기: 물(H₂O)</text>\n<text class=\"s\" x=\"340\" y=\"228\">탄화수소 연료면 CO₂도</text>\n\n<line x1=\"470\" y1=\"62\" x2=\"470\" y2=\"310\" stroke=\"#e4e7ec\" stroke-width=\"1.5\"/>\n<text class=\"b\" x=\"492\" y=\"84\" style=\"font-size:13px\">2차전지와 무엇이 다른가</text>\n<rect x=\"492\" y=\"96\" width=\"400\" height=\"30\" rx=\"5\" fill=\"#f8fafc\" stroke=\"#e4e7ec\"/>\n<text class=\"s\" x=\"504\" y=\"115\">전극이 <tspan class=\"b\">소모되지 않는다</tspan> — 담는 그릇이 아니라 반응을 돕는 촉매다</text>\n<rect x=\"492\" y=\"132\" width=\"400\" height=\"30\" rx=\"5\" fill=\"#f8fafc\" stroke=\"#e4e7ec\"/>\n<text class=\"s\" x=\"504\" y=\"151\"><tspan class=\"b\">분리막이 없다</tspan> — 전해질이 치밀해서 그 자체가 차단벽이다</text>\n<rect x=\"492\" y=\"168\" width=\"400\" height=\"30\" rx=\"5\" fill=\"#f8fafc\" stroke=\"#e4e7ec\"/>\n<text class=\"s\" x=\"504\" y=\"187\">연료를 <tspan class=\"b\">계속 넣어야</tspan> 한다 — 충전이라는 개념이 없다</text>\n<rect x=\"492\" y=\"204\" width=\"400\" height=\"30\" rx=\"5\" fill=\"#fff7ed\" stroke=\"#fdba74\"/>\n<text class=\"s\" x=\"504\" y=\"223\">스펙 단위가 <tspan class=\"w\">kW(출력)</tspan>뿐 — 담는 양(kWh)이 없다</text>\n<rect x=\"492\" y=\"240\" width=\"400\" height=\"56\" rx=\"5\" fill=\"#fffbeb\" stroke=\"#fde68a\"/>\n<text class=\"s\" x=\"504\" y=\"259\">수명이 끝나는 이유도 다르다 — 활물질이 닳아서가 아니라</text>\n<text class=\"s\" x=\"504\" y=\"276\">세라믹에 금이 가거나, 밀봉이 새거나,</text>\n<text class=\"s\" x=\"504\" y=\"291\">접속재의 크롬이 날아와 전극을 더럽혀서 끝난다</text>\n</svg>", "pt": "<svg viewBox=\"0 0 920 300\" xmlns=\"http://www.w3.org/2000/svg\">\n<defs><marker id=\"p1\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#667085\"/></marker></defs>\n<text class=\"b\" x=\"18\" y=\"22\" style=\"font-size:14px\">백금은 왜 필요한가 — 그리고 SOFC는 왜 필요 없는가</text>\n<text class=\"s\" x=\"18\" y=\"40\">반응이 일어나려면 넘어야 하는 '언덕'이 있다. 촉매는 그 언덕을 낮춰주고, 열도 같은 일을 한다.</text>\n\n<text class=\"b\" x=\"60\" y=\"72\" style=\"font-size:12.5px\">① 저온 (PEMFC · 60~90℃)</text>\n<path d=\"M60,210 L300,210\" stroke=\"#98a2b3\" stroke-width=\"1.5\"/>\n<path d=\"M60,200 L60,86\" stroke=\"#98a2b3\" stroke-width=\"1.5\"/>\n<text class=\"s\" x=\"34\" y=\"140\" transform=\"rotate(-90 34,140)\" text-anchor=\"middle\">필요한 에너지</text>\n<path d=\"M78,200 C120,200 128,100 170,100 C212,100 220,186 262,186\" stroke=\"#b42318\" stroke-width=\"2.5\" fill=\"none\"/>\n<text class=\"s\" x=\"170\" y=\"92\" text-anchor=\"middle\" fill=\"#b42318\">언덕이 높다</text>\n<path d=\"M78,200 C120,200 128,152 170,152 C212,152 220,186 262,186\" stroke=\"#15803d\" stroke-width=\"2.5\" fill=\"none\" stroke-dasharray=\"5 3\"/>\n<text class=\"s\" x=\"206\" y=\"146\" fill=\"#15803d\">백금이 낮춰준 길</text>\n<text class=\"s\" x=\"180\" y=\"226\" text-anchor=\"middle\">열이 모자라니 <tspan class=\"b\">백금 촉매로</tspan> 언덕을 낮춰야 한다</text>\n<rect x=\"60\" y=\"238\" width=\"246\" height=\"46\" rx=\"6\" fill=\"#fef2f2\" stroke=\"#fca5a5\"/>\n<text class=\"s\" x=\"72\" y=\"257\">백금은 비싸고 양이 적다 → <tspan class=\"b\">원가 부담</tspan></text>\n<text class=\"s\" x=\"72\" y=\"274\">황·일산화탄소에 쉽게 망가진다 → <tspan class=\"b\">순수소 필요</tspan></text>\n\n<line x1=\"340\" y1=\"56\" x2=\"340\" y2=\"290\" stroke=\"#e4e7ec\" stroke-width=\"1.5\"/>\n\n<text class=\"b\" x=\"380\" y=\"72\" style=\"font-size:12.5px\">② 고온 (SOFC · 700~850℃)</text>\n<path d=\"M380,210 L620,210\" stroke=\"#98a2b3\" stroke-width=\"1.5\"/>\n<path d=\"M380,200 L380,86\" stroke=\"#98a2b3\" stroke-width=\"1.5\"/>\n<path d=\"M398,200 C440,200 448,100 490,100 C532,100 540,186 582,186\" stroke=\"#c9cdd4\" stroke-width=\"2\" fill=\"none\" stroke-dasharray=\"4 4\"/>\n<text class=\"s\" x=\"490\" y=\"92\" text-anchor=\"middle\" fill=\"#98a2b3\">같은 언덕이지만</text>\n<rect x=\"380\" y=\"168\" width=\"240\" height=\"42\" fill=\"#fde9d3\" opacity=\".8\"/>\n<text class=\"w\" x=\"500\" y=\"194\" text-anchor=\"middle\" style=\"font-size:12px\">열이 에너지를 공급한다</text>\n<text class=\"s\" x=\"500\" y=\"226\" text-anchor=\"middle\">뜨거우니 분자가 이미 활발하다 → <tspan class=\"b\">백금이 필요 없다</tspan></text>\n<rect x=\"380\" y=\"238\" width=\"246\" height=\"46\" rx=\"6\" fill=\"#f0fdf4\" stroke=\"#86efac\"/>\n<text class=\"s\" x=\"392\" y=\"257\">니켈 같은 값싼 금속으로 충분 → <tspan class=\"b\">원가 유리</tspan></text>\n<text class=\"s\" x=\"392\" y=\"274\">연료를 가려 받지 않음 → <tspan class=\"b\">천연가스 그대로</tspan></text>\n\n<line x1=\"660\" y1=\"56\" x2=\"660\" y2=\"290\" stroke=\"#e4e7ec\" stroke-width=\"1.5\"/>\n<text class=\"b\" x=\"684\" y=\"78\" style=\"font-size:12.5px\">그래서 생기는 결과</text>\n<rect x=\"684\" y=\"90\" width=\"212\" height=\"54\" rx=\"6\" fill=\"#f8fafc\" stroke=\"#e4e7ec\"/>\n<text class=\"s\" x=\"694\" y=\"109\"><tspan class=\"b\">PEMFC</tspan> — 백금 + 순수소가 전제</text>\n<text class=\"s\" x=\"694\" y=\"126\">수소 저장·충전 인프라와</text>\n<text class=\"s\" x=\"694\" y=\"140\">한 몸으로 움직인다</text>\n<rect x=\"684\" y=\"152\" width=\"212\" height=\"54\" rx=\"6\" fill=\"#f8fafc\" stroke=\"#e4e7ec\"/>\n<text class=\"s\" x=\"694\" y=\"171\"><tspan class=\"b\">SOFC · PAFC</tspan> — 도시가스로 가능</text>\n<text class=\"s\" x=\"694\" y=\"188\">이미 깔린 가스 배관을 쓴다</text>\n<text class=\"s\" x=\"694\" y=\"202\">→ 발전용에서 먼저 자리잡음</text>\n<rect x=\"684\" y=\"214\" width=\"212\" height=\"70\" rx=\"6\" fill=\"#fffbeb\" stroke=\"#fde68a\"/>\n<text class=\"s\" x=\"694\" y=\"233\"><tspan class=\"w\">투자 관점</tspan></text>\n<text class=\"s\" x=\"694\" y=\"250\">PAFC 수주가 늘어도 수소 저장·</text>\n<text class=\"s\" x=\"694\" y=\"266\">충전 업체는 수혜가 아니다.</text>\n<text class=\"s\" x=\"694\" y=\"280\">두 줄기를 섞어 읽으면 틀린다.</text>\n</svg>", "fuel": "<svg viewBox=\"0 0 920 300\" xmlns=\"http://www.w3.org/2000/svg\">\n<defs><marker id=\"f1\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6.5\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#667085\"/></marker></defs>\n<text class=\"b\" x=\"18\" y=\"22\" style=\"font-size:14px\">연료별로 무엇이 달라지는가</text>\n<text class=\"s\" x=\"18\" y=\"40\">연료가 다르면 '스택 앞에 무엇을 붙여야 하는가'와 '어떤 인프라에 묶이는가'가 달라진다.</text>\n\n<rect x=\"20\" y=\"58\" width=\"150\" height=\"54\" rx=\"7\" fill=\"#dbeafe\" stroke=\"#2a78d6\"/>\n<text class=\"b\" x=\"95\" y=\"80\" text-anchor=\"middle\">수소 (H₂)</text>\n<text class=\"s\" x=\"95\" y=\"98\" text-anchor=\"middle\">순도 높아야 함</text>\n<path d=\"M174,85 L250,85\" stroke=\"#667085\" stroke-width=\"1.8\" marker-end=\"url(#f1)\"/>\n<rect x=\"254\" y=\"62\" width=\"120\" height=\"46\" rx=\"6\" fill=\"#f8fafc\" stroke=\"#e4e7ec\"/>\n<text class=\"s\" x=\"314\" y=\"82\" text-anchor=\"middle\">전처리 거의 없음</text>\n<text class=\"s\" x=\"314\" y=\"98\" text-anchor=\"middle\">바로 스택으로</text>\n\n<rect x=\"20\" y=\"124\" width=\"150\" height=\"54\" rx=\"7\" fill=\"#e5e7eb\" stroke=\"#667085\"/>\n<text class=\"b\" x=\"95\" y=\"146\" text-anchor=\"middle\">천연가스 (CH₄)</text>\n<text class=\"s\" x=\"95\" y=\"164\" text-anchor=\"middle\">도시가스 배관</text>\n<path d=\"M174,151 L250,151\" stroke=\"#667085\" stroke-width=\"1.8\" marker-end=\"url(#f1)\"/>\n<rect x=\"254\" y=\"128\" width=\"120\" height=\"46\" rx=\"6\" fill=\"#fff7ed\" stroke=\"#fdba74\"/>\n<text class=\"s\" x=\"314\" y=\"147\" text-anchor=\"middle\"><tspan class=\"w\">탈황 → 개질</tspan></text>\n<text class=\"s\" x=\"314\" y=\"164\" text-anchor=\"middle\">설비가 추가된다</text>\n\n<rect x=\"20\" y=\"190\" width=\"150\" height=\"54\" rx=\"7\" fill=\"#f3e8ff\" stroke=\"#7a5cd6\"/>\n<text class=\"b\" x=\"95\" y=\"212\" text-anchor=\"middle\">암모니아 (NH₃)</text>\n<text class=\"s\" x=\"95\" y=\"230\" text-anchor=\"middle\">운반이 쉬움</text>\n<path d=\"M174,217 L250,217\" stroke=\"#667085\" stroke-width=\"1.8\" marker-end=\"url(#f1)\"/>\n<rect x=\"254\" y=\"194\" width=\"120\" height=\"46\" rx=\"6\" fill=\"#fff7ed\" stroke=\"#fdba74\"/>\n<text class=\"s\" x=\"314\" y=\"213\" text-anchor=\"middle\"><tspan class=\"w\">분해 장치</tspan></text>\n<text class=\"s\" x=\"314\" y=\"230\" text-anchor=\"middle\">질소를 떼어낸다</text>\n\n<path d=\"M378,85 C410,85 410,151 440,151\" stroke=\"#98a2b3\" stroke-width=\"1.6\" fill=\"none\"/>\n<path d=\"M378,151 L440,151\" stroke=\"#98a2b3\" stroke-width=\"1.6\" fill=\"none\"/>\n<path d=\"M378,217 C410,217 410,151 440,151\" stroke=\"#98a2b3\" stroke-width=\"1.6\" fill=\"none\"/>\n<rect x=\"444\" y=\"118\" width=\"104\" height=\"66\" rx=\"8\" fill=\"#fde9d3\" stroke=\"#eb6834\" stroke-width=\"2\"/>\n<text class=\"w\" x=\"496\" y=\"146\" text-anchor=\"middle\" style=\"font-size:13px\">스택</text>\n<text class=\"s\" x=\"496\" y=\"165\" text-anchor=\"middle\">700~850℃</text>\n\n<line x1=\"580\" y1=\"56\" x2=\"580\" y2=\"286\" stroke=\"#e4e7ec\" stroke-width=\"1.5\"/>\n<text class=\"b\" x=\"602\" y=\"76\" style=\"font-size:12.5px\">장단점</text>\n\n<rect x=\"602\" y=\"86\" width=\"296\" height=\"60\" rx=\"6\" fill=\"#f8fafc\" stroke=\"#e4e7ec\"/>\n<text class=\"s\" x=\"612\" y=\"104\"><tspan class=\"b\">수소</tspan> — 배기가 물뿐. 탄소 배출 0</text>\n<text class=\"s\" x=\"612\" y=\"121\">단점: 만들고 나르고 담는 비용이 크고</text>\n<text class=\"s\" x=\"612\" y=\"137\">인프라가 아직 얇다</text>\n\n<rect x=\"602\" y=\"152\" width=\"296\" height=\"60\" rx=\"6\" fill=\"#f8fafc\" stroke=\"#e4e7ec\"/>\n<text class=\"s\" x=\"612\" y=\"170\"><tspan class=\"b\">천연가스</tspan> — 배관이 이미 깔려 있어 지금 쓸 수 있다</text>\n<text class=\"s\" x=\"612\" y=\"187\">단점: CO₂가 나온다(약 330g/kWh 수준으로</text>\n<text class=\"s\" x=\"612\" y=\"203\">제시되며, 탈황·개질 설비가 붙는다)</text>\n\n<rect x=\"602\" y=\"218\" width=\"296\" height=\"60\" rx=\"6\" fill=\"#f8fafc\" stroke=\"#e4e7ec\"/>\n<text class=\"s\" x=\"612\" y=\"236\"><tspan class=\"b\">암모니아</tspan> — 액화가 쉬워 멀리 나르기 유리</text>\n<text class=\"s\" x=\"612\" y=\"253\">단점: 분해 장치가 필요하고 독성이 있다.</text>\n<text class=\"s\" x=\"612\" y=\"269\">선박·대형 발전 쪽에서 주로 거론된다</text>\n</svg>", "elec": "<svg viewBox=\"0 0 920 310\" xmlns=\"http://www.w3.org/2000/svg\">\n<text class=\"b\" x=\"18\" y=\"22\" style=\"font-size:14px\">전해질 종류별 차이 — 어느 온도에서 쓸 수 있는가</text>\n<text class=\"s\" x=\"18\" y=\"40\">가로축은 작동 온도. 진한 구간이 그 소재가 실제로 쓸 만한 범위다. 낮은 온도에서 쓸수록 주변 부품이 싸진다.</text>\n\n<line x1=\"150\" y1=\"250\" x2=\"860\" y2=\"250\" stroke=\"#98a2b3\" stroke-width=\"1.5\"/>\n<text class=\"s\" x=\"150\" y=\"268\" text-anchor=\"middle\">500℃</text>\n<text class=\"s\" x=\"327\" y=\"268\" text-anchor=\"middle\">650℃</text>\n<text class=\"s\" x=\"505\" y=\"268\" text-anchor=\"middle\">750℃</text>\n<text class=\"s\" x=\"683\" y=\"268\" text-anchor=\"middle\">850℃</text>\n<text class=\"s\" x=\"860\" y=\"268\" text-anchor=\"middle\">1000℃</text>\n<line x1=\"327\" y1=\"70\" x2=\"327\" y2=\"250\" stroke=\"#e4e7ec\" stroke-dasharray=\"4 4\"/>\n<line x1=\"505\" y1=\"70\" x2=\"505\" y2=\"250\" stroke=\"#e4e7ec\" stroke-dasharray=\"4 4\"/>\n<line x1=\"683\" y1=\"70\" x2=\"683\" y2=\"250\" stroke=\"#e4e7ec\" stroke-dasharray=\"4 4\"/>\n\n<text class=\"b\" x=\"18\" y=\"92\">YSZ</text>\n<text class=\"s\" x=\"18\" y=\"108\">가장 표준</text>\n<rect x=\"450\" y=\"76\" width=\"410\" height=\"26\" rx=\"5\" fill=\"#2a78d6\"/>\n<text class=\"sw\" x=\"655\" y=\"94\" text-anchor=\"middle\">이트리아 안정화 지르코니아 — 값싸고 안정, 저온에서는 저항이 커진다</text>\n\n<text class=\"b\" x=\"18\" y=\"146\">ScSZ</text>\n<text class=\"s\" x=\"18\" y=\"162\">저온 유리</text>\n<rect x=\"290\" y=\"130\" width=\"500\" height=\"26\" rx=\"5\" fill=\"#eb6834\"/>\n<text class=\"sw\" x=\"540\" y=\"148\" text-anchor=\"middle\">스칸디아 안정화 — 이온이 더 잘 통해 저온화 가능. 스칸디움이 비싸고 희소</text>\n<line x1=\"290\" y1=\"124\" x2=\"290\" y2=\"162\" stroke=\"#b42318\" stroke-width=\"2\"/>\n<text class=\"s\" x=\"286\" y=\"120\" text-anchor=\"end\" fill=\"#b42318\">약 580℃ 아래에서는</text>\n<text class=\"s\" x=\"286\" y=\"106\" text-anchor=\"end\" fill=\"#b42318\">결정 구조가 바뀌어 한계</text>\n\n<text class=\"b\" x=\"18\" y=\"200\">GDC / CGO</text>\n<text class=\"s\" x=\"18\" y=\"216\">저온 전용</text>\n<rect x=\"150\" y=\"184\" width=\"320\" height=\"26\" rx=\"5\" fill=\"#1baf7a\"/>\n<text class=\"sw\" x=\"310\" y=\"202\" text-anchor=\"middle\">세리아계 — 저온에서 최고. 다만 고온에서 전기가 새어 효율이 떨어진다</text>\n\n<text class=\"s\" x=\"490\" y=\"202\">↑ 그래서 보통 <tspan class=\"b\">배리어층</tspan>으로 얇게만 쓴다</text>\n\n<rect x=\"18\" y=\"286\" width=\"884\" height=\"18\" fill=\"none\"/>\n<text class=\"s\" x=\"18\" y=\"298\">※ 온도 구간은 일반적으로 알려진 범위를 정리한 것이고 제품·조성에 따라 다르다. LSGM(란타넘 갈레이트)은 연구용 외에 상용 채택 사례를 확인하지 못했다.</text>\n</svg>", "make": "<svg viewBox=\"0 0 920 390\" xmlns=\"http://www.w3.org/2000/svg\">\n<defs><marker id=\"m1\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6.5\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#98a2b3\"/></marker></defs>\n<text class=\"b\" x=\"18\" y=\"22\" style=\"font-size:14px\">SOFC는 어떻게 만들어지는가</text>\n<text class=\"s\" x=\"18\" y=\"40\">세라믹 가루를 반죽해 얇게 펴고 구워서 판을 만든 뒤, 전극을 인쇄해 다시 굽고, 금속판과 번갈아 쌓아 스택으로 만든다.</text>\n\n<text class=\"b\" x=\"18\" y=\"70\" style=\"font-size:12.5px\">① 단전지 만들기</text>\n<rect x=\"18\" y=\"80\" width=\"118\" height=\"58\" rx=\"7\" fill=\"#f8fafc\" stroke=\"#e4e7ec\"/>\n<text class=\"s\" x=\"77\" y=\"100\" text-anchor=\"middle\"><tspan class=\"b\">1. 분말 합성</tspan></text>\n<text class=\"s\" x=\"77\" y=\"116\" text-anchor=\"middle\">지르코니아·세리아</text>\n<text class=\"s\" x=\"77\" y=\"130\" text-anchor=\"middle\">조성을 맞춘다</text>\n<path d=\"M140,109 L160,109\" stroke=\"#98a2b3\" stroke-width=\"1.6\" marker-end=\"url(#m1)\"/>\n<rect x=\"164\" y=\"80\" width=\"118\" height=\"58\" rx=\"7\" fill=\"#f8fafc\" stroke=\"#e4e7ec\"/>\n<text class=\"s\" x=\"223\" y=\"100\" text-anchor=\"middle\"><tspan class=\"b\">2. 슬러리</tspan></text>\n<text class=\"s\" x=\"223\" y=\"116\" text-anchor=\"middle\">바인더·용매와 섞어</text>\n<text class=\"s\" x=\"223\" y=\"130\" text-anchor=\"middle\">반죽을 만든다</text>\n<path d=\"M286,109 L306,109\" stroke=\"#98a2b3\" stroke-width=\"1.6\" marker-end=\"url(#m1)\"/>\n<rect x=\"310\" y=\"80\" width=\"118\" height=\"58\" rx=\"7\" fill=\"#fde9d3\" stroke=\"#eb6834\" stroke-width=\"2\"/>\n<text class=\"s\" x=\"369\" y=\"100\" text-anchor=\"middle\"><tspan class=\"w\">3. 테이프캐스팅</tspan></text>\n<text class=\"s\" x=\"369\" y=\"116\" text-anchor=\"middle\">얇게 펴 말린다</text>\n<text class=\"s\" x=\"369\" y=\"130\" text-anchor=\"middle\">두께가 여기서 결정</text>\n<path d=\"M432,109 L452,109\" stroke=\"#98a2b3\" stroke-width=\"1.6\" marker-end=\"url(#m1)\"/>\n<rect x=\"456\" y=\"80\" width=\"118\" height=\"58\" rx=\"7\" fill=\"#fde9d3\" stroke=\"#eb6834\" stroke-width=\"2\"/>\n<text class=\"s\" x=\"515\" y=\"100\" text-anchor=\"middle\"><tspan class=\"w\">4. 소성(굽기)</tspan></text>\n<text class=\"s\" x=\"515\" y=\"116\" text-anchor=\"middle\">1300℃ 이상에서</text>\n<text class=\"s\" x=\"515\" y=\"130\" text-anchor=\"middle\">치밀하게 굳힌다</text>\n<path d=\"M578,109 L598,109\" stroke=\"#98a2b3\" stroke-width=\"1.6\" marker-end=\"url(#m1)\"/>\n<rect x=\"602\" y=\"80\" width=\"118\" height=\"58\" rx=\"7\" fill=\"#f8fafc\" stroke=\"#e4e7ec\"/>\n<text class=\"s\" x=\"661\" y=\"100\" text-anchor=\"middle\"><tspan class=\"b\">5. 전극 인쇄</tspan></text>\n<text class=\"s\" x=\"661\" y=\"116\" text-anchor=\"middle\">양면에 연료극·</text>\n<text class=\"s\" x=\"661\" y=\"130\" text-anchor=\"middle\">공기극을 바른다</text>\n<path d=\"M724,109 L744,109\" stroke=\"#98a2b3\" stroke-width=\"1.6\" marker-end=\"url(#m1)\"/>\n<rect x=\"748\" y=\"80\" width=\"150\" height=\"58\" rx=\"7\" fill=\"#dbeafe\" stroke=\"#2a78d6\"/>\n<text class=\"s\" x=\"823\" y=\"100\" text-anchor=\"middle\"><tspan class=\"b\">6. 재소성 → 단전지</tspan></text>\n<text class=\"s\" x=\"823\" y=\"116\" text-anchor=\"middle\">전극을 붙여 굽고</text>\n<text class=\"s\" x=\"823\" y=\"130\" text-anchor=\"middle\">한 장씩 검사한다</text>\n\n<text class=\"b\" x=\"18\" y=\"178\" style=\"font-size:12.5px\">② 스택으로 쌓기</text>\n<rect x=\"18\" y=\"188\" width=\"150\" height=\"58\" rx=\"7\" fill=\"#f8fafc\" stroke=\"#e4e7ec\"/>\n<text class=\"s\" x=\"93\" y=\"208\" text-anchor=\"middle\"><tspan class=\"b\">7. 접속재 준비</tspan></text>\n<text class=\"s\" x=\"93\" y=\"224\" text-anchor=\"middle\">스테인리스에 코팅</text>\n<text class=\"s\" x=\"93\" y=\"238\" text-anchor=\"middle\">(크롬 휘발 차단)</text>\n<path d=\"M172,217 L192,217\" stroke=\"#98a2b3\" stroke-width=\"1.6\" marker-end=\"url(#m1)\"/>\n<rect x=\"196\" y=\"188\" width=\"150\" height=\"58\" rx=\"7\" fill=\"#f8fafc\" stroke=\"#e4e7ec\"/>\n<text class=\"s\" x=\"271\" y=\"208\" text-anchor=\"middle\"><tspan class=\"b\">8. 적층</tspan></text>\n<text class=\"s\" x=\"271\" y=\"224\" text-anchor=\"middle\">단전지와 접속재를</text>\n<text class=\"s\" x=\"271\" y=\"238\" text-anchor=\"middle\">번갈아 쌓는다</text>\n<path d=\"M350,217 L370,217\" stroke=\"#98a2b3\" stroke-width=\"1.6\" marker-end=\"url(#m1)\"/>\n<rect x=\"374\" y=\"188\" width=\"150\" height=\"58\" rx=\"7\" fill=\"#fde9d3\" stroke=\"#eb6834\" stroke-width=\"2\"/>\n<text class=\"s\" x=\"449\" y=\"208\" text-anchor=\"middle\"><tspan class=\"w\">9. 밀봉</tspan></text>\n<text class=\"s\" x=\"449\" y=\"224\" text-anchor=\"middle\">유리 실런트로 가장자리</text>\n<text class=\"s\" x=\"449\" y=\"238\" text-anchor=\"middle\">연료·공기를 가른다</text>\n<path d=\"M528,217 L548,217\" stroke=\"#98a2b3\" stroke-width=\"1.6\" marker-end=\"url(#m1)\"/>\n<rect x=\"552\" y=\"188\" width=\"150\" height=\"58\" rx=\"7\" fill=\"#f8fafc\" stroke=\"#e4e7ec\"/>\n<text class=\"s\" x=\"627\" y=\"208\" text-anchor=\"middle\"><tspan class=\"b\">10. 열처리·환원</tspan></text>\n<text class=\"s\" x=\"627\" y=\"224\" text-anchor=\"middle\">NiO를 Ni로 바꾸고</text>\n<text class=\"s\" x=\"627\" y=\"238\" text-anchor=\"middle\">실런트를 녹여 붙인다</text>\n<path d=\"M706,217 L726,217\" stroke=\"#98a2b3\" stroke-width=\"1.6\" marker-end=\"url(#m1)\"/>\n<rect x=\"730\" y=\"188\" width=\"168\" height=\"58\" rx=\"7\" fill=\"#dbeafe\" stroke=\"#2a78d6\"/>\n<text class=\"s\" x=\"814\" y=\"208\" text-anchor=\"middle\"><tspan class=\"b\">11. 성능·기밀 검사</tspan></text>\n<text class=\"s\" x=\"814\" y=\"224\" text-anchor=\"middle\">새는 곳이 하나라도</text>\n<text class=\"s\" x=\"814\" y=\"238\" text-anchor=\"middle\">있으면 스택 전체 불합격</text>\n\n<rect x=\"18\" y=\"266\" width=\"880\" height=\"48\" rx=\"7\" fill=\"#fffbeb\" stroke=\"#fde68a\"/>\n<text class=\"s\" x=\"32\" y=\"286\"><tspan class=\"w\">수율이 갈리는 지점</tspan> — ③ 테이프캐스팅의 두께 균일도, ④ 소성에서 생기는 휨과 수축, ⑨ 밀봉의 기밀, ⑪ 한 장이라도 새면 스택 전체가 버려진다.</text>\n<text class=\"s\" x=\"32\" y=\"304\">단전지 한 장의 수율이 99%라도 30장을 쌓으면 스택 수율은 약 74%가 된다. 적층 수가 늘수록 장당 수율이 더 중요해진다.</text>\n\n<rect x=\"18\" y=\"326\" width=\"880\" height=\"46\" rx=\"7\" fill=\"#f8fafc\" stroke=\"#e4e7ec\"/>\n<text class=\"s\" x=\"32\" y=\"345\">③~④가 전해질 <tspan class=\"b\">시트</tspan> 공정이고, 이 단계만 떼어 파는 회사가 따로 있다 — 중국 三环集团, 한국 <tspan class=\"b\">아모센스</tspan>(블룸에너지향).</text>\n<text class=\"s\" x=\"32\" y=\"363\">전해질 지지형(ESC) 셀에서는 이 시트가 셀의 구조까지 떠받치므로, 셀 생산량에 1:1로 비례해 들어간다.</text>\n</svg>", "moat": "<svg viewBox=\"0 0 920 320\" xmlns=\"http://www.w3.org/2000/svg\">\n<text class=\"b\" x=\"18\" y=\"22\" style=\"font-size:14px\">왜 세라믹 판으로 구워내는 공정이 진입장벽인가</text>\n<text class=\"s\" x=\"18\" y=\"40\">서로 반대로 가는 세 가지 요구를 한 장에서 동시에 만족시켜야 하고, 구울 때 줄어드는 양까지 맞춰야 한다.</text>\n\n<text class=\"b\" x=\"150\" y=\"76\" style=\"font-size:12.5px\">① 서로 반대로 가는 요구</text>\n<polygon points=\"225,96 300,226 150,226\" fill=\"none\" stroke=\"#2a78d6\" stroke-width=\"2\"/>\n<circle cx=\"225\" cy=\"96\" r=\"5\" fill=\"#2a78d6\"/><circle cx=\"300\" cy=\"226\" r=\"5\" fill=\"#2a78d6\"/><circle cx=\"150\" cy=\"226\" r=\"5\" fill=\"#2a78d6\"/>\n<text class=\"b\" x=\"225\" y=\"88\" text-anchor=\"middle\">얇게</text>\n<text class=\"s\" x=\"225\" y=\"74\" text-anchor=\"middle\">저항을 낮추려면</text>\n<text class=\"b\" x=\"316\" y=\"232\">튼튼하게</text>\n<text class=\"s\" x=\"316\" y=\"248\">깨지지 않으려면</text>\n<text class=\"b\" x=\"134\" y=\"232\" text-anchor=\"end\">구멍 없이</text>\n<text class=\"s\" x=\"134\" y=\"248\" text-anchor=\"end\">가스가 새지 않으려면</text>\n<text class=\"w\" x=\"225\" y=\"178\" text-anchor=\"middle\" style=\"font-size:12px\">동시에 만족</text>\n<text class=\"s\" x=\"225\" y=\"196\" text-anchor=\"middle\">얇게 하면 깨지고</text>\n<text class=\"s\" x=\"225\" y=\"210\" text-anchor=\"middle\">튼튼하게 하면 두꺼워진다</text>\n\n<line x1=\"380\" y1=\"56\" x2=\"380\" y2=\"300\" stroke=\"#e4e7ec\" stroke-width=\"1.5\"/>\n\n<text class=\"b\" x=\"406\" y=\"76\" style=\"font-size:12.5px\">② 구우면 줄어든다 — 수축</text>\n<rect x=\"406\" y=\"88\" width=\"190\" height=\"40\" rx=\"4\" fill=\"#dbeafe\" stroke=\"#2a78d6\" stroke-dasharray=\"4 3\"/>\n<text class=\"s\" x=\"501\" y=\"113\" text-anchor=\"middle\">굽기 전 (크다)</text>\n<text class=\"s\" x=\"604\" y=\"112\">→</text>\n<rect x=\"620\" y=\"94\" width=\"152\" height=\"28\" rx=\"4\" fill=\"#2a78d6\"/>\n<text class=\"sw\" x=\"696\" y=\"113\" text-anchor=\"middle\">구운 뒤 (약 20% 수축)</text>\n<text class=\"s\" x=\"406\" y=\"148\">줄어드는 양이 자리마다 조금만 달라도 판이 휘거나 금이 간다.</text>\n<text class=\"s\" x=\"406\" y=\"166\">게다가 연료극·전해질·공기극은 재료가 달라 줄어드는 정도가 서로 다르다.</text>\n<text class=\"s\" x=\"406\" y=\"184\">그래서 <tspan class=\"b\">조성·입도·바인더 비율·승온 속도</tspan>를 전부 맞춰야 한 장이 평평하게 나온다.</text>\n\n<rect x=\"406\" y=\"198\" width=\"492\" height=\"46\" rx=\"6\" fill=\"#fff7ed\" stroke=\"#fdba74\"/>\n<text class=\"s\" x=\"418\" y=\"217\"><tspan class=\"w\">③ 그리고 열팽창까지 맞아야 한다</tspan></text>\n<text class=\"s\" x=\"418\" y=\"234\">전극·접속재·밀봉재가 뜨거워질 때 늘어나는 비율이 서로 다르면 운전 중에 갈라진다.</text>\n\n<rect x=\"406\" y=\"254\" width=\"492\" height=\"46\" rx=\"6\" fill=\"#f0f9ff\" stroke=\"#bae6fd\"/>\n<text class=\"s\" x=\"418\" y=\"273\"><tspan class=\"b\">결론</tspan> — 레시피가 공개돼도 따라 하기 어렵다. 같은 분말로도 수율이 갈리고,</text>\n<text class=\"s\" x=\"418\" y=\"290\">그 차이는 수천 번 구워 본 경험(공정 노하우)에서 나온다. 그래서 공급사가 소수로 굳는다.</text>\n\n<rect x=\"18\" y=\"266\" width=\"352\" height=\"34\" rx=\"6\" fill=\"#f8fafc\" stroke=\"#e4e7ec\"/>\n<text class=\"s\" x=\"30\" y=\"286\">판이 얇아질수록 ①의 삼각형이 더 빡빡해진다 —</text>\n<text class=\"s\" x=\"30\" y=\"300\">그래서 \"얼마나 얇게 뽑느냐\"가 곧 기술 수준이다.</text>\n</svg>"};

const FCK=[

/* ───────── 조각 만들기 */
function tbl(head,rows,cls){ return `<div class="tw"><table class="${cls||''}"><tr>${head.map(h=>`<th class="l">${h}</th>`).join('')}</tr>`+
  rows.map(r=>'<tr>'+r.map((c,i)=>`<td class="${i===0?'l k':''}">${c}</td>`).join('')+'</tr>').join('')+'</table></div>'; }
function fig(name,cap){ return `<div class="fig">${FIG[name]||''}</div>`+(cap?`<div class="figcap">${cap}</div>`:''); }
function keyn(h,html,warn){ return `<div class="keynote${warn?' warn':''}"><span class="h">${esc(h)}</span>${html}</div>`; }
function key1(h,html){ return `<div class="key1"><span class="h">${esc(h)}</span>${html}</div>`; }
let _dn=0;
function dual(easyHtml,deepHtml){
  const id='d'+(++_dn);
  return `<div class="seg noprint" data-dual="${id}"><button type="button" class="on" data-m="e">쉬운 설명</button><button type="button" data-m="d">자세한 설명</button></div>
    <div class="easy" id="${id}e"><div class="h">쉬운 설명</div>${easyHtml}</div>
    <div class="deepbox" id="${id}d" style="display:none"><div class="h">자세한 설명</div>${deepHtml}</div>`;
}
function bindDual(root){
  (root||document).querySelectorAll('[data-dual]').forEach(seg=>{
    const id=seg.dataset.dual;
    seg.querySelectorAll('button').forEach(b=>{ b.onclick=()=>{
      seg.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
      const e=$(id+'e'), d=$(id+'d'); if(!e||!d) return;
      if(b.dataset.m==='e'){ e.style.display=''; d.style.display='none'; } else { d.style.display=''; e.style.display='none'; }
    };});
  });
}


/* 본문 문단 안의 출처 표기 (보도 s0, s1) → 태그 + 각주 링크 */
function proseH(ch,t){
  const src=ch.src||[];
  return esc(t).replace(/\(([^()]*\bs\d+[^()]*)\)/g,(m,inner)=>{
    const body=inner.replace(/\bs(\d+)\b/g,(_,n)=>{ const i=+n, x=src[i];
      return x?`<a href="${esc(x.u)}" target="_blank" rel="noopener" title="${esc(x.t)}">[${i+1}]</a>`:`[?]`; });
    return `<span class="sx">(${body})</span>`;
  });
}

const REPT={concept:['개념','연료전지·SOFC가 무엇인지부터 설명하는 자료. 오래된 것도 쓸모가 있어 기간을 넓게 잡았다'],

const dDays=d=>{ const t=Date.parse(d+'T00:00:00'); return isNaN(t)?null:Math.floor((Date.now()-t)/864e5); };
function repRow(r){
  const ag=dDays(r.d), fresh=ag!=null&&ag<=183;
  return `<tr><td class="l nw">${esc(r.d||'')}${fresh?' <span class="pill c">6개월</span>':''}</td>
    <td class="l nw">${esc(r.b||'')}${(r.an||[]).length?`<div class="mini">${esc((r.an||[]).join(', '))}</div>`:''}</td>
    <td class="l">${r.u?`<a href="${esc(r.u)}" target="_blank" rel="noopener">${esc(r.t||'')}</a>`:esc(r.t||'')}
      ${r.sum?` <a class="sumlink" href="/repsum.html#r=${esc(r.sum)}">🔍 정밀요약</a>`:''}
      ${r.why?`<div class="mini">${esc(r.why)}</div>`:(r.note?`<div class="mini" style="color:#98a2b3">${esc(r.note)}</div>`:'')}</td>
    ${r.code?`<td class="l nw">${TREE.co[r.code]?coLink(r.code):esc(r.code)}</td>`:'<td></td>'}</tr>`;
}
function repSection(tier,rows,opts){
  opts=opts||{};
  if(!rows||!rows.length) return opts.hideEmpty?'':`<div class="mini" style="margin-bottom:10px">${esc(REPT[tier][0])} 리포트는 아직 모으지 못했다.</div>`;
  rows=rows.slice().sort((a,b)=>String(b.d||'').localeCompare(String(a.d||'')));
  const n6=rows.filter(r=>{const a=dDays(r.d); return a!=null&&a<=183;}).length;
  return `<h3 style="margin:14px 0 4px">${esc(REPT[tier][0])} <small>${rows.length}건 · 최근 6개월 ${n6}건</small></h3>
    <div class="mini" style="margin-bottom:5px">${esc(REPT[tier][1])}</div>
    <div class="tw" style="margin-bottom:8px"><table><tr><th class="l">발행일</th><th class="l">증권사</th><th class="l">제목</th><th class="l">${tier==='company'?'종목':''}</th></tr>
    ${rows.map(repRow).join('')}</table></div>`;
}
function repBlock(){
  if(!REP||!(REP.concept||REP.industry||REP.company)) return '';
  const n=(REP.concept||[]).length+(REP.industry||[]).length+(REP.company||[]).length;
  if(!n) return '';
  return `<h2>증권사 리포트 <small>${n}건 · 수집 ${esc(REP.updated||'')}</small></h2>`+
    repSection('concept',REP.concept)+repSection('industry',REP.industry)+repSection('company',REP.company)+
    `<div class="mini" style="margin-bottom:14px">제목·증권사·발행일·링크만 모은 것이고 본문 내용은 요약하지 않았다. 링크를 눌러 원문에서 확인한다. 리포트의 목표주가·전망치는 <b>증권사 추정</b>이지 확정된 숫자가 아니다.</div>`;
}
function repOf(code){
  const out=[];
  for(const t of ['company','industry','concept'])
    for(const r of (REP&&REP[t])||[]) if(r.code===code) out.push(Object.assign({},r,{tier:t}));
  return out.sort((a,b)=>String(b.d||'').localeCompare(String(a.d||'')));
}

/* ───────── 왼쪽 목차 */
function renderSide(cur){
  const h=['<h2><a href="#" style="color:#1a2a4a">⚡ 연료전지·수소 교과서</a></h2><input id="q" placeholder="기업명·종목코드 찾기" autocomplete="off"><div id="sr"></div>',
    `<details class="toc" ${innerWidth>900||!(cur.gid||cur.code||cur.top)?'open':''}><summary>목차 (대분류 → 중분류 → 세분류)</summary>`];
  for(const T of TREE.top){
    const n=new Set(T.mid.flatMap(M=>M.g.flatMap(g=>g.co))).size;
    const open=cur.top===T.id||(cur.gid&&(pathOf(cur.gid)||[])[0]&&pathOf(cur.gid)[0].id===T.id);
    h.push(`<details ${open?'open':''}><summary><a href="#t=${T.id}" style="color:inherit">${esc(T.name)}</a> <small style="color:#98a2b3;font-weight:400">${n}</small></summary>`);
    for(const M of T.mid){
      h.push(`<div class="mid">${esc(M.name)}</div>`);
      for(const g of M.g){
        const on=cur.gid===g.id, wr=G2C[g.id]?' ✍':'';
        h.push(`<a class="g ${on?'on':''}" href="#g=${g.id}">${esc(g.name)}<small> · ${g.co.length}${wr}</small></a>`);
        if(on) for(const c of g.co.slice().sort(byCap)) h.push(`<a class="c ${cur.code===c?'on':''}" href="#c=${c}">${esc(coN(c))}</a>`);
      }
    }
    h.push('</details>');
  }
  const free=Object.values(CHD.ch||{}).filter(c=>!(c.groups||[]).length);
  if(free.length){ h.push(`<details ${cur.cid?'open':''}><summary>기술 장 <small style="color:#98a2b3;font-weight:400">${free.length}</small></summary>`);
    for(const c of free) h.push(`<a class="g ${cur.cid===c.id?'on':''}" href="#ch=${c.id}">${esc(c.title)}<small> · ${(c.companies||[]).length} ✍</small></a>`);
    h.push('</details>'); }
  h.push('</details><div class="mini" style="margin-top:8px;padding:0 4px">✍ 표시는 글로 쓴 분야입니다. 나머지는 숫자와 분류만 나옵니다.</div>');
  $('side').innerHTML=h.join('');
  const q=$('q'); q.addEventListener('input',()=>{
    const v=q.value.trim().toLowerCase(); const sr=$('sr'); if(!v){ sr.innerHTML=''; sr.className=''; return; }
    const hit=Object.keys(TREE.co).filter(c=>c.includes(v)||coN(c).toLowerCase().includes(v)).sort(byCap).slice(0,30);
    sr.className=hit.length?'sr':'';
    sr.innerHTML=hit.map(c=>`<a href="#c=${c}">${esc(coN(c))} <small>${c}</small></a>`).join('')||'';
  });
}

/* ───────── 메타 줄 (작성일 규칙) */
function metaLine(written){
  const bits=[];
  if(written) bits.push(`<b>작성일</b> ${esc(written)}`);
  bits.push(`<b>분류</b> ${esc(TREE.updated||'—')}`);
  if(priceDay()) bits.push(`<b>주가·PER 기준일</b> ${priceDay()}`);
  if(BB&&BB.asof) bits.push(`<b>실적</b> ${esc(BB.asof)} 기준 (수집 ${esc(String(BB.updated||'').slice(0,10))})`);
  return `<div class="meta">${bits.join(' · ')}</div>`;
}

     <div class="kpi"><div class="k">글로 쓴 분야</div><div class="v">${nW}</div><div class="n">기업 ${nWC}곳 특장점·리스크</div></div>
   </div>`,
   `<div class="nb"><b>읽는 순서</b> — ① 아래 기본 지식(2차전지와의 구분 → 연료전지 종류 → SOFC 단전지 구조 → 지지체 방식)을 먼저 보고 ② 밸류체인에서 관심 단계를 고른 뒤 ③ 세분류로 들어가 분야 설명을 읽고 ④ 기업으로 들어가 숫자·리스크·리포트를 본다. 분야 설명은 <b>쉬운 설명 / 자세한 설명</b>을 버튼으로 바꿔 볼 수 있다.<br>
     <b>이 교과서는 SOFC에 무게를 뒀다.</b> PEMFC·PAFC와 수소 공급 쪽은 비교와 분류까지 다루고, 부품 단위 조사는 SOFC가 더 깊다.</div>`,

   `<h2>1. 연료전지는 2차전지가 아니다</h2>`,
   key1('가장 명확한 구별법은 단위다','2차전지는 "몇 <b>kWh</b>를 담느냐"가 스펙이고, 연료전지는 "몇 <b>kW</b>를 뽑느냐"만 있다. <b>담는 양이 스펙에 없으면 저장장치가 아니다.</b>'),
   `<div class="card" style="padding:0;overflow:hidden;margin-bottom:12px">${tbl(['구분','2차전지','연료전지 (SOFC·PEMFC·PAFC)'],KIND,'cmp')}</div>`,
   fig('cell','<b>SOFC 단전지의 작동 원리와 2차전지와의 차이.</b> 산소이온이 세라믹을 건너가고, 그때 떨어진 전자가 바깥 회로를 도는 것이 전기다.'),
   keyn('전고체 배터리와도 다르다','<b>전고체는 고체전해질로 저장을 하고, SOFC는 고체전해질로 발전을 한다.</b> 소재가 세라믹이라는 점만 닮았을 뿐 하는 일이 반대다.<br>다만 SOFC를 거꾸로 돌리는 SOEC·rSOC(고체산화물 수전해)는 전기로 수소를 만들어 저장했다가 다시 발전할 수 있어 "충방전처럼" 보인다 — 이때 저장되는 곳은 전지 내부가 아니라 <b>외부 수소 탱크</b>다.',true),

   `<h2>2. 연료전지의 종류 — 온도가 모든 것을 결정한다</h2>`,
   `<div class="card" style="padding:0;overflow:hidden;margin-bottom:12px">${tbl(['종류','작동 온도','전해질','백금 촉매','연료','기동 속도','주 용도','국내 기업'],FCK,'cmp')}</div>`,
   keyn('고온일수록 무엇이 좋아지는가','① <b>백금이 필요 없어</b> 원가가 내려간다<br>② <b>연료를 내부에서 개질</b>해 천연가스·암모니아까지 쓸 수 있다<br>③ <b>발전효율이 높다</b><br>대신 기동·정지가 느려 수시로 껐다 켜는 용도에는 못 쓰고, 열사이클 내구성이 숙제가 된다. <span class="tag t판단">판단</span> 근거: 저온형 PEMFC가 백금 촉매와 순수소를 요구하는 반면 SOFC·PAFC는 천연가스를 그대로 받는다는 점.'),

   `<h2>3. 백금은 왜 필요한가 — 무슨 역할을 하는가</h2>`,
   dual(
    `<p>화학 반응에는 <b>넘어야 하는 언덕</b>이 있다. 수소와 산소를 한 통에 넣어도 가만히 두면 아무 일도 일어나지 않는 이유가 그것이다. 불을 붙이거나, 뜨겁게 만들거나, 누가 도와주어야 반응이 시작된다.</p>
     <p>촉매가 하는 일이 그 <b>언덕을 낮춰주는 것</b>이다. 백금은 수소 분자를 붙잡아 둘로 쪼개주고, 산소도 쪼개준다. 자기는 닳지 않으면서 길만 터주는 역할이다.</p>
     <p>그런데 <b>열도 똑같은 일을 한다.</b> 뜨거우면 분자들이 이미 빠르게 움직이고 있어서 언덕을 스스로 넘는다. 그래서 SOFC처럼 700도가 넘는 곳에서는 백금이 필요 없고, 값싼 니켈로 충분하다.</p>
     <p>이 차이가 돈으로 이어진다. 백금은 비싸고 양이 적어 원가를 누른다. 게다가 백금은 예민해서 연료에 황이나 일산화탄소가 조금만 섞여도 망가진다 — 그래서 PEMFC는 <b>깨끗한 수소만</b> 먹을 수 있다. 수소를 따로 만들어 날라야 하니 인프라 부담까지 따라온다.</p>`,
    `<p>연료전지 반응은 전극 표면에서 일어나는 전기화학 반응이고, 반응 속도는 활성화 에너지에 지배된다. 촉매는 반응물을 흡착해 중간 상태를 안정화시켜 활성화 에너지를 낮춘다. 백금은 수소 산화와 산소 환원 양쪽에서 이 일을 잘하기 때문에 저온형 연료전지의 표준 촉매가 됐다.</p>
     <p>특히 느린 쪽은 <b>산소 환원 반응(ORR)</b>이다. 수소 산화는 비교적 쉽게 일어나지만 산소 환원은 네 개의 전자가 관여해 훨씬 느리고, 그래서 공기극 쪽에 백금이 더 많이 들어간다. 저온에서 출력을 내려면 백금 담지량을 늘려야 하고 이것이 원가로 직결된다.</p>
     <p>온도를 올리면 사정이 달라진다. 열에너지가 활성화 에너지의 상당 부분을 대신 공급하므로 귀금속 없이도 반응 속도가 확보된다. SOFC의 연료극이 니켈 서멧인 것, 공기극이 LSM·LSCF 같은 페로브스카이트 산화물인 것이 그 결과다. 미국 에너지부도 PEMFC와 PAFC의 과제로는 "비싼 촉매"를 명시하지만 SOFC의 과제 목록에는 촉매 비용을 넣지 않는다.</p>
     <p>백금의 두 번째 약점은 <b>피독</b>이다. 일산화탄소가 백금 표면에 강하게 흡착해 반응 자리를 막고, 황 화합물도 마찬가지다. 그래서 개질가스를 그대로 쓰지 못하고 정제가 필요하다. 반대로 SOFC의 니켈 전극은 황에는 민감하지만(그래서 탈황은 여전히 필요하다) 일산화탄소는 오히려 연료로 쓸 수 있다.</p>
     <p>정리하면 <b>백금 의존은 저온형 연료전지의 구조적 약점</b>이고, 이것이 SOFC가 원가와 연료 유연성에서 갖는 이점의 뿌리다. 투자 관점에서는 "백금이 필요한가"가 그 방식이 어떤 인프라에 묶이는지를 결정하는 갈림길이 된다.</p>`),
   fig('pt','<b>왼쪽은 저온(PEMFC) — 열이 모자라 백금으로 언덕을 낮춘다. 가운데는 고온(SOFC) — 열이 그 일을 대신한다.</b> 오른쪽이 그래서 생기는 사업 구조의 차이다.'),

   `<h2>4. 연료별 차이 — 무엇을 넣느냐가 무엇을 달고 다니느냐를 정한다</h2>`,
   `<div class="card" style="padding:0;overflow:hidden;margin-bottom:12px">${tbl(['연료','스택 앞에 필요한 것','장점','단점','주로 쓰는 곳'],FUEL,'cmp')}</div>`,
   dual(
    `<p>연료전지는 연료를 넣어야 돌아간다. 그런데 <b>어떤 연료를 넣느냐에 따라 스택 앞에 달아야 하는 장비가 달라진다.</b></p>
     <p>가장 깨끗한 건 수소다. 바로 넣으면 되고 나오는 것도 물뿐이다. 문제는 수소를 어디서 구하느냐다. 따로 만들어서 700기압으로 눌러 담거나 영하 253도로 식혀 날라야 한다. 충전소도 따로 지어야 한다.</p>
     <p>천연가스는 반대다. 이미 전국에 배관이 깔려 있어서 <b>지금 당장</b> 쓸 수 있다. 대신 두 가지를 달아야 한다 — 가스에 일부러 넣어둔 냄새 성분(황)을 걸러내는 탈황기, 그리고 가스를 수소가 많은 가스로 바꾸는 개질기다. 그리고 탄소를 쓰니 CO₂가 나온다.</p>
     <p>암모니아는 중간이다. 액체로 만들기 쉬워 배로 멀리 나르기 좋은데, 쓰려면 질소를 떼어내는 분해 장치가 필요하고 독성이 있다. 주로 선박이나 큰 발전소 이야기에서 나온다.</p>`,
    `<p>연료 선택은 ① 전처리 설비 ② 묶이는 인프라 ③ 탄소 배출 세 가지를 동시에 결정한다. SOFC가 발전용에서 먼저 자리를 잡은 이유가 여기 있다 — 도시가스 배관이라는 <b>이미 완성된 인프라</b>를 그대로 쓸 수 있기 때문이다.</p>
     <p>천연가스를 쓸 때 탈황이 먼저인 이유는 촉매 보호다. 도시가스에는 누출을 감지하라고 황 화합물 부취제를 일부러 넣는데, 이 황이 니켈 연료극과 개질 촉매를 피독시킨다. 개질은 수증기 개질(SMR)이 일반적이고, SOFC는 고온이라 스택 내부에서 개질이 일어나게 설계할 수도 있다. 내부 개질은 흡열 반응이어서 스택이 내는 열을 가져가 냉각 부담까지 줄여주는 이점이 있다.</p>
     <p>탄소 배출은 연료가 정한다. 증권사 리포트는 천연가스 기반 SOFC의 탄소 배출을 약 330gCO₂/kWh 수준으로, 수소 연료 시 0으로 제시한다. 즉 같은 설비라도 연료를 바꾸면 탄소 성적이 바뀐다 — 이것이 "지금은 가스로 돌리고 나중에 수소로 전환한다"는 사업 논리의 근거다.</p>
     <p>암모니아는 수소 캐리어로 다뤄진다. 액화 조건이 수소보다 훨씬 온화해(상온 가까이에서 가압 액화) 장거리 해상 운송에 유리하고, 분해하면 수소가 나온다. SOFC는 고온이라 암모니아를 직접 받아 내부에서 분해할 수 있다는 점이 PEMFC와 다르다.</p>
     <p><b>투자 관점에서 중요한 구분</b>: PAFC는 천연가스 개질 비중이 매우 높다(두산퓨얼셀 기준 약 90%라는 보도가 있다). 따라서 PAFC 수주가 늘어도 수소 저장·충전 업체가 수혜를 보는 것이 아니다. <b>PEMFC만 수소 인프라와 한 몸</b>이고, PAFC·SOFC는 도시가스 인프라와 한 몸이다. 같은 "연료전지"로 묶어 읽으면 틀린다.</p>`),
   fig('fuel','<b>연료가 바뀌면 스택 앞에 붙는 설비가 바뀐다.</b> 천연가스는 탈황·개질이, 암모니아는 분해 장치가 추가로 필요하다.'),

   `<h2>5. SOFC 단전지는 무엇으로 이루어지는가</h2>`,
   `<div class="card" style="padding:0;overflow:hidden;margin-bottom:12px">${tbl(['층','하는 일','쓰는 소재','누가 잘하는가'],LAYER,'cmp')}</div>`,
   key1('투자 관점에서 가장 중요한 줄은 전해질 시트다','분말은 여러 곳이 만들지만, 그것을 <b>얇고 평평한 세라믹 판으로 구워내는 공정</b>이 진입장벽이다. 전해질 지지형(ESC) 셀에서는 이 시트가 <b>셀의 구조 지지체까지 겸하기</b> 때문에 셀 생산량에 1:1로 비례해 들어간다. <span class="tag t판단">판단</span>'),

   `<h2>6. 전해질은 종류마다 무엇이 다른가</h2>`,
   `<div class="card" style="padding:0;overflow:hidden;margin-bottom:12px">${tbl(['소재','쓸 수 있는 온도','이온 전도','장점','단점','주로 쓰는 곳'],ELECT,'cmp')}</div>`,
   dual(
    `<p>전해질이 하는 일은 하나다 — <b>산소만 통과시키고 나머지는 전부 막는 것.</b> 그런데 산소가 세라믹을 통과하려면 뜨거워야 한다. 차가우면 꽉 막혀서 전기가 안 나온다.</p>
     <p>그래서 소재를 고르는 기준은 "<b>얼마나 낮은 온도에서도 산소를 잘 통과시키느냐</b>"가 된다. 낮은 온도에서 쓸 수 있으면 주변 부품을 비싼 세라믹 대신 값싼 스테인리스로 바꿀 수 있고, 켜는 시간도 짧아지기 때문이다.</p>
     <p>YSZ는 가장 흔한 표준이다. 싸고 안정적인데 온도가 내려가면 막혀버린다. ScSZ는 거기에 스칸디움을 넣어 더 잘 통하게 만든 것인데, 스칸디움이 워낙 귀하고 비싸다. GDC는 낮은 온도에서 가장 잘 통하지만 뜨거워지면 전기가 새어버린다.</p>
     <p>그래서 어느 하나가 정답이 아니라, <b>어느 온도에서 돌릴 것인가를 먼저 정하고 거기에 맞는 소재를 고르는</b> 식이다. 이 선택이 곧 회사의 기술 노선이 된다.</p>`,
    `<p>SOFC 전해질은 산소 공공(oxygen vacancy)을 통해 O²⁻가 이동하는 이온 전도체다. 지르코니아(ZrO₂)는 그대로 두면 상전이 때문에 쓸 수 없어서, 이트리아(Y₂O₃)나 스칸디아(Sc₂O₃)를 넣어 입방정 형석 구조를 안정화시킨다. 이때 도펀트가 산소 공공을 만들어 이온 전도가 생긴다. "안정화 지르코니아"라는 이름이 여기서 나온다.</p>
     <p><b>YSZ</b>는 8mol% 이트리아가 표준 조성이다. 화학적으로 안정하고 값이 싸며 전극과의 상용성이 검증돼 고온형(750℃ 이상)의 기본값이 됐다. 단점은 이온 전도도가 온도에 지수적으로 의존해, 온도를 내리면 저항이 빠르게 커진다는 점이다. 그래서 저온화하려면 전해질을 극단적으로 얇게 가져가야 하고, 이것이 ASC(연료극 지지형) 구조가 나온 이유다.</p>
     <p><b>ScSZ</b>는 스칸디아를 쓴 것으로, 같은 온도·두께에서 YSZ보다 이온 전도도가 높다. Bloom Energy가 소량의 산화스칸디움을 도핑한 지르코니아 계열을 쓴다고 설명하며 관련 특허를 보유한다. 약점은 둘이다 — 스칸디움이 생산량이 적고 비싸 공급망 논란의 소재가 되며, 입방정 ScSZ는 약 580℃ 미만에서 상전이가 일어나 저온화의 물리적 한계로 지적된다.</p>
     <p><b>GDC/CGO</b>는 세리아계로 저온 영역에서 전도도가 가장 좋다. 문제는 환원 분위기의 고온에서 Ce⁴⁺가 Ce³⁺로 환원되면서 <b>전자 전도성이 생긴다</b>는 점이다. 전해질에 전자가 흐르면 내부 단락과 같아 개회로 전압과 효율이 떨어진다. 그래서 GDC는 저온형 단독 전해질로 쓰거나, 지르코니아 전해질과 LSCF 공기극 사이의 <b>반응 방지 배리어층</b>으로 얇게 넣는 용도가 많다.</p>
     <p><b>LSGM</b>(란타넘 갈레이트)은 중온에서 이론 성능이 우수하지만 니켈 연료극과 반응하는 등 상용성 문제가 있고, 연구용 분말 판매 외에 상용 스택 채택 사례를 확인하지 못했다.</p>
     <p>정리하면 전해질 선택은 <b>작동 온도 → 접속재·밀봉재 소재 → 시스템 원가</b>로 이어지는 연쇄의 첫 단추다. 중저온화가 산업의 방향인 이유도 여기 있다. 온도가 600~800℃로 내려오면 세라믹 접속재 대신 코팅된 페라이트계 스테인리스를 쓸 수 있어 소재 원가가 크게 떨어진다.</p>`),

/* ───────── peer 표·차트 (같은 분야 비교) */
function peerTable(codes,me){
  const rows=codes.map(c=>{ const v=sv(c); const f=((BB.co[c]||{}).fin)||{};
    const r4=(f.rq||[]).slice(-4), o4=(f.oq||[]).slice(-4);
    const ttmR=r4.every(x=>x!=null)&&r4.length===4?r4.reduce((a,b)=>a+b,0):null;
    const ttmO=o4.every(x=>x!=null)&&o4.length===4?o4.reduce((a,b)=>a+b,0):null;
    const opm=(ttmR&&ttmO!=null&&ttmR>0)?ttmO/ttmR*100:null;
    return {c,v,ttmR,opm};
  });

function evCluster(ev){ const by={}; for(const e of ev||[]){ (by[e.c+'|'+e.k]=by[e.c+'|'+e.k]||[]).push(e); }

    for(const e of g) for(const f of ['amt','who','why','how','pct','prc']) if(base[f]==null&&e[f]!=null) base[f]=e[f];
    base.d=last.d; base.d0=g[g.length-1].d; base.n=g.length; out.push(base); }
  return out.sort((a,b)=>(b.d||'').localeCompare(a.d||'')); }

      h.push(`<div class="card co"><h3><a href="#c=${c.code}">${esc(c.name)}</a> <small>${c.code} · ${eok(sv(c.code).cap)}</small></h3>
        <div class="pos">${esc(c.pos||'')}</div>
        ${c.alert?`<div class="warnfc"><b>주의</b> — ${esc(c.alert)}</div>`:''}`);
      if((c.products||[]).length) h.push(`<div class="tw" style="margin-bottom:8px"><table><tr><th class="l">주요 제품</th><th class="l">어디에 어떻게 쓰이는가</th><th class="l">비중·규모</th></tr>
        ${c.products.map(p=>`<tr><td class="l nw">${p.photo?`<a href="${esc(p.photo)}" target="_blank" rel="noopener">${esc(p.n)}</a>`:esc(p.n)}</td><td class="l">${esc(p.use||'')}</td><td class="l mini">${esc(p.share||'—')}</td></tr>`).join('')}</table></div>`);
      if((c.customers||[]).length) h.push(`<div class="mini" style="margin-bottom:8px"><b>고객사</b> — ${c.customers.map(x=>claim(ch,x)).join(' / ')}</div>`);
      h.push(`<div class="sr2">
        <div class="strongbox"><h3>특장점</h3><ul class="sg">${(c.strong||[]).map(x=>`<li>${claim(ch,x)}</li>`).join('')||'<li class="mini">조사 중</li>'}</ul></div>
        <div class="riskbox"><h3>리스크 요인</h3><ul class="rk">${(c.risk||[]).map(x=>`<li>${claim(ch,x)}</li>`).join('')||'<li class="mini">조사 중</li>'}</ul></div>
      </div></div>`);
    }
  }
  if((ch.watch||[]).length) h.push(`<h2>앞으로 볼 지표</h2><div class="card"><ul class="pl dot">${ch.watch.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`);
  if((ch.unknown||[]).length) h.push(`<h2>확인하지 못한 것</h2><div class="note"><ul class="pl dot" style="margin:0">${ch.unknown.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`);
  if((ch.src||[]).length) h.push(`<h2>출처</h2><div class="card mini"><ol style="margin-left:18px">${ch.src.map(s=>`<li><a href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.t)}</a></li>`).join('')}</ol></div>`);
  $('main').innerHTML=h.join('');
  const be=$('bEasy'), bd=$('bDeep');
  if(be) be.onclick=()=>{ be.classList.add('on'); bd.classList.remove('on'); $('vEasy').style.display=''; $('vDeep').style.display='none'; };
  if(bd) bd.onclick=()=>{ bd.classList.add('on'); be.classList.remove('on'); $('vDeep').style.display=''; $('vEasy').style.display='none'; };
  peerCharts('gp',codes.slice(0,14),null);
}

/* ───────── 기업 */
function renderCompany(code){
  killCharts();
  if(!TREE.co[code]){ $('main').innerHTML='<div class="card">이 교과서에 없는 종목입니다. <a href="#">처음으로</a></div>'; return; }
  const gs=groupsOf(code), r=chCo(code), ch=r&&r.ch, c=r&&r.co, v=sv(code), prd=PRD[code]||{};
  const fb=finBlocks(code), eb=evBlocks(code);
  const h=[`<div class="crumb"><a href="#">연료전지·수소 교과서</a>${gs.length?` › <a href="#t=${gs[0][0].id}">${esc(gs[0][0].name)}</a> › <a href="#g=${gs[0][2].id}">${esc(gs[0][2].name)}</a>`:''}</div>`,
    `<h1>${esc(coN(code))} <small>${code} · ${esc(prd.m==='K'?'KOSPI':prd.m==='Q'?'KOSDAQ':prd.m||'')}</small></h1>`,
    `<div class="lead">${esc(prd.p||'')}</div>`,
    metaLine(ch?ch.written:null)];
  if(gs.length>1) h.push(`<div class="mini" style="margin:-6px 0 10px">이 회사는 세분류 ${gs.length}곳에 들어간다: ${gs.map(([T,M,g])=>`<a href="#g=${g.id}">${esc(g.name)}</a>`).join(' · ')}</div>`);
  h.push(`<div class="kpis">
    <div class="kpi"><div class="k">시가총액</div><div class="v">${eok(v.cap)}</div><div class="n">주가 ${f0(v.px)}원 · ${priceDay()||'—'}</div></div>
    <div class="kpi"><div class="k">PER</div><div class="v">${v.per==null?'—':f1(v.per)}</div><div class="n">${v.per==null?'적자이거나 값 없음':'배'}</div></div>
    <div class="kpi"><div class="k">PBR</div><div class="v">${v.pbr==null?'—':f1(v.pbr)}</div><div class="n">배</div></div>
    <div class="kpi"><div class="k">ROE</div><div class="v">${v.roe==null?'—':f1(v.roe)+'%'}</div><div class="n">EPS ÷ BPS</div></div>
  </div>`);
  if(c){
    const chHref=(ch.groups||[]).length?`#g=${ch.groups[0]}`:`#ch=${ch.id}`;
    h.push(`<div class="nb"><b>이 분야에서의 자리</b> — ${esc(c.pos||'')} <span class="mini">· <a href="${chHref}">${esc(ch.title)}</a> 장에서 가져옴</span></div>`);
    if(c.alert) h.push(`<div class="warnfc"><b>주의</b> — ${esc(c.alert)}</div>`);
    const other=Object.values(CHD.ch||{}).filter(x=>x.id!==ch.id&&(x.companies||[]).some(y=>y.code===code));
    if(other.length) h.push(`<div class="mini" style="margin:-6px 0 10px">이 회사는 다른 장에도 나온다: ${other.map(x=>`<a href="${(x.groups||[]).length?`#g=${x.groups[0]}`:`#ch=${x.id}`}">${esc(x.title)}</a>`).join(' · ')}</div>`);
    if((c.products||[]).length) h.push(`<h2>주요 제품 — 어디에 어떻게 쓰이는가</h2><div class="tw" style="margin-bottom:12px"><table><tr><th class="l">제품</th><th class="l">쓰이는 곳과 방식</th><th class="l">비중·규모</th></tr>
      ${c.products.map(p=>`<tr><td class="l nw">${p.photo?`<a href="${esc(p.photo)}" target="_blank" rel="noopener">${esc(p.n)}</a>`:esc(p.n)}</td><td class="l">${esc(p.use||'')}</td><td class="l mini">${esc(p.share||'—')}</td></tr>`).join('')}</table></div>
      <div class="mini" style="margin:-8px 0 12px">제품명을 누르면 회사 공식 제품 페이지로 간다. 제품 사진은 이 사이트에 옮겨 싣지 않는다.</div>`);
    if((c.customers||[]).length) h.push(`<h2>고객사</h2><div class="card"><ul class="pl dot">${c.customers.map(x=>`<li>${claim(ch,x)}</li>`).join('')}</ul></div>`);
    h.push(`<h2>특장점과 리스크 요인</h2><div class="sr2">
      <div class="strongbox"><h3>특장점 <small>경쟁사 대비 더 잘하는 것</small></h3><ul class="sg">${(c.strong||[]).map(x=>`<li>${claim(ch,x)}</li>`).join('')||'<li class="mini">조사 중</li>'}</ul></div>
      <div class="riskbox"><h3>리스크 요인 <small>실적·주가를 망칠 수 있는 것</small></h3><ul class="rk">${(c.risk||[]).map(x=>`<li>${claim(ch,x)}</li>`).join('')||'<li class="mini">조사 중</li>'}</ul></div></div>`);
    if((ch.compare_axes||[]).length&&c.axes) h.push(`<div class="tw" style="margin-bottom:12px"><table>${ch.compare_axes.map(a=>`<tr><th class="l" style="width:28%">${esc(a)}</th><td class="l">${esc(c.axes[a]||'—')}</td></tr>`).join('')}</table></div>`);
  } else {
    h.push(`<div class="note">이 기업은 아직 <b>글로 쓴 조사가 없다.</b> 아래 숫자(5년 실적·공시 이력·같은 분야 비교)는 자동 수집된 것이고, 특장점·리스크는 분야를 지정해 요청하면 조사해 넣는다.</div>`);
  }
  const rp=repOf(code);
  if(rp.length) h.push(`<h2>이 종목 리포트 <small>${rp.length}건</small></h2>`+
    `<div class="tw" style="margin-bottom:6px"><table><tr><th class="l">발행일</th><th class="l">증권사</th><th class="l">제목</th><th class="l">분류</th></tr>`+
    rp.map(r=>{const ag=dDays(r.d),fresh=ag!=null&&ag<=183;
      return `<tr><td class="l nw">${esc(r.d||'')}${fresh?' <span class="pill c">6개월</span>':''}</td>
        <td class="l nw">${esc(r.b||'')}${(r.an||[]).length?`<div class="mini">${esc(r.an.join(', '))}</div>`:''}</td>
        <td class="l">${r.u?`<a href="${esc(r.u)}" target="_blank" rel="noopener">${esc(r.t||'')}</a>`:esc(r.t||'')}${r.why?`<div class="mini">${esc(r.why)}</div>`:''}</td>
        <td class="l nw mini">${esc((REPT[r.tier]||[''])[0])}</td></tr>`;}).join('')+
    `</table></div><div class="mini" style="margin-bottom:12px">리포트의 목표주가·전망치는 증권사 추정이다. 링크를 눌러 원문에서 확인한다.</div>`);
  h.push(`<h2>5개년 실적 <small>분기·연간 · DART 공시값</small></h2>`+fb.html);
  h.push(`<h2>자금조달 · 인수매각 · 지배구조 이력 <small>최근 5년</small></h2>`+eb.html);
  const peers=gs.length?[...new Set(gs.flatMap(([T,M,g])=>g.co))].sort(byCap):[];
  if(peers.length>1){
    h.push(`<h2>같은 세분류 기업과 비교 <small>${gs.map(([T,M,g])=>esc(g.name)).join(' · ')}</small></h2>`+peerTable(peers,code)+peerChartsHtml('cp'));
  }
  h.push(`<div class="btns noprint"><a href="https://dart.fss.or.kr/dsab007/main.do" target="_blank" rel="noopener">DART에서 이 회사 공시 보기</a>
    <a href="/deep.html#c=${code}">종목 딥다이브</a><a href="/bands.html#c=${code}">밴드·V차트</a><button type="button" onclick="window.print()">인쇄 / PDF</button></div>`);
  $('main').innerHTML=h.join('');
  fb.draw(); eb.draw();
  if(peers.length>1) peerCharts('cp',peers.slice(0,14),code);
}

/* ───────── 라우팅 */
function route(){
  const hs=location.hash||''; let m;
  const cur={};
  if((m=hs.match(/^#ch=([\w-]+)/))) cur.cid=m[1];
  else if((m=hs.match(/^#g=([\w-]+)/))) cur.gid=m[1];
  else if((m=hs.match(/^#c=([0-9A-Z]{6})/))) cur.code=m[1];
  else if((m=hs.match(/^#t=([\w-]+)/))) cur.top=m[1];
  if(cur.gid){ const p=pathOf(cur.gid); if(p) cur.top=p[0].id; }
  if(cur.code){ const g=groupsOf(cur.code); if(g.length){ cur.gid=g[0][2].id; cur.top=g[0][0].id; } }
  renderSide(cur);
  if(hs.startsWith('#ch=')) renderChapter(hs.slice(4).split('&')[0]);
  else if(hs.startsWith('#c=')&&cur.code) renderCompany(cur.code);
  else if(hs.startsWith('#g=')) renderGroup(hs.slice(3).split('&')[0]);
  else if(hs.startsWith('#t=')) renderTop(hs.slice(3).split('&')[0]);
  else renderHome();
  if(!hs) window.scrollTo(0,0);
}

(async function boot(){
  const [tree,chd,bb,rep,svj,prd]=await Promise.all([
    j('/data/fcbook_tree.json'), j('/data/fcbook_ch.json'), j('/data/fcbook.json'),
    j('/data/fcbook_rep.json'), j('/data/stockvals.json'), j('/data/products.json')]);
  if(!tree){ $('main').innerHTML='<div class="card">분류 파일(fcbook_tree.json)을 불러오지 못했습니다.</div>'; return; }
  TREE=tree; CHD=chd||{ch:{}}; BB=bb||{co:{},ql:[],ay:[]}; REP=rep||{};
  if(!BB.co) BB.co={};
  SV=(svj&&svj.map)||{}; SV._at=(svj&&svj.updated)||''; PRD=(prd&&prd.map)||{};
  for(const id in (CHD.ch||{})){ const ch=CHD.ch[id];
    for(const g of (ch.groups||[])) G2C[g]=id;
    (ch.companies||[]).forEach((c,i)=>{ if(!CO2CH[c.code]) CO2CH[c.code]=[id,i]; }); }
  addEventListener('hashchange',route); route();
})();
</script>
