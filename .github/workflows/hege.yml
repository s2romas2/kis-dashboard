name: 헤게모니 4국면 분류 (주 1회)
on:
  schedule:
    - cron: '0 22 * * 5'   # 토 07:00 KST
    # DART는 평일 낮에 다중회사 조회가 매우 느려짐(11/17 낮 실행: 호출당 50초 → 120분 안에 못 끝냄). GitHub 예약 실행도 몇 시간씩 밀리므로
    # 마감 직후 실행은 한국 시간 자정(15:00 UTC)에 걸어 밀려도 새벽에 끝나게 한다
    - cron: '0 15 14-18 5,8,11 *'       # 분기·반기보고서 마감(5/15·8/14·11/14) 뒤 15~19일 00:00 KST — 주도주·워크시트·PBR–ROE가 새 분기를 바로 쓰도록
    - cron: '0 15 31 3 *'               # 사업보고서 마감(3/31) 뒤 4/1 00:00 KST
    - cron: '0 15 2 4 *'                # 4/3 00:00 KST
  workflow_dispatch: {}
  push:
    paths: ['hege.py']
permissions:
  contents: write
concurrency:
  group: hege-cache
  cancel-in-progress: false
jobs:
  hege:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 수집·분류
        env:
          DART_API_KEY: ${{ secrets.DART_KEY }}
        run: python hege.py
      - name: 전 상장사 PBR–ROE 계산(외부 호출 없음)
        if: always()
        run: python pbrroe.py || true
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/hege.json public/data/finall.json public/data/pbrroe.json 2>/dev/null || true
          git commit -m "헤게모니 4국면 갱신" || echo "변경 없음"
          git pull --rebase origin main || true
          git push || true
