<script>

const f0=v=>v==null||isNaN(v)?'—':Math.round(v).toLocaleString(), f1=v=>v==null||isNaN(v)?'—':Number(v).toFixed(1);
const eok=v=>v==null||isNaN(v)?'—':Math.abs(v)>=10000?(v/10000).toFixed(Math.abs(v)>=100000?0:1).replace(/\B(?=(\d{3})+(?!\d))/g,',')+'조':Math.round(v).toLocaleString()+'억';
const VZ={c:['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#7a5cd6'], gray:'#c9cdd4', ink:'#1a1f2e', sub:'#667085', grid:'#eef0f3', font:'-apple-system,"Segoe UI","Malgun Gothic",sans-serif'};

const vzLabel={id:'vzLabel', afterDatasetsDraw(ch,_a,o){ if(!o||!o.fmt) return; const ctx=ch.ctx; ctx.save(); ctx.font='600 11px '+VZ.font; ctx.fillStyle=VZ.ink; const hz=ch.options.indexAxis==='y';

function tbl(head,rows,cls){ return `<div class="tw"><table class="${cls||''}"><tr>${head.map(h=>`<th class="l">${h}</th>`).join('')}</tr>`+

/* 본문 문단 안의 출처 표기 (보도 s0, s1) → 태그 + 각주 링크 */
function proseH(ch,t){
  const src=ch.src||[];
  return esc(t).replace(/\(([^()]*\bs\d+[^()]*)\)/g,(m,inner)=>{
    const body=inner.replace(/\bs(\d+)\b/g,(_,n)=>{ const i=+n, x=src[i];
      return x?`<a href="${esc(x.u)}" target="_blank" rel="noopener" title="${esc(x.t)}">[${i+1}]</a>`:`[?]`; });
    return `<span class="sx">(${body})</span>`;
  });
}

/* ───────── 메타 줄 (작성일 규칙) */
function metaLine(written){
  const bits=[];
  if(written) bits.push(`<b>작성일</b> ${esc(written)}`);
  bits.push(`<b>분류</b> ${esc(TREE.updated||'—')}`);
  if(priceDay()) bits.push(`<b>주가·PER 기준일</b> ${priceDay()}`);
  if(BB&&BB.asof) bits.push(`<b>실적</b> ${esc(BB.asof)} 기준 (수집 ${esc(String(BB.updated||'').slice(0,10))})`);
  return `<div class="meta">${bits.join(' · ')}</div>`;
}

/* ───────── peer 표·차트 (같은 분야 비교) */
function peerTable(codes,me){
  const rows=codes.map(c=>{ const v=sv(c); const f=((BB.co[c]||{}).fin)||{};
    const r4=(f.rq||[]).slice(-4), o4=(f.oq||[]).slice(-4);
    const ttmR=r4.every(x=>x!=null)&&r4.length===4?r4.reduce((a,b)=>a+b,0):null;
    const ttmO=o4.every(x=>x!=null)&&o4.length===4?o4.reduce((a,b)=>a+b,0):null;
    const opm=(ttmR&&ttmO!=null&&ttmR>0)?ttmO/ttmR*100:null;
    return {c,v,ttmR,opm};
  });
  return `<div class="tw"><table><tr><th class="l">기업</th><th>시가총액</th><th>주가</th><th>PER</th><th>PBR</th><th>ROE</th><th>최근 4분기 매출</th><th>영업이익률</th><th class="l">주요 사업</th></tr>`+
   rows.map(r=>`<tr class="${me===r.c?'me':''}"><td class="l nw">${coLink(r.c)} <small style="color:#98a2b3">${r.c}</small></td>

function evCluster(ev){ const by={}; for(const e of ev||[]){ (by[e.c+'|'+e.k]=by[e.c+'|'+e.k]||[]).push(e); }
  const out=[]; for(const k in by){ const g=by[k].slice().sort((a,b)=>(b.d||'').localeCompare(a.d||''));

    for(const e of g) for(const f of ['amt','who','why','how','pct','prc']) if(base[f]==null&&e[f]!=null) base[f]=e[f];
    base.d=last.d; base.d0=g[g.length-1].d; base.n=g.length; out.push(base); }
  return out.sort((a,b)=>(b.d||'').localeCompare(a.d||'')); }

        <div class="pos">${esc(c.pos||'')}</div>
        ${c.alert?`<div class="warnfc"><b>주의</b> — ${esc(c.alert)}</div>`:''}`);
      if((c.products||[]).length) h.push(`<div class="tw" style="margin-bottom:8px"><table><tr><th class="l">주요 제품</th><th class="l">어디에 어떻게 쓰이는가</th><th class="l">비중·규모</th></tr>
        ${c.products.map(p=>`<tr><td class="l nw">${p.photo?`<a href="${esc(p.photo)}" target="_blank" rel="noopener">${esc(p.n)}</a>`:esc(p.n)}</td><td class="l">${esc(p.use||'')}</td><td class="l mini">${esc(p.share||'—')}</td></tr>`).join('')}</table></div>`);
      if((c.customers||[]).length) h.push(`<div class="mini" style="margin-bottom:8px"><b>고객사</b> — ${c.customers.map(x=>claim(ch,x)).join(' / ')}</div>`);
      h.push(`<div class="sr2">
        <div class="strongbox"><h3>특장점</h3><ul class="sg">${(c.strong||[]).map(x=>`<li>${claim(ch,x)}</li>`).join('')||'<li class="mini">조사 중</li>'}</ul></div>
        <div class="riskbox"><h3>리스크 요인</h3><ul class="rk">${(c.risk||[]).map(x=>`<li>${claim(ch,x)}</li>`).join('')||'<li class="mini">조사 중</li>'}</ul></div>
      </div></div>`);
    }
  }
  if((ch.watch||[]).length) h.push(`<h2>앞으로 볼 지표</h2><div class="card"><ul class="pl dot">${ch.watch.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`);
  if((ch.unknown||[]).length) h.push(`<h2>확인하지 못한 것</h2><div class="note"><ul class="pl dot" style="margin:0">${ch.unknown.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`);
  if((ch.src||[]).length) h.push(`<h2>출처</h2><div class="card mini"><ol style="margin-left:18px">${ch.src.map(s=>`<li><a href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.t)}</a></li>`).join('')}</ol></div>`);
  $('main').innerHTML=h.join('');
  const be=$('bEasy'), bd=$('bDeep');
  if(be) be.onclick=()=>{ be.classList.add('on'); bd.classList.remove('on'); $('vEasy').style.display=''; $('vDeep').style.display='none'; };
  if(bd) bd.onclick=()=>{ bd.classList.add('on'); be.classList.remove('on'); $('vDeep').style.display=''; $('vEasy').style.display='none'; };
  peerCharts('gp',codes.slice(0,14),null);
}

/* ───────── 기업 */
function renderCompany(code){
  killCharts();
  if(!TREE.co[code]){ $('main').innerHTML='<div class="card">이 교과서에 없는 종목입니다. <a href="#">처음으로</a></div>'; return; }
  const gs=groupsOf(code), r=chCo(code), ch=r&&r.ch, c=r&&r.co, v=sv(code), prd=PRD[code]||{};
  const fb=finBlocks(code), eb=evBlocks(code);
  const h=[`<div class="crumb"><a href="#">2차전지 교과서</a>${gs.length?` › <a href="#t=${gs[0][0].id}">${esc(gs[0][0].name)}</a> › <a href="#g=${gs[0][2].id}">${esc(gs[0][2].name)}</a>`:''}</div>`,
    `<h1>${esc(coN(code))} <small>${code} · ${esc(prd.m==='K'?'KOSPI':prd.m==='Q'?'KOSDAQ':prd.m||'')}</small></h1>`,
    `<div class="lead">${esc(prd.p||'')}</div>`,
    metaLine(ch?ch.written:null)];
  if(gs.length>1) h.push(`<div class="mini" style="margin:-6px 0 10px">이 회사는 세분류 ${gs.length}곳에 들어간다: ${gs.map(([T,M,g])=>`<a href="#g=${g.id}">${esc(g.name)}</a>`).join(' · ')}</div>`);
  h.push(`<div class="kpis">
    <div class="kpi"><div class="k">시가총액</div><div class="v">${eok(v.cap)}</div><div class="n">주가 ${f0(v.px)}원 · ${priceDay()||'—'}</div></div>
    <div class="kpi"><div class="k">PER</div><div class="v">${v.per==null?'—':f1(v.per)}</div><div class="n">${v.per==null?'적자이거나 값 없음':'배'}</div></div>
    <div class="kpi"><div class="k">PBR</div><div class="v">${v.pbr==null?'—':f1(v.pbr)}</div><div class="n">배</div></div>
    <div class="kpi"><div class="k">ROE</div><div class="v">${v.roe==null?'—':f1(v.roe)+'%'}</div><div class="n">EPS ÷ BPS</div></div>
  </div>`);
  if(c){
    const chHref=(ch.groups||[]).length?`#g=${ch.groups[0]}`:`#ch=${ch.id}`;
    h.push(`<div class="nb"><b>이 분야에서의 자리</b> — ${esc(c.pos||'')} <span class="mini">· <a href="${chHref}">${esc(ch.title)}</a> 장에서 가져옴</span></div>`);
    if(c.alert) h.push(`<div class="warnfc"><b>주의</b> — ${esc(c.alert)}</div>`);
    const other=Object.values(CHD.ch||{}).filter(x=>x.id!==ch.id&&(x.companies||[]).some(y=>y.code===code));
    if(other.length) h.push(`<div class="mini" style="margin:-6px 0 10px">이 회사는 다른 장에도 나온다: ${other.map(x=>`<a href="${(x.groups||[]).length?`#g=${x.groups[0]}`:`#ch=${x.id}`}">${esc(x.title)}</a>`).join(' · ')}</div>`);
    if((c.products||[]).length) h.push(`<h2>주요 제품 — 어디에 어떻게 쓰이는가</h2><div class="tw" style="margin-bottom:12px"><table><tr><th class="l">제품</th><th class="l">쓰이는 곳과 방식</th><th class="l">비중·규모</th></tr>
      ${c.products.map(p=>`<tr><td class="l nw">${p.photo?`<a href="${esc(p.photo)}" target="_blank" rel="noopener">${esc(p.n)}</a>`:esc(p.n)}</td><td class="l">${esc(p.use||'')}</td><td class="l mini">${esc(p.share||'—')}</td></tr>`).join('')}</table></div>
      <div class="mini" style="margin:-8px 0 12px">제품명을 누르면 회사 공식 제품 페이지로 간다. 제품 사진은 이 사이트에 옮겨 싣지 않는다.</div>`);
    if((c.customers||[]).length) h.push(`<h2>고객사</h2><div class="card"><ul class="pl dot">${c.customers.map(x=>`<li>${claim(ch,x)}</li>`).join('')}</ul></div>`);
    h.push(`<h2>특장점과 리스크 요인</h2><div class="sr2">
      <div class="strongbox"><h3>특장점 <small>경쟁사 대비 더 잘하는 것</small></h3><ul class="sg">${(c.strong||[]).map(x=>`<li>${claim(ch,x)}</li>`).join('')||'<li class="mini">조사 중</li>'}</ul></div>
      <div class="riskbox"><h3>리스크 요인 <small>실적·주가를 망칠 수 있는 것</small></h3><ul class="rk">${(c.risk||[]).map(x=>`<li>${claim(ch,x)}</li>`).join('')||'<li class="mini">조사 중</li>'}</ul></div></div>`);
    if((ch.compare_axes||[]).length&&c.axes) h.push(`<div class="tw" style="margin-bottom:12px"><table>${ch.compare_axes.map(a=>`<tr><th class="l" style="width:28%">${esc(a)}</th><td class="l">${esc(c.axes[a]||'—')}</td></tr>`).join('')}</table></div>`);
  } else {
    h.push(`<div class="note">이 기업은 아직 <b>글로 쓴 조사가 없다.</b> 아래 숫자(5년 실적·공시 이력·같은 분야 비교)는 자동 수집된 것이고, 특장점·리스크는 분야를 지정해 요청하면 조사해 넣는다.</div>`);
  }
  h.push(`<h2>5개년 실적 <small>분기·연간 · DART 공시값</small></h2>`+fb.html);
  h.push(`<h2>자금조달 · 인수매각 · 지배구조 이력 <small>최근 5년</small></h2>`+eb.html);
  const peers=gs.length?[...new Set(gs.flatMap(([T,M,g])=>g.co))].sort(byCap):[];
  if(peers.length>1){
    h.push(`<h2>같은 세분류 기업과 비교 <small>${gs.map(([T,M,g])=>esc(g.name)).join(' · ')}</small></h2>`+peerTable(peers,code)+peerChartsHtml('cp'));
  }
  h.push(`<div class="btns noprint"><a href="https://dart.fss.or.kr/dsab007/main.do" target="_blank" rel="noopener">DART에서 이 회사 공시 보기</a>
    <a href="/deep.html#c=${code}">종목 딥다이브</a><a href="/bands.html#c=${code}">밴드·V차트</a><button type="button" onclick="window.print()">인쇄 / PDF</button></div>`);
  $('main').innerHTML=h.join('');
  fb.draw(); eb.draw();
  if(peers.length>1) peerCharts('cp',peers.slice(0,14),code);
}

/* ───────── 라우팅 */
function route(){
  const hs=location.hash||''; let m;
  const cur={};
  if((m=hs.match(/^#ch=([\w-]+)/))) cur.cid=m[1];
  else if((m=hs.match(/^#g=([\w-]+)/))) cur.gid=m[1];
  else if((m=hs.match(/^#c=([0-9A-Z]{6})/))) cur.code=m[1];
  else if((m=hs.match(/^#t=([\w-]+)/))) cur.top=m[1];
  if(cur.gid){ const p=pathOf(cur.gid); if(p) cur.top=p[0].id; }
  if(cur.code){ const g=groupsOf(cur.code); if(g.length){ cur.gid=g[0][2].id; cur.top=g[0][0].id; } }
  renderSide(cur);
  if(hs.startsWith('#ch=')) renderChapter(hs.slice(4).split('&')[0]);
  else if(hs.startsWith('#c=')&&cur.code) renderCompany(cur.code);
  else if(hs.startsWith('#g=')) renderGroup(hs.slice(3).split('&')[0]);
  else if(hs.startsWith('#t=')) renderTop(hs.slice(3).split('&')[0]);
  else renderHome();
  if(!hs) window.scrollTo(0,0);
}

(async function boot(){
  const [tree,chd,bb,svj,prd]=await Promise.all([
    j('/data/battbook_tree.json'), j('/data/battbook_ch.json'), j('/data/battbook.json'),
    j('/data/stockvals.json'), j('/data/products.json')]);
  if(!tree){ $('main').innerHTML='<div class="card">분류 파일(battbook_tree.json)을 불러오지 못했습니다.</div>'; return; }
  TREE=tree; CHD=chd||{ch:{}}; BB=bb||{co:{},ql:[],ay:[]};
  if(!BB.co) BB.co={};
  SV=(svj&&svj.map)||{}; SV._at=(svj&&svj.updated)||''; PRD=(prd&&prd.map)||{};
  for(const id in (CHD.ch||{})){ const ch=CHD.ch[id];
    for(const g of (ch.groups||[])) G2C[g]=id;
    (ch.companies||[]).forEach((c,i)=>{ if(!CO2CH[c.code]) CO2CH[c.code]=[id,i]; }); }
  addEventListener('hashchange',route); route();
})();
</script>
